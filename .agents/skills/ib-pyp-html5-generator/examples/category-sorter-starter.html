<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category Sorter Starter - IB PYP Classification Template</title>
  <style>
    :root {
      --bg: #FFFDF0;
      --ink: #111111;
      --yellow: #FFE156;
      --coral: #FF6584;
      --teal: #4ECDC4;
      --blue: #38B6FF;
      --purple: #B388FF;
      --white: #FFFFFF;
      --border: 3.5px solid var(--ink);
      --shadow: 4px 4px 0 var(--ink);
      --shadow-sm: 2px 2px 0 var(--ink);
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 12px 16px 36px;
    }

    .container { max-width: 960px; margin: 0 auto; }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .nav-link {
      background: var(--yellow);
      border: var(--border);
      box-shadow: var(--shadow-sm);
      border-radius: 999px;
      padding: 6px 14px;
      font-weight: 800;
      font-size: 0.9rem;
      color: var(--ink);
      text-decoration: none;
    }

    .hero {
      background: var(--white);
      border: var(--border);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      padding: 14px 18px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .hero-title { font-size: 1.3rem; font-weight: 900; }
    .hero-tag {
      background: var(--teal);
      border: 2px solid var(--ink);
      border-radius: 8px;
      padding: 4px 10px;
      font-weight: 800;
      font-size: 0.8rem;
    }

    /* Target Drop Bins */
    .bin-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }
    @media (max-width: 680px) {
      .bin-grid { grid-template-columns: 1fr; }
    }

    .bin {
      background: var(--white);
      border: var(--border);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      padding: 14px;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      transition: background 0.15s, transform 0.1s;
    }
    .bin.drag-over { background: #FFF9D2; transform: scale(1.02); }

    .bin-header {
      font-size: 1rem;
      font-weight: 900;
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 2px dashed var(--ink);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .bin-count {
      background: var(--yellow);
      border: 2px solid var(--ink);
      border-radius: 999px;
      font-size: 0.75rem;
      padding: 2px 8px;
      font-weight: 800;
    }

    .bin-items {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-content: flex-start;
    }

    /* Card Tray (Items to be sorted) */
    .tray-panel {
      background: var(--white);
      border: var(--border);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
    }

    .tray-title {
      font-weight: 900;
      font-size: 1.05rem;
      margin-bottom: 12px;
    }

    .tray-items {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      min-height: 50px;
    }

    .item-card {
      background: #FDFDFD;
      border: 2px solid var(--ink);
      box-shadow: 2px 2px 0 var(--ink);
      border-radius: 10px;
      padding: 8px 14px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: grab;
      user-select: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.1s;
    }
    .item-card:active { cursor: grabbing; transform: scale(0.96); }

    .btn-check {
      display: block;
      width: 100%;
      padding: 14px;
      background: var(--coral);
      color: var(--white);
      border: var(--border);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      font-size: 1.05rem;
      font-weight: 900;
      cursor: pointer;
    }
    .btn-check:active { transform: translate(2px, 2px); }

    .toast {
      margin-top: 14px;
      padding: 12px;
      border: 2px solid var(--ink);
      border-radius: 10px;
      font-weight: 800;
      display: none;
      text-align: center;
    }
    .toast.show { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <nav class="nav-bar">
      <a class="nav-link" href="../index.html">← Back</a>
      <span style="font-weight: 800; font-size: 0.85rem;">IB PYP: How We Organize Ourselves</span>
    </nav>

    <header class="hero">
      <div>
        <h1 class="hero-title">Community Helpers & Tools Sort 🚒</h1>
        <p style="font-size: 0.85rem; color: #555;">Central Idea: People in communities have roles and tools to help everyone.</p>
      </div>
      <span class="hero-tag">Social Skills</span>
    </header>

    <!-- Drop Bins -->
    <main class="bin-grid">
      <section class="bin" id="bin-doctor" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'doctor')">
        <div class="bin-header">
          <span>🏥 Doctor</span>
          <span class="bin-count" id="count-doctor">0 / 2</span>
        </div>
        <div class="bin-items" id="items-doctor"></div>
      </section>

      <section class="bin" id="bin-firefighter" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'firefighter')">
        <div class="bin-header">
          <span>🚒 Firefighter</span>
          <span class="bin-count" id="count-firefighter">0 / 2</span>
        </div>
        <div class="bin-items" id="items-firefighter"></div>
      </section>

      <section class="bin" id="bin-teacher" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'teacher')">
        <div class="bin-header">
          <span>🏫 Teacher</span>
          <span class="bin-count" id="count-teacher">0 / 2</span>
        </div>
        <div class="bin-items" id="items-teacher"></div>
      </section>
    </main>

    <!-- Card Tray -->
    <section class="tray-panel">
      <div class="tray-title">📦 Tools & Equipment Tray (Drag or Tap to Place)</div>
      <div class="tray-items" id="tray"></div>
    </section>

    <button class="btn-check" onclick="checkSorting()">Check Community Sorting ✨</button>
    <div class="toast" id="toast"></div>
  </div>

  <script>
    // Web Audio Sound FX
    class SoundFX {
      constructor() { this.ctx = null; }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }
      playCorrect() {
        this.init();
        const t = this.ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, t + i * 0.05);
          gain.gain.setValueAtTime(0.12, t + i * 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.05 + 0.2);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t + i * 0.05);
          osc.stop(t + i * 0.05 + 0.25);
        });
      }
      playBuzz() {
        this.init();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, t);
        gain.gain.setValueAtTime(0.1, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.2);
      }
    }
    const sfx = new SoundFX();

    const items = [
      { id: "i1", name: "Stethoscope 🩺", role: "doctor" },
      { id: "i2", name: "Thermometer 🌡️", role: "doctor" },
      { id: "i3", name: "Water Hose 🧯", role: "firefighter" },
      { id: "i4", name: "Safety Helmet ⛑️", role: "firefighter" },
      { id: "i5", name: "Whiteboard & Pen 🖍️", role: "teacher" },
      { id: "i6", name: "Storybook 📚", role: "teacher" }
    ];

    let currentPlacements = { doctor: [], firefighter: [], teacher: [] };

    function initTray() {
      const tray = document.getElementById('tray');
      tray.innerHTML = '';
      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'item-card';
        card.id = item.id;
        card.textContent = item.name;
        card.draggable = true;
        card.ondragstart = (e) => e.dataTransfer.setData('text/plain', item.id);
        // Also support tap-to-cycle placement for touch devices
        card.onclick = () => tapPlace(item.id);
        tray.appendChild(card);
      });
    }

    function allowDrop(e) {
      e.preventDefault();
      e.currentTarget.classList.add('drag-over');
    }

    function handleDrop(e, targetRole) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over');
      const itemId = e.dataTransfer.getData('text/plain');
      placeItemInRole(itemId, targetRole);
    }

    function tapPlace(itemId) {
      // Find where it is currently
      const roles = ['doctor', 'firefighter', 'teacher'];
      let foundRole = null;
      roles.forEach(r => {
        if (currentPlacements[r].includes(itemId)) foundRole = r;
      });
      // Cycle to next role or tray
      if (!foundRole) {
        placeItemInRole(itemId, 'doctor');
      } else {
        const nextIdx = roles.indexOf(foundRole) + 1;
        if (nextIdx < roles.length) {
          placeItemInRole(itemId, roles[nextIdx]);
        } else {
          // Return to tray
          currentPlacements[foundRole] = currentPlacements[foundRole].filter(id => id !== itemId);
          const el = document.getElementById(itemId);
          document.getElementById('tray').appendChild(el);
          updateCounts();
        }
      }
    }

    function placeItemInRole(itemId, role) {
      const el = document.getElementById(itemId);
      if (!el) return;
      ['doctor', 'firefighter', 'teacher'].forEach(r => {
        currentPlacements[r] = currentPlacements[r].filter(id => id !== itemId);
      });
      currentPlacements[role].push(itemId);
      document.getElementById(`items-${role}`).appendChild(el);
      updateCounts();
    }

    function updateCounts() {
      ['doctor', 'firefighter', 'teacher'].forEach(r => {
        document.getElementById(`count-${r}`).textContent = `${currentPlacements[r].length} / 2`;
      });
    }

    function checkSorting() {
      const totalSorted = currentPlacements.doctor.length + currentPlacements.firefighter.length + currentPlacements.teacher.length;
      const toast = document.getElementById('toast');
      toast.className = 'toast show';

      if (totalSorted < items.length) {
        toast.style.background = '#FFF3CD';
        toast.textContent = '👆 Please sort all 6 tools from the tray first!';
        sfx.playBuzz();
        return;
      }

      let allCorrect = true;
      items.forEach(item => {
        if (!currentPlacements[item.role].includes(item.id)) allCorrect = false;
      });

      if (allCorrect) {
        toast.style.background = '#D4EDDA';
        toast.textContent = '🎉 Incredible job! All community tools are sorted to the right helpers!';
        sfx.playCorrect();
      } else {
        toast.style.background = '#F8D7DA';
        toast.textContent = '🤔 Some tools are in the wrong place. Think about what each helper uses every day!';
        sfx.playBuzz();
      }
    }

    initTray();
  </script>
</body>
</html>
