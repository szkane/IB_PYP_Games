<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sequence Builder Starter - IB PYP Life Cycle & Story Retell</title>
  <style>
    :root {
      --bg: #FFFDF0;
      --ink: #111111;
      --yellow: #FFE156;
      --coral: #FF6584;
      --teal: #4ECDC4;
      --purple: #B388FF;
      --white: #FFFFFF;
      --border: 3.5px solid var(--ink);
      --shadow: 4px 4px 0 var(--ink);
      --shadow-sm: 2px 2px 0 var(--ink);
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 12px 16px 36px;
    }

    .container { max-width: 960px; margin: 0 auto; }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .nav-link {
      background: var(--yellow);
      border: var(--border);
      box-shadow: var(--shadow-sm);
      border-radius: 999px;
      padding: 6px 14px;
      font-weight: 800;
      font-size: 0.9rem;
      color: var(--ink);
      text-decoration: none;
    }

    .hero {
      background: var(--white);
      border: var(--border);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      padding: 14px 18px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .hero-title { font-size: 1.3rem; font-weight: 900; }
    .hero-tag {
      background: var(--purple);
      border: 2px solid var(--ink);
      border-radius: 8px;
      padding: 4px 10px;
      font-weight: 800;
      font-size: 0.8rem;
    }

    /* Sequence Destination Slots */
    .timeline-container {
      background: var(--white);
      border: var(--border);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
    }

    .timeline-title {
      font-size: 1.1rem;
      font-weight: 900;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .slots-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      position: relative;
    }
    @media (max-width: 720px) {
      .slots-grid { grid-template-columns: 1fr 1fr; }
    }

    .slot {
      background: #FDFDFD;
      border: 2.5px dashed var(--ink);
      border-radius: 12px;
      min-height: 140px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: background 0.1s, transform 0.1s;
    }
    .slot.drag-over { background: #FFF9D2; }
    .slot.filled { border-style: solid; background: #FFF; }

    .slot-num {
      background: var(--yellow);
      border: 2px solid var(--ink);
      border-radius: 50%;
      width: 28px;
      height: 28px;
      font-weight: 900;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
    }

    /* Card Tray (Scrambled pool) */
    .tray-panel {
      background: var(--white);
      border: var(--border);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 18px;
    }

    .tray-items {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      min-height: 100px;
    }

    .stage-card {
      background: var(--white);
      border: var(--border);
      box-shadow: var(--shadow-sm);
      border-radius: 12px;
      padding: 10px 14px;
      width: 130px;
      text-align: center;
      cursor: grab;
      user-select: none;
      transition: transform 0.1s;
    }
    .stage-card:active { transform: scale(0.96); }
    .stage-icon { font-size: 2.2rem; margin-bottom: 4px; }
    .stage-name { font-weight: 800; font-size: 0.85rem; }

    .btn-check {
      width: 100%;
      padding: 14px;
      background: var(--coral);
      color: var(--white);
      border: var(--border);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      font-size: 1.05rem;
      font-weight: 900;
      cursor: pointer;
    }
    .btn-check:active { transform: translate(2px, 2px); }

    .toast {
      margin-top: 14px;
      padding: 12px;
      border: 2px solid var(--ink);
      border-radius: 10px;
      font-weight: 800;
      text-align: center;
      display: none;
    }
    .toast.show { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <nav class="nav-bar">
      <a class="nav-link" href="../index.html">← Back</a>
      <span style="font-weight: 800; font-size: 0.85rem;">IB PYP: Sharing The Planet</span>
    </nav>

    <header class="hero">
      <div>
        <h1 class="hero-title">Sunflower Life Cycle Sequence 🌻</h1>
        <p style="font-size: 0.85rem; color: #555;">Central Idea: Living things grow and transform in predictable natural cycles.</p>
      </div>
      <span class="hero-tag">Key Concept: Change</span>
    </header>

    <!-- Ordered Timeline Slots -->
    <main class="timeline-container">
      <div class="timeline-title">
        <span>Chronological Sequence Timeline</span>
        <button class="nav-link" style="padding: 4px 10px; font-size: 0.8rem;" onclick="resetSequence()">Reset 🔄</button>
      </div>

      <div class="slots-grid">
        <div class="slot" id="slot-0" ondragover="allowDrop(event)" ondrop="handleDrop(event, 0)">
          <div class="slot-num">1</div>
          <span style="font-size: 0.75rem; color: #888;">First Stage</span>
        </div>
        <div class="slot" id="slot-1" ondragover="allowDrop(event)" ondrop="handleDrop(event, 1)">
          <div class="slot-num">2</div>
          <span style="font-size: 0.75rem; color: #888;">Second Stage</span>
        </div>
        <div class="slot" id="slot-2" ondragover="allowDrop(event)" ondrop="handleDrop(event, 2)">
          <div class="slot-num">3</div>
          <span style="font-size: 0.75rem; color: #888;">Third Stage</span>
        </div>
        <div class="slot" id="slot-3" ondragover="allowDrop(event)" ondrop="handleDrop(event, 3)">
          <div class="slot-num">4</div>
          <span style="font-size: 0.75rem; color: #888;">Final Bloom</span>
        </div>
      </div>
    </main>

    <!-- Unordered Card Tray -->
    <section class="tray-panel">
      <div style="font-weight: 800; margin-bottom: 10px;">Stages Tray (Drag or Tap to Place)</div>
      <div class="tray-items" id="cardTray"></div>
    </section>

    <button class="btn-check" onclick="checkOrder()">Verify Cycle Order ✨</button>
    <div class="toast" id="toast"></div>
  </div>

  <script>
    // Web Audio Fanfare
    class SoundFX {
      constructor() { this.ctx = null; }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }
      playFanfare() {
        this.init();
        const t = this.ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, t + idx * 0.08);
          gain.gain.setValueAtTime(0.15, t + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, t + idx * 0.08 + 0.4);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t + idx * 0.08);
          osc.stop(t + idx * 0.08 + 0.45);
        });
      }
      playBuzz() {
        this.init();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, t);
        gain.gain.setValueAtTime(0.1, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.2);
      }
    }
    const sfx = new SoundFX();

    const stages = [
      { id: "s1", name: "Planting Seed 🌱", icon: "🌰", order: 0 },
      { id: "s2", name: "Green Sprout 🌿", icon: "🌱", order: 1 },
      { id: "s3", name: "Growing Stem 🎋", icon: "🌿", order: 2 },
      { id: "s4", name: "Sunflower Bloom 🌻", icon: "🌻", order: 3 }
    ];

    // Scramble order in tray
    let trayCards = [...stages].sort(() => Math.random() - 0.5);
    const slots = [null, null, null, null];

    function renderTray() {
      const tray = document.getElementById('cardTray');
      tray.innerHTML = '';
      trayCards.forEach(s => {
        const card = document.createElement('div');
        card.className = 'stage-card';
        card.id = s.id;
        card.draggable = true;
        card.ondragstart = (e) => e.dataTransfer.setData('text/plain', s.id);
        card.onclick = () => tapPlace(s.id);
        card.innerHTML = `
          <div class="stage-icon">${s.icon}</div>
          <div class="stage-name">${s.name}</div>
        `;
        tray.appendChild(card);
      });
    }

    function allowDrop(e) {
      e.preventDefault();
      e.currentTarget.classList.add('drag-over');
    }

    function handleDrop(e, slotIdx) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      placeInSlot(id, slotIdx);
    }

    function tapPlace(id) {
      const emptyIdx = slots.indexOf(null);
      if (emptyIdx !== -1) {
        placeInSlot(id, emptyIdx);
      }
    }

    function placeInSlot(id, slotIdx) {
      // Remove from existing slot if any
      const oldIdx = slots.indexOf(id);
      if (oldIdx !== -1) {
        slots[oldIdx] = null;
        renderSlot(oldIdx);
      }

      // If slot had an existing card, send it back to tray
      if (slots[slotIdx]) {
        trayCards.push(stages.find(s => s.id === slots[slotIdx]));
      }

      slots[slotIdx] = id;
      trayCards = trayCards.filter(s => s.id !== id);
      renderSlot(slotIdx);
      renderTray();
    }

    function renderSlot(idx) {
      const el = document.getElementById(`slot-${idx}`);
      const id = slots[idx];
      if (!id) {
        el.className = 'slot';
        el.innerHTML = `<div class="slot-num">${idx + 1}</div><span style="font-size:0.75rem; color:#888;">Empty Slot</span>`;
      } else {
        const item = stages.find(s => s.id === id);
        el.className = 'slot filled';
        el.innerHTML = `
          <div class="slot-num">${idx + 1}</div>
          <div class="stage-icon" style="font-size:1.8rem;">${item.icon}</div>
          <div class="stage-name" style="font-size:0.8rem;">${item.name}</div>
        `;
        // Tap to remove back to tray
        el.onclick = () => {
          slots[idx] = null;
          trayCards.push(item);
          renderSlot(idx);
          renderTray();
        };
      }
    }

    function resetSequence() {
      for (let i = 0; i < 4; i++) { slots[i] = null; renderSlot(i); }
      trayCards = [...stages].sort(() => Math.random() - 0.5);
      renderTray();
      document.getElementById('toast').className = 'toast';
    }

    function checkOrder() {
      const toast = document.getElementById('toast');
      toast.className = 'toast show';

      if (slots.includes(null)) {
        toast.style.background = '#FFF3CD';
        toast.textContent = '👆 Please place all 4 stages into the slots first!';
        sfx.playBuzz();
        return;
      }

      let correct = true;
      slots.forEach((id, idx) => {
        const stage = stages.find(s => s.id === id);
        if (stage.order !== idx) correct = false;
      });

      if (correct) {
        toast.style.background = '#D4EDDA';
        toast.textContent = '🎉 Perfect Cycle! Seeds sprout into stems, which bloom into sunflowers and drop new seeds!';
        sfx.playFanfare();
      } else {
        toast.style.background = '#F8D7DA';
        toast.textContent = '🤔 Not quite the right order. Think about what happens right after the seed is planted!';
        sfx.playBuzz();
      }
    }

    renderTray();
  </script>
</body>
</html>
