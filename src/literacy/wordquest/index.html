<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WordQuest - Word Search & Crossword</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="pyp-map-link" href="../../index.html" aria-label="Back to PYP curriculum map">PYP Map</a>
  <div class="voice-switcher" id="voice-switcher" style="display:none">
    <button class="accent-btn active" data-accent="default" title="Default voice">🔊</button>
    <button class="accent-btn" data-accent="us" title="American English">🇺🇸</button>
    <button class="accent-btn" data-accent="uk" title="British English">🇬🇧</button>
    <select class="voice-select" aria-label="Voice selection"></select>
  </div>
  <div id="app"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
