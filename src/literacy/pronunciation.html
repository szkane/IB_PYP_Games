<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>单词发音学习</title>
  <style>
    /* CSS Variables for theming */
    :root {
      --background-color: #f0f8ff;
      --text-color: #333;
      --primary-color: #1a73e8;
      --primary-hover-color: #1557b0;
      --border-color: #dfe1e5;
      --shadow-color: rgba(32, 33, 36, 0.28);
      --status-color: #5f6368;
      --font-family: 'Microsoft YaHei', sans-serif;
    }

    /* Dark Mode */
    .dark-mode {
      --background-color: #222;
      --text-color: #eee;
      --primary-color: #64b5f6;
      --primary-hover-color: #42a5f5;
      --border-color: #444;
      --shadow-color: rgba(0, 0, 0, 0.5);
      --status-color: #ccc;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: var(--font-family);
      background: var(--background-color);
      color: var(--text-color);
      transition: background 0.3s, color 0.3s;
      /* Smooth transition for theme change */
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 10vh;
      width: 90%;
      max-width: 600px;
    }

    .logo {
      font-size: 4rem;
      margin-bottom: 2rem;
      color: var(--primary-color);
      font-weight: bold;
    }

    .search-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .search-input {
      width: 100%;
      height: 44px;
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 0 20px;
      font-size: 16px;
      outline: none;
      box-shadow: none;
      transition: box-shadow 0.3s, border-color 0.3s;
      background-color: transparent;
      /* Make the input field transparent */
      color: var(--text-color);
    }

    .search-input:hover,
    .search-input:focus {
      box-shadow: 0 1px 6px var(--shadow-color);
      border-color: var(--primary-color);
    }

    .buttons {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }

    .button {
      background-color: var(--primary-color);
      border: 1px solid var(--primary-color);
      border-radius: 4px;
      color: white;
      font-size: 14px;
      padding: 0 16px;
      height: 36px;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.3s, border-color 0.3s, box-shadow 0.3s;
    }

    .button:hover {
      background-color: var(--primary-hover-color);
      border-color: var(--primary-hover-color);
      box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
    }

    .status {
      margin-top: 20px;
      color: var(--status-color);
      font-size: 14px;
    }

    .rate-control {
      width: 100%;
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .rate-control label {
      font-size: 14px;
      color: var(--status-color);
    }

    .rate-slider {
      width: 100%;
      accent-color: var(--primary-color);
    }

    #downloadBtn {
      display: none;
      margin-top: 10px;
      text-decoration: none;
      background-color: var(--primary-color);
      color: white;
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 14px;
      transition: background-color 0.3s;
    }

    #downloadBtn:hover {
      background-color: var(--primary-hover-color);
    }

    /* Responsive Design */
    @media (max-width: 600px) {
      .logo {
        font-size: 3rem;
      }

      .search-input {
        font-size: 14px;
      }

      .button {
        font-size: 12px;
        padding: 0 12px;
      }
    }

    /* Theme Toggle Button */
    .theme-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      cursor: pointer;
      background-color: transparent;
      border: none;
      font-size: 24px;
      color: var(--text-color);
    }

  </style>
</head>

<body>
  <button class="theme-toggle" id="themeToggle">☀️</button>
  <div class="container">
    <div class="logo">Pronunciation</div>
    <div class="search-box">
      <input type="text" class="search-input" placeholder="输入要朗读的单词..." id="wordInput">
      <div class="buttons">
        <button class="button" onclick="getAudio('en-US')">美式发音</button>
        <button class="button" onclick="getAudio('en-GB')">英式发音</button>
      </div>
      <div class="rate-control">
        <label for="rateSlider">语速: <span id="rateValue">0.7</span></label>
        <input id="rateSlider" class="rate-slider" type="range" min="0.1" max="1.3" step="0.1" value="0.7">
      </div>
    </div>
  </div>

  <div class="container" style="margin-top: 50px;">
    <div class="search-box">
      <select id="voiceSelect" class="search-input" style="margin-bottom: 20px;">
        <option value="">选择语音</option>
      </select>
      <button class="button" onclick="useBrowserTTS()">使用Browser TTS</button>
    </div>
  </div>
  <div class="status" id="status"></div>
  <script>
    // Theme Toggle Logic
    const themeToggle = document.getElementById('themeToggle');
    const body = document.body;
    const rateSlider = document.getElementById('rateSlider');
    const rateValue = document.getElementById('rateValue');

    themeToggle.addEventListener('click', () => {
      body.classList.toggle('dark-mode');
      if (body.classList.contains('dark-mode')) {
        themeToggle.textContent = '🌙';
      } else {
        themeToggle.textContent = '☀️';
      }
    });

    function getSpeechRate() {
      return Number(rateSlider.value);
    }

    rateSlider.addEventListener('input', () => {
      rateValue.textContent = rateSlider.value;
    });

    // 获取浏览器支持的语音列表
    function populateVoiceList() {
      const voices = speechSynthesis.getVoices();
      const voiceSelect = document.getElementById('voiceSelect');
      const currentSelection = voiceSelect.value;  // Store current selection

      // Clear existing options except the first one
      while (voiceSelect.options.length > 1) {
        voiceSelect.remove(1);
      }

      voices.forEach(voice => {
        if (voice.lang.startsWith('en')) {
          const option = document.createElement('option');
          option.value = voice.name;
          option.textContent = `${voice.name} (${voice.lang})`;
          voiceSelect.appendChild(option);

          // Restore previous selection if it matches
          if (voice.name === currentSelection) {
            option.selected = true;
          }
        }
      });
    }

    // 初始化时获取语音列表
    populateVoiceList();
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = populateVoiceList;
    }

    // 使用Browser TTS播放
    function useBrowserTTS() {
      const word = document.getElementById('wordInput').value.trim();
      const voiceSelect = document.getElementById('voiceSelect');
      const selectedVoice = voiceSelect.value;

      if (!word) {
        document.getElementById('status').textContent = '请输入单词';
        return;
      }

      if (!selectedVoice) {
        document.getElementById('status').textContent = '请选择语音';
        return;
      }

      document.getElementById('status').textContent = '正在播放发音...';

      try {
        const utterance = new SpeechSynthesisUtterance(word);
        const voices = speechSynthesis.getVoices();
        utterance.voice = voices.find(voice => voice.name === selectedVoice);
        utterance.rate = getSpeechRate();

        utterance.onend = function () {
          document.getElementById('status').textContent = '';
        };

        speechSynthesis.speak(utterance);
      } catch (error) {
        console.error('Error:', error);
        document.getElementById('status').textContent = '播放发音时出错，请重试';
      }
    }

    const PREFERRED_VOICES = {
      'en-US': [
        'Google US English 2 (Natural)',
        'Samantha',
        'Alex',
        'Microsoft Jenny Online (Natural) - English (United States)',
        'Google US English'
      ],
      'en-GB': [
        'Google UK English 2 (Natural)',
        'Serena',
        'Daniel',
        'Microsoft Sonia Online (Natural) - English (United Kingdom)',
        'Google UK English Female',
        'Google UK English Male'
      ]
    };

    function findPreferredVoice(accent) {
      const voices = speechSynthesis.getVoices();
      const preferredNames = PREFERRED_VOICES[accent] || [];

      for (const name of preferredNames) {
        const match = voices.find((voice) => voice.name === name);
        if (match) {
          return match;
        }
      }

      return voices.find((voice) => voice.lang === accent)
        || voices.find((voice) => voice.lang.startsWith(accent.split('-')[0]))
        || null;
    }

    function getAudio(accent) {
      const word = document.getElementById('wordInput').value.trim();
      if (!word) {
        document.getElementById('status').textContent = '请输入单词';
        return;
      }

      document.getElementById('status').textContent = '正在播放发音...';

      try {
        speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(word);
        const preferredVoice = findPreferredVoice(accent);

        if (preferredVoice) {
          utterance.voice = preferredVoice;
          utterance.lang = preferredVoice.lang;
        } else {
          utterance.lang = accent;
        }

        utterance.rate = getSpeechRate();

        utterance.onend = function () {
          document.getElementById('status').textContent = '';
        };

        utterance.onerror = function () {
          document.getElementById('status').textContent = '播放发音时出错，请重试';
        };

        speechSynthesis.speak(utterance);
      } catch (error) {
        console.error('Error:', error);
        document.getElementById('status').textContent = '播放发音时出错，请重试';
      }
    }
  </script>

  <a class="pyp-map-link" href="../index.html" aria-label="Back to PYP curriculum map">PYP Map</a>
  <style>
    .pyp-map-link { position: fixed; top: 12px; right: 12px; z-index: 9999; min-height: 44px; display: inline-flex; align-items: center; border: 2px solid #17211f; border-radius: 8px; padding: 8px 12px; background: #fffaf0; color: #17211f; text-decoration: none; font: 900 14px/1 ui-rounded, "Avenir Next", "Segoe UI", sans-serif; box-shadow: 3px 3px 0 #17211f; letter-spacing: 0; }
    .pyp-map-link:focus-visible { outline: 3px solid #f2b84b; outline-offset: 2px; }
    @media print { .pyp-map-link { display: none; } }
  </style>
</body>

</html>
