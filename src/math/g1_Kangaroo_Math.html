<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Kangaroo math G1 </title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans SC', sans-serif;
      background-color: #f0f9ff;
    }

    .game-card {
      transition: all 0.3s ease;
    }

    .game-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
    }

    .fade-in {
      animation: fadeIn 0.5s ease-in;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .bounce {
      animation: bounce 1s infinite;
    }

    @keyframes bounce {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- 图标组件 ---
    const IconScissor = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="6" cy="6" r="3" /><circle cx="6" cy="18" r="3" /><line x1="20" y1="4" x2="8.12" y2="15.88" /><line x1="14.47" y1="14.48" x2="20" y2="20" /><line x1="8.12" y1="8.12" x2="12" y2="12" /></svg>;
    const IconUsers = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M23 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></svg>;
    const IconMap = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 21 15 18 9 21 3 18 3 6" /><line x1="9" y1="3" x2="9" y2="21" /><line x1="15" y1="6" x2="15" y2="18" /></svg>;
    const IconHome = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><polyline points="9 22 9 12 15 12 15 22" /></svg>;

    // --- 模块 1: 剪绳子 (The Fencepost) ---
    const ModuleRope = ({ onBack }) => {
      const [cuts, setCuts] = useState(0);

      const handleCut = () => {
        if (cuts < 8) setCuts(cuts + 1);
      };

      const reset = () => setCuts(0);

      // 生成绳子段
      const segments = [];
      for (let i = 0; i <= cuts; i++) {
        segments.push(
          <div key={i} className="h-16 flex-1 bg-yellow-400 border-x-2 border-yellow-600 flex items-center justify-center text-yellow-900 font-bold text-xl relative">
            {i + 1}
            {i < cuts && (
              <div className="absolute -right-3 top-1/2 -translate-y-1/2 w-6 h-12 bg-gray-200 border-2 border-gray-400 rounded z-10 flex items-center justify-center shadow-lg">
                ✂️
              </div>
            )}
          </div>
        );
      }

      return (
        <div className="fade-in p-6 max-w-2xl mx-auto">
          <button onClick={onBack} className="mb-4 text-blue-500 flex items-center hover:underline">
            <IconHome className="mr-2" /> 返回大厅
          </button>
          <h2 className="text-3xl font-bold text-yellow-600 mb-2">✂️ 剪彩带魔法</h2>
          <p className="text-gray-600 mb-6">数一数：剪了几刀？变成了几段？</p>

          <div className="bg-white p-8 rounded-2xl shadow-xl border-4 border-yellow-100">
            <div className="flex justify-between items-center mb-8 gap-1">
              {segments}
            </div>

            <div className="flex justify-center gap-8 mb-8">
              <div className="text-center bg-blue-50 p-4 rounded-xl min-w-[100px]">
                <div className="text-sm text-blue-600 font-bold uppercase tracking-wider">剪刀 (Cuts)</div>
                <div className="text-4xl font-bold text-blue-800">{cuts}</div>
              </div>
              <div className="text-center bg-green-50 p-4 rounded-xl min-w-[100px]">
                <div className="text-sm text-green-600 font-bold uppercase tracking-wider">段数 (Pieces)</div>
                <div className="text-4xl font-bold text-green-800">{cuts + 1}</div>
              </div>
            </div>

            <div className="flex justify-center gap-4">
              <button
                onClick={handleCut}
                disabled={cuts >= 8}
                className={`px-8 py-4 rounded-full text-xl font-bold text-white shadow-lg transition transform active:scale-95 ${cuts >= 8 ? 'bg-gray-300' : 'bg-yellow-500 hover:bg-yellow-400'}`}
              >
                ✂️ 剪一刀
              </button>
              <button onClick={reset} className="px-6 py-4 rounded-full text-lg font-bold text-gray-500 bg-gray-100 hover:bg-gray-200 transition">
                🔄 重置
              </button>
            </div>
          </div>

          <div className="mt-6 bg-blue-50 p-4 rounded-xl border border-blue-200">
            <h3 className="font-bold text-blue-800 mb-1">👨‍💻 爸爸的小贴士 (Protocol)</h3>
            <p className="text-sm text-blue-700">
              这就是"差一错误" (Off-by-one Error)。<br />
              告诉 Hilson：剪刀是<b>间隔</b>，彩带是<b>物体</b>。<br />
              永远记住公式：<b>段数 = 刀数 + 1</b>
            </p>
          </div>
        </div>
      );
    };

    // --- 模块 2: 排排队 (The Queue & Overlap) ---
    const ModuleQueue = ({ onBack }) => {
      const [selectedIndex, setSelectedIndex] = useState(null);
      const animals = ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻'];

      return (
        <div className="fade-in p-6 max-w-2xl mx-auto">
          <button onClick={onBack} className="mb-4 text-blue-500 flex items-center hover:underline">
            <IconHome className="mr-2" /> 返回大厅
          </button>
          <h2 className="text-3xl font-bold text-indigo-600 mb-2">👫 排队数一数</h2>
          <p className="text-gray-600 mb-6">点选一个小动物代表 <b>Hilson</b>。它前面是第几个？后面是第几个？</p>

          <div className="bg-white p-8 rounded-2xl shadow-xl border-4 border-indigo-100">
            <div className="flex justify-between items-end mb-12 h-24">
              {animals.map((emoji, index) => (
                <div
                  key={index}
                  onClick={() => setSelectedIndex(index)}
                  className={`cursor-pointer transition-all duration-300 flex flex-col items-center ${selectedIndex === index ? 'transform scale-150 -translate-y-4' : 'hover:scale-110 opacity-70'}`}
                >
                  <span className="text-4xl">{emoji}</span>
                  {selectedIndex === index && (
                    <div className="mt-2 text-xs bg-indigo-600 text-white px-2 py-1 rounded-full animate-bounce">我</div>
                  )}
                </div>
              ))}
            </div>

            {selectedIndex !== null ? (
              <div className="space-y-4">
                <div className="flex items-center justify-between text-sm text-gray-500 mb-2">
                  <span>从前面数...</span>
                  <span>从后面数...</span>
                </div>
                <div className="relative h-12 bg-gray-100 rounded-full overflow-hidden flex">
                  {/* 左边条 */}
                  <div
                    className="h-full bg-blue-400 flex items-center justify-center text-white font-bold transition-all duration-500"
                    style={{ width: `${((selectedIndex + 1) / animals.length) * 100}%` }}
                  >
                    第 {selectedIndex + 1}
                  </div>
                  {/* 右边条 (重叠演示) - 为了视觉效果，我们用另一个反向的逻辑 */}
                  <div
                    className="absolute right-0 h-full bg-red-400/70 flex items-center justify-center text-white font-bold transition-all duration-500"
                    style={{ width: `${((animals.length - selectedIndex) / animals.length) * 100}%` }}
                  >
                    第 {animals.length - selectedIndex}
                  </div>
                </div>

                <div className="mt-6 text-center">
                  <p className="text-lg mb-2">如果直接加起来：</p>
                  <div className="flex items-center justify-center gap-2 text-2xl font-bold text-gray-700">
                    <span className="text-blue-500">{selectedIndex + 1}</span>
                    <span>+</span>
                    <span className="text-red-500">{animals.length - selectedIndex}</span>
                    <span>=</span>
                    <span>{(selectedIndex + 1) + (animals.length - selectedIndex)}</span>
                    <span className="text-sm text-gray-400 font-normal ml-2">(哎呀！多算了一个！)</span>
                  </div>
                  <p className="text-indigo-600 font-bold mt-4 text-xl animate-pulse">
                    正确人数 = {(selectedIndex + 1) + (animals.length - selectedIndex)} - 1 = {animals.length}
                  </p>
                </div>
              </div>
            ) : (
              <div className="text-center text-gray-400 py-8">👆 请点击上面的一个小动物</div>
            )}
          </div>

          <div className="mt-6 bg-blue-50 p-4 rounded-xl border border-blue-200">
            <h3 className="font-bold text-blue-800 mb-1">👨‍💻 爸爸的小贴士 (Deduplication)</h3>
            <p className="text-sm text-blue-700">
              这是集合论中的交集问题。<br />
              Hilson 被计数了两次（一次作为前数第N个，一次作为后数第M个）。<br />
              <b>User ID 重复了</b>，所以必须 -1 去重。
            </p>
          </div>
        </div>
      );
    };

    // --- 模块 3: 迷宫路线 (Session/Scope Logic) ---
    const ModuleMaze = ({ onBack }) => {
      const [logs, setLogs] = useState([]);
      const [mousePos, setMousePos] = useState('start'); // start, top, mid, bot, end
      const [message, setMessage] = useState("小老鼠准备好了！选一条路吧。");

      const paths = {
        'start': [
          { to: 'top', label: '走上门 (Path A)' },
          { to: 'bot', label: '走下门 (Path B)' },
          { to: 'mid', label: '走中间门 (Path C)' }
        ],
        'top': [{ to: 'end', label: '跑向出口！' }],
        'bot': [{ to: 'end', label: '跑向出口！' }],
        'mid': [
          { to: 'top', label: '往上转 (Switch Top)' },
          { to: 'bot', label: '往下转 (Switch Bottom)' }
        ],
        'end': []
      };

      const handleMove = (nextPos, label) => {
        setMousePos(nextPos);
        if (nextPos === 'end') {
          const newLog = `成功逃脱！路线：${label}`;
          setLogs(prev => [newLog, ...prev]);
          setMessage("太棒了！小老鼠跑出去了！我们再玩一次？");
          // Reset game automatically after a delay
          setTimeout(() => {
            setMousePos('start');
            setMessage("新的一局开始了！所有的门都重置了。");
          }, 1500);
        } else if (nextPos === 'mid') {
          setMessage("进入中间了... 前面有分岔路！");
        } else {
          setMessage("正在奔跑中...");
        }
      };

      return (
        <div className="fade-in p-6 max-w-2xl mx-auto">
          <button onClick={onBack} className="mb-4 text-blue-500 flex items-center hover:underline">
            <IconHome className="mr-2" /> 返回大厅
          </button>
          <h2 className="text-3xl font-bold text-green-600 mb-2">🐭 迷宫大逃亡</h2>
          <p className="text-gray-600 mb-6">每一次逃跑都是<b>新的一局游戏</b>。门可以用很多次哦！</p>

          <div className="bg-white p-8 rounded-2xl shadow-xl border-4 border-green-100 min-h-[400px]">
            <div className="text-center mb-6">
              <div className="inline-block bg-green-100 text-green-800 px-4 py-2 rounded-full font-bold">
                {message}
              </div>
            </div>

            {/* 简易地图可视化 */}
            <div className="flex justify-between items-center mb-8 relative h-48 bg-gray-50 rounded-xl p-4 border border-dashed border-gray-300">
              {/* Start Node */}
              <div className={`w-12 h-12 rounded-full flex items-center justify-center text-2xl z-10 transition-all ${mousePos === 'start' ? 'bg-green-500 scale-125 shadow-lg' : 'bg-gray-200'}`}>🏠</div>

              {/* Middle Nodes Column */}
              <div className="flex flex-col gap-8">
                <div className={`w-10 h-10 rounded-full flex items-center justify-center border-2 transition-all ${mousePos === 'top' ? 'bg-blue-500 border-blue-600 scale-125 text-white' : 'bg-white border-gray-300'}`}>A</div>
                <div className={`w-10 h-10 rounded-full flex items-center justify-center border-2 transition-all ${mousePos === 'mid' ? 'bg-yellow-500 border-yellow-600 scale-125 text-white' : 'bg-white border-gray-300'}`}>?</div>
                <div className={`w-10 h-10 rounded-full flex items-center justify-center border-2 transition-all ${mousePos === 'bot' ? 'bg-blue-500 border-blue-600 scale-125 text-white' : 'bg-white border-gray-300'}`}>B</div>
              </div>

              {/* End Node */}
              <div className={`w-12 h-12 rounded-full flex items-center justify-center text-2xl z-10 transition-all ${mousePos === 'end' ? 'bg-red-500 scale-125 shadow-lg animate-bounce' : 'bg-gray-200'}`}>🚩</div>

              {/* Simple connecting lines (SVG) */}
              <svg className="absolute inset-0 w-full h-full pointer-events-none opacity-20">
                <line x1="10%" y1="50%" x2="50%" y2="20%" stroke="black" strokeWidth="2" />
                <line x1="10%" y1="50%" x2="50%" y2="50%" stroke="black" strokeWidth="2" />
                <line x1="10%" y1="50%" x2="50%" y2="80%" stroke="black" strokeWidth="2" />
                <line x1="50%" y1="20%" x2="90%" y2="50%" stroke="black" strokeWidth="2" />
                <line x1="50%" y1="80%" x2="90%" y2="50%" stroke="black" strokeWidth="2" />
                {/* Internal connections */}
                <line x1="50%" y1="50%" x2="50%" y2="20%" stroke="black" strokeWidth="2" strokeDasharray="4" />
                <line x1="50%" y1="50%" x2="50%" y2="80%" stroke="black" strokeWidth="2" strokeDasharray="4" />
              </svg>

              {/* Mouse Avatar */}
              <div className="absolute text-3xl transition-all duration-500" style={{
                left: mousePos === 'start' ? '5%' : mousePos === 'end' ? '90%' : '50%',
                top: mousePos === 'start' || mousePos === 'end' || mousePos === 'mid' ? '45%' : mousePos === 'top' ? '15%' : '75%'
              }}>
                🐭
              </div>
            </div>

            {/* Controls */}
            <div className="grid grid-cols-1 gap-3">
              {paths[mousePos].map((path, idx) => (
                <button
                  key={idx}
                  onClick={() => handleMove(path.to, path.label)}
                  className="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-lg shadow transition transform hover:scale-105 active:scale-95"
                >
                  {path.label}
                </button>
              ))}
            </div>

            {/* Score Board */}
            <div className="mt-8 bg-gray-50 p-4 rounded-xl">
              <div className="text-gray-500 text-sm font-bold uppercase mb-2">成功逃脱记录 (Session Log)</div>
              {logs.length === 0 ? (
                <div className="text-gray-400 italic">还没有逃跑过哦...</div>
              ) : (
                <ul className="space-y-1">
                  {logs.map((log, i) => (
                    <li key={i} className="text-green-700 text-sm flex items-center">
                      <span className="mr-2">✅</span> 第 {logs.length - i} 次游戏: {log}
                    </li>
                  ))}
                </ul>
              )}
              <div className="mt-2 pt-2 border-t border-gray-200 text-right font-bold text-gray-700">
                总共发现了 {logs.length} 种玩法
              </div>
            </div>
          </div>

          <div className="mt-6 bg-blue-50 p-4 rounded-xl border border-blue-200">
            <h3 className="font-bold text-blue-800 mb-1">👨‍💻 爸爸的小贴士 (Session Scope)</h3>
            <p className="text-sm text-blue-700">
              告诉 Hilson：每一次回到起点，游戏就<b>重置(Reset)</b>了。<br />
              上一局走过的门，这一局又变成新的了。<br />
              规则是：<b>在这一局里不走回头路</b>，不是说永远不能走同一个门。
            </p>
          </div>
        </div>
      );
    };

    // --- 主菜单 ---
    const App = () => {
      const [currentModule, setCurrentModule] = useState('menu');

      const renderModule = () => {
        switch (currentModule) {
          case 'rope': return <ModuleRope onBack={() => setCurrentModule('menu')} />;
          case 'queue': return <ModuleQueue onBack={() => setCurrentModule('menu')} />;
          case 'maze': return <ModuleMaze onBack={() => setCurrentModule('menu')} />;
          default: return (
            <div className="max-w-md mx-auto p-6 fade-in">
              <header className="text-center mb-10">
                <h1 className="text-4xl font-bold text-gray-800 mb-2">🕵️‍♂️ Hilson 的逻辑探案馆</h1>
                <p className="text-gray-500">你是最棒的小侦探！今天我们要破解什么谜题？</p>
              </header>

              <div className="space-y-4">
                <button
                  onClick={() => setCurrentModule('rope')}
                  className="game-card w-full bg-yellow-100 hover:bg-yellow-200 p-6 rounded-2xl flex items-center gap-4 text-left border-2 border-yellow-300"
                >
                  <div className="bg-yellow-400 p-3 rounded-full text-white">
                    <IconScissor />
                  </div>
                  <div>
                    <h3 className="text-xl font-bold text-yellow-800">剪刀与彩带</h3>
                    <p className="text-yellow-700 text-sm">剪几刀？有几段？</p>
                  </div>
                </button>

                <button
                  onClick={() => setCurrentModule('queue')}
                  className="game-card w-full bg-indigo-100 hover:bg-indigo-200 p-6 rounded-2xl flex items-center gap-4 text-left border-2 border-indigo-300"
                >
                  <div className="bg-indigo-400 p-3 rounded-full text-white">
                    <IconUsers />
                  </div>
                  <div>
                    <h3 className="text-xl font-bold text-indigo-800">小动物排排队</h3>
                    <p className="text-indigo-700 text-sm">我被数了两次吗？</p>
                  </div>
                </button>

                <button
                  onClick={() => setCurrentModule('maze')}
                  className="game-card w-full bg-green-100 hover:bg-green-200 p-6 rounded-2xl flex items-center gap-4 text-left border-2 border-green-300"
                >
                  <div className="bg-green-400 p-3 rounded-full text-white">
                    <IconMap />
                  </div>
                  <div>
                    <h3 className="text-xl font-bold text-green-800">迷宫大逃亡</h3>
                    <p className="text-green-700 text-sm">可以走回头路吗？</p>
                  </div>
                </button>
              </div>

              <footer className="mt-12 text-center text-gray-400 text-sm">
                为 Hilson 特别定制 | Made by Papa Kane 👨‍💻
              </footer>
            </div>
          );
        }
      };

      return (
        <div className="min-h-screen bg-slate-50 py-8">
          {renderModule()}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <a class="pyp-map-link" href="../index.html" aria-label="Back to PYP curriculum map">PYP Map</a>
  <style>
    .pyp-map-link { position: fixed; top: 12px; right: 12px; z-index: 9999; min-height: 44px; display: inline-flex; align-items: center; border: 2px solid #17211f; border-radius: 8px; padding: 8px 12px; background: #fffaf0; color: #17211f; text-decoration: none; font: 900 14px/1 ui-rounded, "Avenir Next", "Segoe UI", sans-serif; box-shadow: 3px 3px 0 #17211f; letter-spacing: 0; }
    .pyp-map-link:focus-visible { outline: 3px solid #f2b84b; outline-offset: 2px; }
    @media print { .pyp-map-link { display: none; } }
  </style>
</body>

</html>
