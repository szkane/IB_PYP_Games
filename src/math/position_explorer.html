<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Position Explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #87CEEB;
      font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
      touch-action: none;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .hud-element {
      pointer-events: auto;
    }

    .vocab-word {
      color: #ef4444;
      font-weight: 900;
      text-transform: uppercase;
      text-shadow: 1px 1px 0px #fca5a5;
    }

    /* Badge Animations */
    .badge-found {
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popIn {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.2);
      }

      100% {
        transform: scale(1.05);
      }
    }

  </style>
</head>

<body>

  <div id="canvas-container"></div>

  <div id="ui-layer">

    <!-- TOP: The Floating Sentence Pill -->
    <div class="w-full max-w-4xl mx-auto pt-4 px-3 sm:px-6 pointer-events-none flex flex-col items-center z-20">
      <div
        class="hud-element bg-white/95 backdrop-blur-md shadow-lg rounded-3xl border-b-4 border-green-400 px-4 py-3 md:py-4 flex flex-col sm:flex-row items-center gap-3 w-full">
        <h1 id="sentence-container"
          class="text-2xl md:text-4xl text-gray-800 transition-all duration-300 flex-1 text-center font-bold">
          ✨ Tap the room to explore! ✨
        </h1>
        <button id="speak-btn"
          class="shrink-0 bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-bold py-2 px-5 rounded-full shadow-md transition-all active:scale-95 text-sm md:text-lg whitespace-nowrap">
          🔊 Read
        </button>
      </div>

      <!-- Instructions Floating Bubble -->
      <div
        class="hud-element mt-3 bg-black/40 backdrop-blur-sm text-white px-5 py-1.5 rounded-full text-xs md:text-sm font-medium tracking-wide">
        👆 Tap grid or objects to move! Drag to rotate.
      </div>
    </div>

    <!-- BOTTOM: The Progress Tracker Drawer -->
    <div
      class="hud-element absolute bottom-0 w-full bg-white/90 backdrop-blur-lg border-t-4 border-blue-400 shadow-[0_-4px_15px_rgba(0,0,0,0.1)] p-3 pb-6 md:pb-4 max-h-[35vh] overflow-y-auto z-20">
      <p class="text-xs md:text-sm font-extrabold text-gray-500 mb-2 text-center uppercase tracking-widest">
        Scavenger Hunt: Find all 15 words!
      </p>
      <div id="vocab-tracker" class="flex flex-wrap justify-center gap-2 max-w-5xl mx-auto">
        <!-- Badges injected here via JS -->
      </div>
    </div>

  </div>

  <!-- External Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

  <script>
    // --- 1. CORE SETUP ---
    const container = document.getElementById('canvas-container');

    let width = container.clientWidth || window.innerWidth || 800;
    let height = container.clientHeight || window.innerHeight || 600;
    if (width === 0) width = 800;
    if (height === 0) height = 600;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);

    const camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 100);
    camera.position.set(8, 8, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI / 2 + 0.1;

    // Lights
    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.6));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight.position.set(10, 15, 10);
    dirLight.castShadow = true;
    dirLight.shadow.camera.left = -10; dirLight.shadow.camera.right = 10;
    dirLight.shadow.camera.top = 10; dirLight.shadow.camera.bottom = -10;
    scene.add(dirLight);

    // --- 2. ENVIRONMENT & ANCHORS ---
    const voxelSize = 1;
    const objectsToIntersect = [];

    // The 4 Color-Coded Floor Quadrants
    const qGeo = new THREE.PlaneGeometry(10, 10);

    const greenMat = new THREE.MeshStandardMaterial({ color: 0xbbf7d0, roughness: 1.0 });
    const q1 = new THREE.Mesh(qGeo, greenMat);
    q1.rotation.x = -Math.PI / 2; q1.position.set(5, -0.4, -5); q1.receiveShadow = true;
    scene.add(q1); objectsToIntersect.push(q1);

    const blueMat = new THREE.MeshStandardMaterial({ color: 0xbfdbfe, roughness: 1.0 });
    const q2 = new THREE.Mesh(qGeo, blueMat);
    q2.rotation.x = -Math.PI / 2; q2.position.set(-5, -0.4, -5); q2.receiveShadow = true;
    scene.add(q2); objectsToIntersect.push(q2);

    const yellowMat = new THREE.MeshStandardMaterial({ color: 0xfef08a, roughness: 1.0 });
    const q3 = new THREE.Mesh(qGeo, yellowMat);
    q3.rotation.x = -Math.PI / 2; q3.position.set(-5, -0.4, 5); q3.receiveShadow = true;
    scene.add(q3); objectsToIntersect.push(q3);

    const purpleMat = new THREE.MeshStandardMaterial({ color: 0xe9d5ff, roughness: 1.0 });
    const q4 = new THREE.Mesh(qGeo, purpleMat);
    q4.rotation.x = -Math.PI / 2; q4.position.set(5, -0.4, 5); q4.receiveShadow = true;
    scene.add(q4); objectsToIntersect.push(q4);

    const gridHelper = new THREE.GridHelper(20, 20, 0x9ca3af, 0x6b7280);
    gridHelper.position.y = -0.39;
    gridHelper.material.opacity = 0.5;
    gridHelper.material.transparent = true;
    scene.add(gridHelper);

    // --- Central Anchor: The 3D Tree (Center 0, 0) ---
    const treeGroup = new THREE.Group();

    // Tree Trunk
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.9 });
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 2, 8), trunkMat);
    trunk.position.set(0, 0.6, 0); // Spans from floor (-0.4) up to 1.6
    trunk.castShadow = true; trunk.receiveShadow = true;
    treeGroup.add(trunk);
    objectsToIntersect.push(trunk);

    // Tree Canopy (Merged Dodecahedrons for a "Real" low-poly leafy look)
    const leafMat = new THREE.MeshStandardMaterial({ color: 0x22c55e, roughness: 0.8 });

    const canopy1 = new THREE.Mesh(new THREE.DodecahedronGeometry(1.5), leafMat);
    canopy1.position.set(0, 2.5, 0);
    canopy1.castShadow = true; treeGroup.add(canopy1); objectsToIntersect.push(canopy1);

    const canopy2 = new THREE.Mesh(new THREE.DodecahedronGeometry(1.2), leafMat);
    canopy2.position.set(0.8, 1.8, 0.5);
    canopy2.castShadow = true; treeGroup.add(canopy2); objectsToIntersect.push(canopy2);

    const canopy3 = new THREE.Mesh(new THREE.DodecahedronGeometry(1.3), leafMat);
    canopy3.position.set(-0.7, 2.0, -0.8);
    canopy3.castShadow = true; treeGroup.add(canopy3); objectsToIntersect.push(canopy3);

    scene.add(treeGroup);

    // --- Zone 1 (Green): Table, Chair, & Door ---
    const woodMat = new THREE.MeshStandardMaterial({ color: 0x8B5A2B, roughness: 0.8 });
    const tableTop = new THREE.Mesh(new THREE.BoxGeometry(3, 0.2, 3), woodMat);
    tableTop.position.set(5, 1.5, -5);
    tableTop.castShadow = true; tableTop.receiveShadow = true;
    scene.add(tableTop); objectsToIntersect.push(tableTop);

    const legGeo = new THREE.CylinderGeometry(0.08, 0.05, 1.8);
    [[3.7, -6.3], [6.3, -6.3], [3.7, -3.7], [6.3, -3.7]].forEach(pos => {
      const leg = new THREE.Mesh(legGeo, woodMat);
      leg.position.set(pos[0], 0.5, pos[1]);
      leg.castShadow = true; scene.add(leg); objectsToIntersect.push(leg);
    });

    const cushionMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.9 });
    const chairSeat = new THREE.Mesh(new THREE.BoxGeometry(1, 0.2, 1), cushionMat);
    chairSeat.position.set(5, 0.5, -2);
    chairSeat.castShadow = true; scene.add(chairSeat); objectsToIntersect.push(chairSeat);

    const chairBack = new THREE.Mesh(new THREE.BoxGeometry(1, 0.8, 0.1), woodMat);
    chairBack.position.set(5, 1.0, -1.55);
    chairBack.castShadow = true; scene.add(chairBack); objectsToIntersect.push(chairBack);

    const cLegGeo = new THREE.CylinderGeometry(0.04, 0.03, 0.8);
    [[4.6, -2.4], [5.4, -2.4], [4.6, -1.6], [5.4, -1.6]].forEach(pos => {
      const leg = new THREE.Mesh(cLegGeo, woodMat);
      leg.position.set(pos[0], 0.0, pos[1]);
      leg.castShadow = true; scene.add(leg); objectsToIntersect.push(leg);
    });

    // The Door & Welcome Mat (Exclusively for "AT")
    const doorMat = new THREE.MeshStandardMaterial({ color: 0x8B4513, roughness: 0.9 });
    const door = new THREE.Mesh(new THREE.BoxGeometry(2, 3, 0.2), doorMat);
    door.position.set(8, 1.1, -8);
    door.castShadow = true; scene.add(door); objectsToIntersect.push(door);

    const knobGeo = new THREE.SphereGeometry(0.15);
    const knob = new THREE.Mesh(knobGeo, new THREE.MeshStandardMaterial({ color: 0xfacc15 }));
    knob.position.set(7.3, 1, -7.85);
    scene.add(knob);

    const welcomeMat = new THREE.Mesh(new THREE.BoxGeometry(2, 0.05, 1.5), new THREE.MeshStandardMaterial({ color: 0x333333 }));
    welcomeMat.position.set(8, -0.37, -7);
    welcomeMat.receiveShadow = true; scene.add(welcomeMat); objectsToIntersect.push(welcomeMat);

    // --- Zone 2 (Blue): Wooden Box & Water Puddle ---
    const boxMat = new THREE.MeshStandardMaterial({ color: 0xA0522D, roughness: 0.9 });
    const bFloor = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.1, 1.8), boxMat);
    bFloor.position.set(-5, -0.45, -5);
    bFloor.receiveShadow = true; scene.add(bFloor); objectsToIntersect.push(bFloor);

    const wFB = new THREE.BoxGeometry(1.8, 1, 0.1);
    const wLR = new THREE.BoxGeometry(0.1, 1, 1.6);
    const wFront = new THREE.Mesh(wFB, boxMat); wFront.position.set(-5, 0.1, -4.15);
    const wBack = new THREE.Mesh(wFB, boxMat); wBack.position.set(-5, 0.1, -5.85);
    const wLeft = new THREE.Mesh(wLR, boxMat); wLeft.position.set(-5.85, 0.1, -5);
    const wRight = new THREE.Mesh(wLR, boxMat); wRight.position.set(-4.15, 0.1, -5);

    [wFront, wBack, wLeft, wRight].forEach(w => {
      w.castShadow = true; w.receiveShadow = true; scene.add(w); objectsToIntersect.push(w);
    });

    // The Water Puddle (For "IN")
    const waterMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.7, roughness: 0.1 });
    const pond = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.4, 0.1, 32), waterMat);
    pond.position.set(-5, -0.4, -2);
    pond.receiveShadow = true;
    scene.add(pond); objectsToIntersect.push(pond);

    // --- Zone 3 (Yellow): Rocks ---
    const stoneMat = new THREE.MeshStandardMaterial({ color: 0x9ca3af, roughness: 0.7 });
    const rocks = [[-4, 4], [-5, 5], [-3, 5], [-4, 6], [-5, 3], [-3, 3]];
    rocks.forEach(pos => {
      const rockGeo = new THREE.DodecahedronGeometry(Math.random() * 0.3 + 0.3);
      const rock = new THREE.Mesh(rockGeo, stoneMat);
      rock.position.set(pos[0], -0.2, pos[1]);
      rock.rotation.set(Math.random(), Math.random(), Math.random());
      rock.castShadow = true; scene.add(rock); objectsToIntersect.push(rock);
    });

    // --- Zone 4 (Purple): Pillars & Flowers ---
    const pillarGeo = new THREE.CylinderGeometry(0.3, 0.4, 2, 16);
    const p1 = new THREE.Mesh(pillarGeo, stoneMat); p1.position.set(4, 0.6, 5); p1.castShadow = true; scene.add(p1); objectsToIntersect.push(p1);
    const p2 = new THREE.Mesh(pillarGeo, stoneMat); p2.position.set(6, 0.6, 5); p2.castShadow = true; scene.add(p2); objectsToIntersect.push(p2);

    // NEW: Grass and Flowers (Exclusively for "ABOVE")
    const dirtMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.9 });
    const dirt = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.2, 1), dirtMat);
    dirt.position.set(5, -0.3, 8);
    dirt.receiveShadow = true; scene.add(dirt); objectsToIntersect.push(dirt);

    const grassMat = new THREE.MeshStandardMaterial({ color: 0x22c55e, roughness: 0.8 });
    const grassBox = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.1, 1), grassMat);
    grassBox.position.set(5, -0.15, 8);
    grassBox.receiveShadow = true; scene.add(grassBox); objectsToIntersect.push(grassBox);

    // Add 3 bright flowers
    const stemMat = new THREE.MeshStandardMaterial({ color: 0x16a34a });
    const flowerColors = [0xec4899, 0xfacc15, 0xa855f7]; // Pink, Yellow, Purple
    for (let i = 0; i < 3; i++) {
      const fX = 4 + i;

      const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.4), stemMat);
      stem.position.set(fX, 0.05, 8);
      stem.castShadow = true; scene.add(stem); objectsToIntersect.push(stem);

      const petalMat = new THREE.MeshStandardMaterial({ color: flowerColors[i] });
      const flower = new THREE.Mesh(new THREE.DodecahedronGeometry(0.25), petalMat);
      flower.position.set(fX, 0.3, 8);
      flower.castShadow = true; scene.add(flower); objectsToIntersect.push(flower);
    }

    // --- 3. THE PLAYER (DIAMOND) & GHOST BOX ---
    const diamondGeo = new THREE.OctahedronGeometry(0.4);
    const diamondMat = new THREE.MeshStandardMaterial({ color: 0x22d3ee, flatShading: true });
    const diamond = new THREE.Mesh(diamondGeo, diamondMat);
    diamond.castShadow = true;
    scene.add(diamond);

    const ghostGeo = new THREE.BoxGeometry(1, 1, 1);
    const ghostEdges = new THREE.EdgesGeometry(ghostGeo);
    const ghostBox = new THREE.LineSegments(ghostEdges, new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 }));
    scene.add(ghostBox);


    // --- 4. INTERACTION (Raycasting) ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    let currentX = 5, currentY = 2, currentZ = -5; // Start ON the table
    diamond.position.set(currentX, currentY, currentZ);

    // NEW: State flag to track browser audio permission
    let hasInteracted = false;

    // --- NEW: SCAVENGER HUNT LOGIC ---
    const totalVocab = ["IN", "UNDER", "NEAR", "AT", "ON", "ABOVE", "IN FRONT OF", "BEHIND", "BESIDE", "OPPOSITE", "INSIDE", "NEXT TO", "AMONG", "BY", "BETWEEN"];
    const foundWords = new Set();

    function initTracker() {
      const tracker = document.getElementById('vocab-tracker');
      totalVocab.forEach(word => {
        const badge = document.createElement('span');
        // Replace spaces with dashes for clean HTML IDs
        badge.id = `badge-${word.replace(/\s+/g, '-')}`;
        badge.innerText = word;
        // Greyed out "undiscovered" state
        badge.className = "px-3 py-1 bg-gray-100 text-gray-400 font-bold rounded-full text-xs md:text-sm border-2 border-gray-200 transition-all duration-300";
        tracker.appendChild(badge);
      });
    }

    function trackWord(newWord) {
      if (newWord && !foundWords.has(newWord)) {
        foundWords.add(newWord);
        const badgeId = `badge-${newWord.replace(/\s+/g, '-')}`;
        const badge = document.getElementById(badgeId);

        if (badge) {
          // Update to vibrant "discovered" state
          badge.className = "badge-found px-3 py-1 bg-green-100 text-green-700 font-bold rounded-full text-xs md:text-sm border-2 border-green-500 shadow-sm";
        }

        // Check for Win State
        if (foundWords.size === totalVocab.length) {
          setTimeout(() => {
            document.getElementById('sentence-container').innerHTML = "🎉 <span class='text-yellow-500 font-bold'>YOU FOUND EVERY WORD!</span> 🎉";
            if ('speechSynthesis' in window) {
              window.speechSynthesis.cancel();
              const msg = new SpeechSynthesisUtterance("Congratulations! You are a master explorer!");
              msg.rate = 0.9; msg.pitch = 1.1;
              window.speechSynthesis.speak(msg);
            }
          }, 1500); // Wait 1.5s for the normal word to finish reading
        }
      }
    }
    // ---------------------------------

    function getGridIntersect(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      let clientX = event.clientX; let clientY = event.clientY;

      if (event.changedTouches && event.changedTouches.length > 0) {
        clientX = event.changedTouches[0].clientX; clientY = event.changedTouches[0].clientY;
      }

      mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(objectsToIntersect);

      if (intersects.length > 0) {
        const intersect = intersects[0];
        const normal = intersect.face.normal.clone();
        const pos = intersect.point.clone().add(normal.multiplyScalar(0.5));
        return {
          x: Math.round(pos.x),
          y: Math.max(0, Math.round(pos.y)),
          z: Math.round(pos.z)
        };
      }
      return null;
    }

    renderer.domElement.addEventListener('pointermove', (e) => {
      if (e.isPrimary === false) return;
      const target = getGridIntersect(e);
      if (target) {
        ghostBox.position.set(target.x, target.y, target.z);
        ghostBox.visible = true;
      } else {
        ghostBox.visible = false;
      }
    });

    renderer.domElement.addEventListener('pointerdown', (e) => {
      // NEW: Unlock the audio engine upon first tap
      hasInteracted = true;

      const target = getGridIntersect(e);
      if (target) {
        currentX = target.x; currentY = target.y; currentZ = target.z;

        new TWEEN.Tween(diamond.position)
          .to({ x: currentX, y: currentY, z: currentZ }, 400)
          .easing(TWEEN.Easing.Quadratic.Out)
          .onComplete(updateUI)
          .start();
      }
    });

    // --- 5. LINGUISTIC LOGIC ENGINE (1-to-1 Mapping) ---
    function updateUI() {
      let sentenceHTML = "✨ Tap around the room to discover new places! ✨";
      let word = "";
      let rel = "";

      // Pre-calculate zone variables so they don't break the if/else chain
      const isTreeX = Math.abs(currentX) <= 1;
      const isTreeZ = Math.abs(currentZ) <= 1;
      const isNearTreeX = Math.abs(currentX) <= 2;
      const isNearTreeZ = Math.abs(currentZ) <= 2;
      const isTableX = Math.abs(currentX - 5) <= 1;
      const isTableZ = Math.abs(currentZ - -5) <= 1;

      // CENTRAL LOGIC: The 3D Tree
      if (isTreeX && isTreeZ && currentY >= 2 && currentY <= 4) { word = "IN"; rel = "the tree"; }
      else if (isTreeX && isTreeZ && (currentY === 0 || currentY === 1) && !(currentX === 0 && currentZ === 0)) { word = "UNDER"; rel = "the tree"; }
      else if (isNearTreeX && isNearTreeZ && currentY === 0 && !(isTreeX && isTreeZ)) { word = "NEAR"; rel = "the tree"; }

      // ZONE 1 (GREEN): Door, Table, & Chair
      // Door Logic (Restored)
      else if (Math.abs(currentX - 8) <= 1 && currentZ === -7 && currentY === 0) { word = "AT"; rel = "the door"; }

      // Table Logic
      else if (isTableX && isTableZ && currentY === 2) { word = "ON"; rel = "the table"; }
      else if (isTableX && isTableZ && (currentY === 0 || currentY === 1)) { word = "UNDER"; rel = "the table"; }
      else if (isTableX && isTableZ && currentY > 2) { word = "ABOVE"; rel = "the table"; }
      else if (isTableX && currentZ === -3 && currentY <= 1) { word = "IN FRONT OF"; rel = "the table"; }
      else if (isTableX && currentZ === -7 && currentY <= 1) { word = "BEHIND"; rel = "the table"; }
      else if ((currentX === 3 || currentX === 7) && isTableZ && currentY <= 1) { word = "BESIDE"; rel = "the table"; }

      // Chair Logic (Strictly constrained to X=5)
      else if (currentX === 5 && currentZ === -8 && currentY <= 1) { word = "OPPOSITE"; rel = "the red chair"; }
      else if (currentX === 5 && currentZ === -2 && currentY === 1) { word = "ON"; rel = "the red chair"; }
      else if (currentX === 5 && currentZ === -2 && currentY === 0) { word = "UNDER"; rel = "the red chair"; }
      else if (currentX === 5 && currentZ === -1 && currentY <= 1) { word = "BEHIND"; rel = "the red chair"; }

      // ZONE 2 (BLUE): Wooden Box & Pond
      else if (currentX === -5 && currentZ === -5 && currentY === 0) { word = "INSIDE"; rel = "the wooden box"; }
      else if ((currentX === -3 || currentX === -7) && Math.abs(currentZ - -5) <= 1 && currentY === 0) { word = "NEXT TO"; rel = "the wooden box"; }
      else if (Math.abs(currentX - -5) <= 1 && Math.abs(currentZ - -2) <= 1 && currentY === 0) { word = "IN"; rel = "the water"; }

      // ZONE 3 (YELLOW): Rocks
      else if (currentX >= -5 && currentX <= -3 && currentZ >= 3 && currentZ <= 5 && currentY === 0) { word = "AMONG"; rel = "the rocks"; }
      else if ((currentX === -2 || currentX === -6) && Math.abs(currentZ - 4) <= 1 && currentY === 0) { word = "BY"; rel = "the rocks"; }

      // ZONE 4 (PURPLE): Pillars & Flowers
      else if ((currentX === 4 || currentX === 6) && currentZ === 5 && currentY >= 2) { word = "ON"; rel = "the stone pillar"; }
      else if (currentX === 5 && currentZ === 5 && currentY <= 1) { word = "BETWEEN"; rel = "the stone pillars"; }
      else if (Math.abs(currentX - 5) <= 2 && Math.abs(currentZ - 5) <= 2 && currentY === 0 && !(currentX === 5 && currentZ === 5)) { word = "NEAR"; rel = "the stone pillars"; }
      else if (currentX >= 4 && currentX <= 6 && currentZ === 8 && currentY >= 1) { word = "ABOVE"; rel = "the flowers"; }

      // Apply to UI
      if (word !== "") {
        sentenceHTML = `The diamond is <span id="word-display" class="vocab-word">${word}</span> <span id="rel-display">${rel}</span>.`;
      }

      document.getElementById('sentence-container').innerHTML = sentenceHTML;

      if (word !== "") {
        trackWord(word);

        // NEW: Only trigger auto-read if user has clicked the canvas
        if (hasInteracted) {
          readAloud();
        }
      }
    }

    // --- 6. AUDIO & ANIMATION ---
    function readAloud() {
      if ('speechSynthesis' in window) {
        const wordEl = document.getElementById('word-display');
        const relEl = document.getElementById('rel-display');
        let sentence = "Tap around the room to discover new places!";

        if (wordEl && relEl) {
          sentence = `The diamond is ${wordEl.innerText} ${relEl.innerText}.`;
        }

        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(sentence);
        msg.rate = 0.85;
        msg.pitch = 1.1;
        window.speechSynthesis.speak(msg);
      }
    }
    document.getElementById('speak-btn').addEventListener('click', readAloud);

    function animate(time) {
      requestAnimationFrame(animate);
      const t = time || performance.now();
      TWEEN.update(t);
      controls.update();

      if (diamond) {
        diamond.rotation.y += 0.02;
        if (TWEEN.getAll().length === 0) {
          diamond.position.y = currentY + Math.sin(t * 0.003) * 0.05;
        }
      }
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      const w = container.clientWidth || window.innerWidth;
      const h = container.clientHeight || window.innerHeight;
      if (w === 0 || h === 0) return;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });

    initTracker(); // Initialize the badge board on load
    updateUI();
    requestAnimationFrame(animate); 
  </script>
</body>

</html>
