<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hilson的拼音标调小助手</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Zcool+KuaiLe&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans SC', sans-serif;
      background-color: #f0f9ff;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    .pinyin-font {
      font-family: Arial, sans-serif;
    }

    .fun-font {
      font-family: 'Zcool KuaiLe', cursive;
    }

    .card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .card:active {
      transform: scale(0.96);
    }

    .btn-active {
      background-color: #3b82f6;
      color: white;
      border-color: #3b82f6;
    }

    .btn-inactive {
      background-color: white;
      color: #4b5563;
      border-color: #e5e7eb;
    }

    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .correct-anim {
      animation: bounce 0.5s;
    }

    @keyframes bounce {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.2);
      }
    }

    .shake {
      animation: shake 0.5s;
    }

    @keyframes shake {
      0% {
        transform: translate(1px, 1px) rotate(0deg);
      }

      10% {
        transform: translate(-1px, -2px) rotate(-1deg);
      }

      20% {
        transform: translate(-3px, 0px) rotate(1deg);
      }

      30% {
        transform: translate(3px, 2px) rotate(0deg);
      }

      40% {
        transform: translate(1px, -1px) rotate(1deg);
      }

      50% {
        transform: translate(-1px, 2px) rotate(-1deg);
      }

      60% {
        transform: translate(-3px, 1px) rotate(0deg);
      }

      70% {
        transform: translate(3px, 1px) rotate(-1deg);
      }

      80% {
        transform: translate(-1px, -1px) rotate(1deg);
      }

      90% {
        transform: translate(1px, 2px) rotate(0deg);
      }

      100% {
        transform: translate(1px, -2px) rotate(-1deg);
      }
    }

  </style>
</head>

<body class="bg-blue-50 h-screen w-screen flex flex-col overflow-hidden">

  <!-- 顶部：标调歌 -->
  <header class="bg-blue-500 text-white p-3 md:p-4 shadow-md z-20 flex-shrink-0">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <h1 class="text-xl md:text-2xl font-bold fun-font flex items-center gap-2">
        <span>🎓</span> Hilson的拼音助手
      </h1>
      <div class="flex items-center gap-2">
        <select id="voice-select"
          class="bg-blue-600 text-white text-xs md:text-sm rounded-lg px-2 py-2 border border-blue-400 focus:outline-none focus:ring-2 focus:ring-yellow-300 max-w-[100px] md:max-w-[180px] cursor-pointer">
          <option>加载语音...</option>
        </select>
        <button onclick="playSong()"
          class="bg-yellow-400 text-blue-900 px-4 py-2 rounded-full text-sm md:text-base font-bold shadow hover:bg-yellow-300 transition transform active:scale-95 flex items-center gap-2">
          <span>🔊</span> 听标调歌
        </button>
      </div>
    </div>
    <!-- 标调歌提示 -->
    <div class="max-w-7xl mx-auto mt-2 text-center bg-blue-600/80 rounded-lg p-2 text-sm md:text-base backdrop-blur-sm">
      <span class="inline-block mx-2">有 <span class="text-yellow-300 font-bold text-lg">a</span> 先找 a</span>
      <span class="inline-block mx-2">没 a 找 <span class="text-yellow-300 font-bold text-lg">o e</span></span>
      <span class="hidden md:inline-block text-blue-300">|</span>
      <span class="inline-block mx-2"><span class="text-yellow-300 font-bold text-lg">i u</span> 并列标在后</span>
      <span class="inline-block mx-2"><span class="text-yellow-300 font-bold text-lg">i</span> 上标调点去掉！</span>
    </div>
  </header>

  <!-- 导航栏 -->
  <nav class="w-full bg-white/80 backdrop-blur-md border-b border-blue-100 z-10 flex-shrink-0">
    <div class="max-w-7xl mx-auto px-4">
      <div class="flex space-x-4 overflow-x-auto hide-scrollbar py-3 justify-start md:justify-center">
        <button onclick="switchTab('two')" id="tab-two"
          class="btn-active flex-shrink-0 px-6 py-2 rounded-full font-bold border-2 shadow-sm transition text-lg">两拼音节</button>
        <button onclick="switchTab('three')" id="tab-three"
          class="btn-inactive flex-shrink-0 px-6 py-2 rounded-full font-bold border-2 shadow-sm transition text-lg">三拼音节</button>
        <button onclick="switchTab('whole')" id="tab-whole"
          class="btn-inactive flex-shrink-0 px-6 py-2 rounded-full font-bold border-2 shadow-sm transition text-lg">整体认读</button>
        <button onclick="switchTab('quiz')" id="tab-quiz"
          class="btn-inactive flex-shrink-0 px-6 py-2 rounded-full font-bold border-2 bg-purple-100 text-purple-700 border-purple-200 shadow-sm transition text-lg flex items-center gap-1"><span>🎮</span>
          挑战练习</button>
      </div>
    </div>
  </nav>

  <!-- 内容区域 -->
  <main class="flex-1 overflow-y-auto overflow-x-hidden p-4 md:p-6 bg-blue-50 relative scroll-smooth">

    <div class="max-w-7xl mx-auto h-full">
      <!-- 学习视图 -->
      <div id="learning-view"
        class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6 pb-20">
        <!-- 卡片将通过 JS 动态插入这里 -->
      </div>

      <!-- 测试视图 -->
      <div id="quiz-view" class="hidden h-full flex flex-col justify-center items-center pb-20">
        <div
          class="bg-white rounded-3xl shadow-2xl p-8 md:p-12 text-center w-full max-w-2xl border-b-8 border-purple-200">
          <div class="flex justify-between items-center mb-6">
            <span class="bg-purple-100 text-purple-700 px-4 py-2 rounded-full text-base font-bold">第 <span
                id="quiz-count">1</span> 题</span>
            <div class="text-gray-400 text-sm">点击字母标声调</div>
          </div>

          <h2 class="text-3xl md:text-4xl text-gray-700 mb-8 font-bold" id="quiz-char-display">汉字</h2>

          <!-- 题目区域 -->
          <div class="my-8 flex justify-center items-center gap-2 md:gap-4 flex-wrap" id="quiz-letters">
            <!-- 字母按钮将在这里生成 -->
          </div>

          <div id="quiz-feedback" class="h-20 flex items-center justify-center bg-gray-50 rounded-xl p-4">
            <p class="text-gray-400 text-base">👆 请点击上方的字母完成标调</p>
          </div>

          <div class="mt-8 flex justify-center h-16">
            <button onclick="nextQuestion()"
              class="bg-green-500 hover:bg-green-600 text-white text-xl font-bold py-3 px-10 rounded-full shadow-lg transform transition active:scale-95 hidden w-full md:w-auto"
              id="next-btn">
              下一题 ➔
            </button>
          </div>
        </div>
      </div>
    </div>

  </main>

  <script>
    // --- 核心数据重构：覆盖全韵母 & 全汉字拟音 ---
    // 目标：
    // 1. 去重：避免重复的韵母结构。
    // 2. 多样性：涵盖 a, o, e, i, u, ü, ai, ei, ui, ao, ou, iu, ie, üe, er, an, en, in, un, ün, ang, eng, ing, ong
    // 3. TTS：声母、韵母全部使用【纯汉字】映射，确保读音准确。

    // 汉字拟音对照表 (仅供参考逻辑)：
    // a=阿, o=喔, e=鹅, i=衣, u=乌, ü=迂
    // ai=爱, ei=诶, ui=威, ao=袄, ou=欧, iu=优
    // an=安, en=恩, in=因, ang=昂, eng=亨(取韵), ing=英, ong=轰(取韵)

    const data = {
      two: [
        // 单韵母
        { py: "mā", char: "妈", rule: "有 a 先找 a", type: "a", tts: "摸, 阿, 妈" },
        { py: "bō", char: "波", rule: "没 a 找 o e (有o)", type: "o", tts: "玻, 喔, 波" },
        { py: "lè", char: "乐", rule: "没 a 找 o e (有e)", type: "e", tts: "勒, 饿, 乐" },
        { py: "bǐ", char: "笔", rule: "i 上标调点去掉", type: "i", tts: "玻, 以, 笔" },
        { py: "bù", char: "不", rule: "标在 u 上", type: "u", tts: "玻, 悟, 不" },
        { py: "nǚ", char: "女", rule: "ü 上标调保留点", type: "u_dot", tts: "呢, 迂, 女" },

        // 复韵母 (ai, ei, ui, ao, ou, iu)
        { py: "cài", char: "菜", rule: "有 a 先找 a (ai)", type: "a", tts: "雌, 爱, 菜" },
        { py: "fēi", char: "飞", rule: "没 a 找 o e (ei)", type: "e", tts: "佛, 诶, 飞" },
        { py: "guī", char: "归", rule: "i u 并列标在后 (ui标i)", type: "iu", tts: "哥, 威, 归" },
        { py: "pǎo", char: "跑", rule: "有 a 先找 a (ao)", type: "a", tts: "坡, 袄, 跑" },
        { py: "tóu", char: "头", rule: "没 a 找 o e (ou标o)", type: "o", tts: "特, 欧, 头" },
        { py: "liú", char: "流", rule: "i u 并列标在后 (iu标u)", type: "iu", tts: "勒, 优, 流" },

        // 鼻韵母 (an, en, in, ang, eng, ing, ong)
        { py: "shān", char: "山", rule: "有 a 先找 a (an)", type: "a", tts: "诗, 安, 山" },
        { py: "mén", char: "门", rule: "没 a 找 o e (en)", type: "e", tts: "摸, 嗯, 门" },
        { py: "lín", char: "林", rule: "i 上标调点去掉 (in)", type: "i", tts: "勒, 银, 林" },
        { py: "bāng", char: "帮", rule: "有 a 先找 a (ang)", type: "a", tts: "玻, 昂, 帮" },
        { py: "dēng", char: "灯", rule: "没 a 找 o e (eng)", type: "e", tts: "得, 恩, 灯" },
        { py: "xīng", char: "星", rule: "i 上标调点去掉 (ing)", type: "i", tts: "西, 英, 星" },
        { py: "hóng", char: "红", rule: "没 a 找 o e (ong标o)", type: "o", tts: "喝, 红, 红" }
      ],
      three: [
        // 简单的介母组合 (u-a, u-o, i-a)
        { py: "guā", char: "瓜", rule: "有 a 先找 a (g-u-a)", type: "a", tts: "哥, 乌, 阿, 瓜" },
        { py: "huā", char: "花", rule: "有 a 先找 a (h-u-a)", type: "a", tts: "喝, 乌, 阿, 花" },
        { py: "duǒ", char: "朵", rule: "没 a 找 o e (d-u-o)", type: "o", tts: "得, 乌, 噢, 朵" },
        { py: "jiā", char: "家", rule: "有 a 先找 a (j-i-a)", type: "a", tts: "鸡, 衣, 阿, 家" },
        { py: "qiā", char: "掐", rule: "有 a 先找 a (q-i-a)", type: "a", tts: "七, 衣, 阿, 掐" },
        { py: "xiā", char: "虾", rule: "有 a 先找 a (x-i-a)", type: "a", tts: "西, 衣, 阿, 虾" },

        // 复杂的三拼 (包含 ai, ao, an, ang, ong 等)
        { py: "shuài", char: "帅", rule: "有 a 先找 a (u-ai)", type: "a", tts: "诗, 乌, 爱, 帅" },
        { py: "kuài", char: "快", rule: "有 a 先找 a (u-ai)", type: "a", tts: "科, 乌, 爱, 快" },
        { py: "qiáo", char: "桥", rule: "有 a 先找 a (i-ao)", type: "a", tts: "七, 衣, 熬, 桥" },
        { py: "xiǎo", char: "小", rule: "有 a 先找 a (i-ao)", type: "a", tts: "西, 衣, 袄, 小" },
        { py: "luàn", char: "乱", rule: "有 a 先找 a (u-an)", type: "a", tts: "勒, 乌, 岸, 乱" },
        { py: "juǎn", char: "卷", rule: "有 a 先找 a (ü-an)", type: "a", tts: "鸡, 迂, 俺, 卷" },
        { py: "quán", char: "泉", rule: "有 a 先找 a (ü-an)", type: "a", tts: "七, 迂, 安, 泉" },
        { py: "xióng", char: "熊", rule: "没 a 找 o e (i-ong)", type: "o", tts: "西, 衣, 轰, 熊" },
        { py: "guāng", char: "光", rule: "有 a 先找 a (u-ang)", type: "a", tts: "哥, 乌, 昂, 光" }
      ],
      whole: [
        // 整体认读音节不需要拼读，直接读音
        { py: "yuān", char: "冤", rule: "有 a 先找 a (y-ü-an)", type: "a", tts: "冤" },
        { py: "yē", char: "耶", rule: "没 a 找 o e (i-e)", type: "e", tts: "耶" },
        { py: "yé", char: "爷", rule: "没 a 找 o e", type: "e", tts: "爷" },
        { py: "yuē", char: "约", rule: "没 a 找 o e (ü-e)", type: "e", tts: "约" },
        { py: "yī", char: "衣", rule: "i 上标调点去掉", type: "i", tts: "衣" },
        { py: "wū", char: "乌", rule: "标在 u 上", type: "u", tts: "乌" },
        { py: "yū", char: "迂", rule: "j q x y 见 ü 去两点 (标u)", type: "u", tts: "迂" },
        { py: "yǔ", char: "雨", rule: "j q x y 见 ü 去两点 (标u)", type: "u", tts: "雨" },
        { py: "yūn", char: "晕", rule: "j q x y 见 ü 去两点 (标u)", type: "u", tts: "晕" }
      ]
    };

    function generateQuizData() {
      const all = [...data.two, ...data.three, ...data.whole];
      return all.map(item => {
        let cleanPy = item.py
          .replace(/[āáǎà]/g, 'a')
          .replace(/[ōóǒò]/g, 'o')
          .replace(/[ēéěè]/g, 'e')
          .replace(/[īíǐì]/g, 'i')
          .replace(/[ūúǔù]/g, 'u')
          .replace(/[ǖǘǚǜ]/g, 'ü');

        let targetChar = '';
        if (item.py.match(/[āáǎà]/)) targetChar = 'a';
        else if (item.py.match(/[ōóǒò]/)) targetChar = 'o';
        else if (item.py.match(/[ēéěè]/)) targetChar = 'e';
        else if (item.py.match(/[īíǐì]/)) targetChar = 'i';
        else if (item.py.match(/[ūúǔù]/)) targetChar = 'u';
        else if (item.py.match(/[ǖǘǚǜ]/)) targetChar = 'ü';

        if (cleanPy.includes('iu')) targetChar = 'u';
        if (cleanPy.includes('ui')) targetChar = 'i';

        return {
          original: item.py,
          char: item.char,
          clean: cleanPy,
          targetChar: targetChar,
          hint: item.rule,
          tts: item.tts
        };
      }).sort(() => 0.5 - Math.random());
    }

    let quizQuestions = [];
    let currentQuestionIndex = 0;

    let availableVoices = [];

    function loadVoices() {
      availableVoices = window.speechSynthesis.getVoices();
      const voiceSelect = document.getElementById('voice-select');
      if (!voiceSelect) return;

      // 过滤中文语音
      const zhVoices = availableVoices.filter(v => v.lang.includes('zh'));

      if (zhVoices.length > 0) {
        const currentSelection = voiceSelect.value;
        voiceSelect.innerHTML = '';
        zhVoices.forEach(v => {
          const opt = document.createElement('option');
          opt.value = v.name;
          opt.textContent = v.name;
          opt.className = "text-gray-800";
          voiceSelect.appendChild(opt);
        });
        // 如果之前没选过，默认选第0个
        if (!currentSelection) voiceSelect.selectedIndex = 0;
      }
    }

    if ('speechSynthesis' in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    // 发音函数
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN';
        utterance.rate = 0.8;

        const voiceSelect = document.getElementById('voice-select');
        if (voiceSelect && voiceSelect.value) {
          const targetVoice = availableVoices.find(v => v.name === voiceSelect.value);
          if (targetVoice) {
            utterance.voice = targetVoice;
          }
        }

        window.speechSynthesis.speak(utterance);
      }
    }

    function playSong() {
      const songForTTS = "有 啊 先找 啊，没 啊 找 喔 鹅，衣 乌 并列标在后，衣 上标调点去掉";
      speak(songForTTS);
    }

    const colors = {
      'a': 'bg-red-100 text-red-600 border-red-200',
      'o': 'bg-yellow-100 text-yellow-600 border-yellow-200',
      'e': 'bg-green-100 text-green-600 border-green-200',
      'iu': 'bg-purple-100 text-purple-600 border-purple-200',
      'i': 'bg-indigo-100 text-indigo-600 border-indigo-200',
      'u': 'bg-blue-100 text-blue-600 border-blue-200',
      'u_dot': 'bg-pink-100 text-pink-600 border-pink-200'
    };

    function renderCards(category) {
      const container = document.getElementById('learning-view');
      container.innerHTML = '';

      data[category].forEach(item => {
        const style = colors[item.type] || 'bg-gray-100 text-gray-800';

        const card = document.createElement('div');
        card.className = `card bg-white rounded-2xl shadow-sm border-b-4 p-6 flex flex-col items-center justify-center relative overflow-hidden ${style.replace('bg-', 'border-')}`;

        card.onclick = () => speak(item.tts);

        card.innerHTML = `
                    <div class="absolute top-3 right-3 text-2xl opacity-20">🔊</div>
                    <div class="text-6xl font-bold pinyin-font mb-3 ${style.split(' ')[1]}">${item.py}</div>
                    <div class="text-4xl text-gray-700 font-serif mb-4">${item.char}</div>
                    <div class="w-full bg-gray-50 rounded-xl p-3 text-center">
                        <span class="text-xs text-gray-400 uppercase tracking-wider">规则</span>
                        <p class="text-base font-bold text-gray-600 leading-tight mt-1">${item.rule}</p>
                    </div>
                `;
        container.appendChild(card);
      });
    }

    function switchTab(tab) {
      ['two', 'three', 'whole', 'quiz'].forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (t === tab) {
          btn.classList.remove('btn-inactive');
          btn.classList.add('btn-active');
          if (t === 'quiz') {
            btn.classList.remove('bg-purple-100', 'text-purple-700', 'border-purple-200');
            btn.classList.add('bg-purple-600', 'text-white', 'border-purple-600');
          }
        } else {
          btn.classList.remove('btn-active');
          btn.classList.add('btn-inactive');
          if (t === 'quiz') {
            btn.classList.add('bg-purple-100', 'text-purple-700', 'border-purple-200');
            btn.classList.remove('bg-purple-600', 'text-white', 'border-purple-600');
          }
        }
      });

      const learningView = document.getElementById('learning-view');
      const quizView = document.getElementById('quiz-view');

      if (tab === 'quiz') {
        learningView.classList.add('hidden');
        quizView.classList.remove('hidden');
        initQuiz();
      } else {
        learningView.classList.remove('hidden');
        quizView.classList.add('hidden');
        renderCards(tab);
      }
    }

    function initQuiz() {
      quizQuestions = generateQuizData();
      currentQuestionIndex = 0;
      renderQuestion();
    }

    function renderQuestion() {
      const q = quizQuestions[currentQuestionIndex];
      const container = document.getElementById('quiz-letters');
      const feedback = document.getElementById('quiz-feedback');
      const nextBtn = document.getElementById('next-btn');

      document.getElementById('quiz-count').innerText = currentQuestionIndex + 1;
      document.getElementById('quiz-char-display').innerText = `“${q.char}”`;

      container.innerHTML = '';
      feedback.innerHTML = `<p class="text-gray-400 text-base">👆 请点击上方的字母完成标调</p>`;
      nextBtn.classList.add('hidden');

      let displayChars = q.clean.split('');

      displayChars.forEach((char, index) => {
        const btn = document.createElement('button');
        btn.className = "w-16 h-20 md:w-24 md:h-32 text-4xl md:text-6xl font-bold rounded-2xl border-4 border-gray-100 bg-white text-gray-700 hover:bg-blue-50 hover:border-blue-200 focus:outline-none transition transform shadow-sm relative overflow-hidden";
        btn.innerText = char;

        btn.onclick = () => {
          const isCorrect = (char === q.targetChar) ||
            (q.targetChar === 'ü' && char === 'u' && q.clean.includes('u') && !q.clean.includes('a') && !q.clean.includes('e'));

          let actuallyCorrect = false;

          if (char === q.targetChar) actuallyCorrect = true;
          if (q.targetChar === 'ü' && char === 'u') actuallyCorrect = true;
          if (q.original.includes('ui') && char === 'i') actuallyCorrect = true;
          if (q.original.includes('iu') && char === 'u') actuallyCorrect = true;

          if (actuallyCorrect) {
            btn.classList.remove('bg-white', 'border-gray-100');
            btn.classList.add('bg-green-500', 'text-white', 'border-green-600', 'correct-anim');
            feedback.innerHTML = `
                            <div class="text-center">
                                <p class="text-green-600 font-bold text-2xl mb-1">🎉 答对啦！</p>
                                <p class="text-gray-500 text-lg">读作：<span class="font-bold text-black">${q.original}</span> (${q.hint})</p>
                            </div>
                        `;
            speak("答对了！" + q.tts);

            Array.from(container.children).forEach(b => b.disabled = true);
            nextBtn.classList.remove('hidden');
          } else {
            btn.classList.add('bg-red-100', 'border-red-300', 'text-red-500', 'shake');
            setTimeout(() => btn.classList.remove('shake'), 500);
            speak("不对哦");

            if ('aeiouü'.includes(char)) {
              feedback.innerHTML = `<p class="text-red-500 font-bold text-lg">不是标在 ${char} 上哦，再想想口诀！</p>`;
            } else {
              feedback.innerHTML = `<p class="text-red-500 font-bold text-lg">声调从来不标在声母 ${char} 上哦！</p>`;
            }
          }
        };
        container.appendChild(btn);
      });
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex >= quizQuestions.length) {
        document.getElementById('quiz-letters').innerHTML = `<div class="text-8xl animate-bounce mt-4">🏆</div>`;
        document.getElementById('quiz-feedback').innerHTML = `
                    <div class="text-center mt-4">
                        <p class="text-3xl font-bold text-purple-600 mb-2">挑战完成！</p>
                        <p class="text-gray-500">Hilson太棒了！</p>
                    </div>
                `;
        document.getElementById('next-btn').innerHTML = "再玩一次";
        document.getElementById('next-btn').onclick = initQuiz;
        document.getElementById('quiz-char-display').innerText = "";
      } else {
        renderQuestion();
      }
    }

    switchTab('two');

  </script>
