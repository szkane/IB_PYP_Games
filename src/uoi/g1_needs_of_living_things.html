<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G1 UOI4 Needs of Living Things</title>
  <style>
    :root { --ink:#1f2a25; --paper:#f3fbef; --leaf:#68a85f; --water:#5aa3d9; --sun:#f3be44; --soil:#9d7356; --bad:#d96356; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:ui-rounded,"Avenir Next","Segoe UI",sans-serif; color:var(--ink); background:linear-gradient(135deg,rgba(104,168,95,.25),transparent 42%),var(--paper); }
    main { width:min(1120px,calc(100% - 24px)); margin:0 auto; padding:18px 0 28px; }
    h1 { margin:0; font-size:clamp(2rem,5vw,4rem); line-height:1; letter-spacing:0; }
    p { line-height:1.55; }
    .map-link { position:fixed; top:12px; right:12px; z-index:10; min-height:44px; display:inline-flex; align-items:center; border:2px solid var(--ink); border-radius:8px; padding:8px 12px; background:white; color:var(--ink); text-decoration:none; font-weight:900; box-shadow:3px 3px 0 var(--ink); }
    .game { display:grid; grid-template-columns:.95fr 1.05fr; gap:16px; }
    .panel { border:2px solid var(--ink); border-radius:8px; background:rgba(255,255,255,.84); padding:14px; box-shadow:5px 5px 0 rgba(31,42,37,.2); }
    .living { display:grid; place-items:center; min-height:260px; border:2px solid var(--ink); border-radius:8px; background:white; text-align:center; font-size:1.35rem; font-weight:900; }
    .living span { display:block; font-size:5rem; }
    .needs { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    button { min-height:64px; border:2px solid var(--ink); border-radius:8px; background:white; color:var(--ink); font:inherit; font-weight:900; cursor:pointer; }
    button.selected { background:#dff2d9; }
    .meter { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px; }
    .meter span { min-height:28px; border:2px solid var(--ink); border-radius:8px; background:white; }
    .meter span.on:nth-child(1){background:var(--water);} .meter span.on:nth-child(2){background:var(--sun);} .meter span.on:nth-child(3){background:var(--soil);} .meter span.on:nth-child(4){background:var(--leaf);}
    #feedback { min-height:48px; color:#356d36; font-weight:900; }
    .next { background:var(--leaf); color:white; padding:10px 14px; }
    @media(max-width:820px){ .game{grid-template-columns:1fr;} }
  </style>
</head>
<body>
  <a class="map-link" href="../index.html">PYP Map</a>
  <main>
    <p><strong>Unit 4 · Sharing the Planet</strong></p>
    <h1>Needs of Living Things</h1>
    <p>Choose what each living thing needs. Then check if it can survive and thrive.</p>
    <section class="game">
      <div class="panel">
        <h2 id="name">Plant</h2>
        <div class="living" id="living"></div>
        <div class="meter" id="meter"></div>
      </div>
      <div class="panel">
        <h2>Needs</h2>
        <div class="needs" id="needs"></div>
        <p id="feedback">Tap the needs for this living thing.</p>
        <button class="next" id="check">Check</button>
        <button class="next" id="next">Next living thing</button>
      </div>
    </section>
  </main>
  <script>
    const rounds = [
      { name: "Sunflower", icon: "🌻", needs: ["Water", "Sunlight", "Soil", "Air"], extras: ["Tablet", "Shoes"] },
      { name: "Fish", icon: "🐟", needs: ["Water", "Food", "Safe home", "Air in water"], extras: ["Backpack", "Crayons"] },
      { name: "Rabbit", icon: "🐇", needs: ["Food", "Water", "Air", "Safe home"], extras: ["Moonlight", "Pencil"] }
    ];
    let index = 0;
    let selected = new Set();
    const living = document.getElementById("living");
    const needs = document.getElementById("needs");
    const meter = document.getElementById("meter");
    const feedback = document.getElementById("feedback");
    const shuffle = items => [...items].sort(() => Math.random() - 0.5);

    function render() {
      selected = new Set();
      const round = rounds[index];
      document.getElementById("name").textContent = round.name;
      living.innerHTML = `<span>${round.icon}</span>${round.name}`;
      needs.innerHTML = shuffle([...round.needs, ...round.extras]).map(need => `<button>${need}</button>`).join("");
      meter.innerHTML = round.needs.map(() => "<span></span>").join("");
      feedback.textContent = "Tap the needs for this living thing.";
      needs.querySelectorAll("button").forEach(button => button.addEventListener("click", () => {
        button.classList.toggle("selected");
        if (selected.has(button.textContent)) selected.delete(button.textContent);
        else selected.add(button.textContent);
        updateMeter();
      }));
    }

    function updateMeter() {
      const round = rounds[index];
      const count = round.needs.filter(need => selected.has(need)).length;
      Array.from(meter.children).forEach((bar, i) => bar.classList.toggle("on", i < count));
    }

    function check() {
      const round = rounds[index];
      const allNeeds = round.needs.every(need => selected.has(need));
      const noExtras = [...selected].every(need => round.needs.includes(need));
      feedback.textContent = allNeeds && noExtras ? `${round.name} has what it needs. Thank you for caring.` : "Look again. Living things need helpful things, not every thing.";
    }

    document.getElementById("check").addEventListener("click", check);
    document.getElementById("next").addEventListener("click", () => { index = (index + 1) % rounds.length; render(); });
    render();
  </script>
</body>
</html>
