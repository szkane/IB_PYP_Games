<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G1 UOI2 Community Helpers Sort</title>
  <style>
    :root { --ink:#1f2a25; --paper:#f4fbf8; --aqua:#92d5cf; --gold:#f3bf54; --rose:#e66d73; --green:#4f9a72; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font-family:ui-rounded,"Avenir Next","Segoe UI",sans-serif; color:var(--ink); background:linear-gradient(120deg,#fff7df,transparent 45%),var(--paper); }
    main { width:min(1120px,calc(100% - 24px)); margin:0 auto; padding:18px 0 28px; }
    h1 { margin:0; font-size:clamp(2rem,5vw,4rem); line-height:1; letter-spacing:0; }
    p { line-height:1.55; }
    .map-link { position:fixed; top:12px; right:12px; z-index:10; min-height:44px; display:inline-flex; align-items:center; border:2px solid var(--ink); border-radius:8px; padding:8px 12px; background:white; color:var(--ink); text-decoration:none; font-weight:900; box-shadow:3px 3px 0 var(--ink); }
    .hud { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
    .pill { min-height:44px; display:inline-flex; align-items:center; border:2px solid var(--ink); border-radius:8px; padding:8px 12px; background:var(--gold); font-weight:900; box-shadow:4px 4px 0 var(--ink); }
    .grid { display:grid; grid-template-columns:.9fr 1.1fr; gap:16px; }
    .panel { border:2px solid var(--ink); border-radius:8px; background:rgba(255,255,255,.82); padding:14px; box-shadow:5px 5px 0 rgba(31,42,37,.2); }
    .helpers, .choices { display:grid; gap:10px; }
    .helpers { grid-template-columns:repeat(2,minmax(0,1fr)); }
    button { min-height:56px; border:2px solid var(--ink); border-radius:8px; background:white; color:var(--ink); font:inherit; font-weight:900; cursor:pointer; }
    button.active { background:var(--aqua); box-shadow:inset 0 0 0 4px rgba(255,255,255,.62); }
    button.done { background:#d9f1df; opacity:.72; }
    .choice { display:grid; grid-template-columns:70px 1fr; align-items:center; gap:10px; padding:10px; text-align:left; }
    .place { min-height:46px; display:grid; place-items:center; border-radius:8px; background:var(--green); color:white; }
    #feedback { min-height:48px; color:#2b6952; font-weight:900; }
    .next { background:var(--rose); color:white; padding:10px 14px; }
    @media (max-width:820px){ .grid{grid-template-columns:1fr;} .helpers{grid-template-columns:1fr;} }
  </style>
</head>
<body>
  <a class="map-link" href="../index.html">PYP Map</a>
  <main>
    <div class="hud">
      <div>
        <p><strong>Unit 2 · How We Organize Ourselves</strong></p>
        <h1>Community Helpers Sort</h1>
        <p>Tap a helper, then tap the place and responsibility that match.</p>
      </div>
      <div class="pill" id="score">Matches 0</div>
    </div>
    <section class="grid">
      <aside class="panel">
        <h2>Helpers</h2>
        <div class="helpers" id="helpers"></div>
      </aside>
      <section class="panel">
        <h2>Places and responsibilities</h2>
        <div class="choices" id="choices"></div>
        <p id="feedback">Choose a helper first.</p>
        <button class="next" id="next">New helpers</button>
      </section>
    </section>
  </main>
  <script>
    const rounds = [
      [
        ["Teacher", "School", "helps students learn"],
        ["Doctor", "Clinic", "helps people feel better"],
        ["Librarian", "Library", "helps people find books"],
        ["Cleaner", "School", "keeps shared spaces tidy"]
      ],
      [
        ["Bus driver", "Bus stop", "helps people travel safely"],
        ["Chef", "Cafeteria", "cooks food for the community"],
        ["Firefighter", "Fire station", "helps keep people safe"],
        ["Gardener", "Garden", "cares for plants"]
      ]
    ];
    let round = 0;
    let selected = null;
    let matches = 0;
    const helpers = document.getElementById("helpers");
    const choices = document.getElementById("choices");
    const feedback = document.getElementById("feedback");
    const score = document.getElementById("score");
    const shuffle = items => [...items].sort(() => Math.random() - 0.5);

    function render() {
      selected = null;
      const data = rounds[round];
      helpers.innerHTML = data.map(item => `<button data-helper="${item[0]}">${item[0]}</button>`).join("");
      choices.innerHTML = shuffle(data).map(item => `
        <button class="choice" data-helper="${item[0]}">
          <span class="place">${item[1]}</span>
          <span>${item[2]}</span>
        </button>`).join("");
      helpers.querySelectorAll("button").forEach(button => button.addEventListener("click", () => {
        if (button.classList.contains("done")) return;
        selected = button.dataset.helper;
        helpers.querySelectorAll("button").forEach(b => b.classList.toggle("active", b === button));
        feedback.textContent = `Now find where the ${selected} helps.`;
      }));
      choices.querySelectorAll("button").forEach(button => button.addEventListener("click", () => check(button)));
    }

    function check(button) {
      if (!selected) {
        feedback.textContent = "Choose a helper first.";
        return;
      }
      if (button.dataset.helper === selected) {
        matches += 1;
        score.textContent = `Matches ${matches}`;
        feedback.textContent = `${selected} is part of a caring community.`;
        helpers.querySelector(`[data-helper="${selected}"]`).classList.add("done");
        button.classList.add("done");
        selected = null;
      } else {
        feedback.textContent = "Try another place. Think about the helper's role.";
      }
    }

    document.getElementById("next").addEventListener("click", () => {
      round = (round + 1) % rounds.length;
      render();
    });
    render();
  </script>
</body>
</html>
