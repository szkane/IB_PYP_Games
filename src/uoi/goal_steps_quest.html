<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G1 UOI1 Goal Steps Quest</title>
  <style>
    :root {
      --ink: #1f2a25;
      --paper: #fff8e8;
      --mint: #9bd8c6;
      --sun: #f5c24f;
      --coral: #e96f5f;
      --blue: #5b83db;
      --line: #25342f;
      --soft: rgba(255,255,255,.78);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-rounded, "Avenir Next", "Segoe UI", sans-serif;
      color: var(--ink);
      background: linear-gradient(135deg, rgba(155,216,198,.55), transparent 38%), var(--paper);
    }
    main { width: min(1120px, calc(100% - 24px)); margin: 0 auto; padding: 18px 0 28px; }
    header { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: end; margin-bottom: 14px; }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 4.2rem); line-height: 1; letter-spacing: 0; }
    p { line-height: 1.55; }
    .badge { border: 2px solid var(--line); border-radius: 8px; background: var(--sun); padding: 10px 12px; font-weight: 900; box-shadow: 4px 4px 0 var(--line); }
    .map-link {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 10;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      border: 2px solid var(--line);
      border-radius: 8px;
      padding: 8px 12px;
      background: white;
      color: var(--ink);
      text-decoration: none;
      font-weight: 900;
      box-shadow: 3px 3px 0 var(--line);
    }
    .board { display: grid; grid-template-columns: .8fr 1.2fr; gap: 16px; align-items: start; }
    .panel { border: 2px solid var(--line); border-radius: 8px; background: var(--soft); padding: 14px; box-shadow: 5px 5px 0 rgba(31,42,37,.24); }
    .goal { display: grid; gap: 10px; }
    .goal button, .action, .slot, .primary {
      min-height: 54px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: white;
      color: var(--ink);
      font: inherit;
      font-weight: 900;
      cursor: pointer;
    }
    .goal button.active { background: var(--mint); box-shadow: inset 0 0 0 4px rgba(255,255,255,.6); }
    .path { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 12px 0; }
    .slot { display: grid; place-items: center; min-height: 112px; padding: 10px; background: #fffdf7; text-align: center; }
    .slot.filled { background: #dff3ed; }
    .actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .action { padding: 12px; text-align: left; }
    .action.used { opacity: .45; }
    .feedback { min-height: 46px; font-weight: 900; color: #265f50; }
    .primary { padding: 12px 16px; background: var(--coral); color: white; }
    @media (max-width: 820px) { .board { grid-template-columns: 1fr; } header { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <a class="map-link" href="../index.html">PYP Map</a>
  <main>
    <header>
      <div>
        <p><strong>Unit 1 · Who We Are</strong></p>
        <h1>Goal Steps Quest</h1>
        <p>Pick a learning goal. Then choose three small action steps that help Hilson grow.</p>
      </div>
      <div class="badge" id="score">Stars 0</div>
    </header>

    <section class="board">
      <aside class="panel">
        <h2>Choose a goal</h2>
        <div class="goal" id="goals"></div>
      </aside>
      <section class="panel">
        <h2 id="missionTitle">Build your action path</h2>
        <div class="path" id="path"></div>
        <div class="feedback" id="feedback">Tap action cards to fill the path.</div>
        <div class="actions" id="actions"></div>
        <p><button class="primary" id="check">Check my plan</button> <button class="primary" id="reset">New round</button></p>
      </section>
    </section>
  </main>

  <script>
    const missions = [
      {
        goal: "Read smoothly",
        steps: ["Read 10 minutes", "Point to each word", "Ask one question"],
        extras: ["Run in the hallway", "Hide the book"]
      },
      {
        goal: "Pack my school bag",
        steps: ["Check the timetable", "Put homework inside", "Zip the bag"],
        extras: ["Leave lunch at home", "Wait for someone else"]
      },
      {
        goal: "Use finger spaces",
        steps: ["Say the sentence", "Leave a space", "Reread my writing"],
        extras: ["Write all words together", "Skip the period"]
      }
    ];
    let current = 0;
    let chosen = [];
    let stars = 0;
    const goalsEl = document.getElementById("goals");
    const pathEl = document.getElementById("path");
    const actionsEl = document.getElementById("actions");
    const feedback = document.getElementById("feedback");
    const score = document.getElementById("score");
    const missionTitle = document.getElementById("missionTitle");

    function shuffle(items) {
      return [...items].sort(() => Math.random() - 0.5);
    }

    function renderGoals() {
      goalsEl.innerHTML = missions.map((mission, index) =>
        `<button class="${index === current ? "active" : ""}" data-goal="${index}">${mission.goal}</button>`
      ).join("");
      goalsEl.querySelectorAll("button").forEach(button => {
        button.addEventListener("click", () => {
          current = Number(button.dataset.goal);
          startRound();
        });
      });
    }

    function startRound() {
      chosen = [];
      const mission = missions[current];
      missionTitle.textContent = `Goal: ${mission.goal}`;
      pathEl.innerHTML = [0, 1, 2].map(i => `<div class="slot">Step ${i + 1}</div>`).join("");
      actionsEl.innerHTML = shuffle([...mission.steps, ...mission.extras]).map(action =>
        `<button class="action">${action}</button>`
      ).join("");
      actionsEl.querySelectorAll(".action").forEach(button => {
        button.addEventListener("click", () => chooseAction(button));
      });
      feedback.textContent = "Tap action cards to fill the path.";
      renderGoals();
    }

    function chooseAction(button) {
      if (button.classList.contains("used") || chosen.length >= 3) return;
      chosen.push(button.textContent);
      button.classList.add("used");
      const slot = pathEl.children[chosen.length - 1];
      slot.textContent = button.textContent;
      slot.classList.add("filled");
    }

    function checkPlan() {
      const mission = missions[current];
      if (chosen.length < 3) {
        feedback.textContent = "Choose three steps first.";
        return;
      }
      const correct = mission.steps.every(step => chosen.includes(step));
      if (correct) {
        stars += 1;
        score.textContent = `Stars ${stars}`;
        feedback.textContent = "Great plan. Small steps help learners grow.";
      } else {
        feedback.textContent = "Try again. Pick actions that help the goal.";
      }
    }

    document.getElementById("check").addEventListener("click", checkPlan);
    document.getElementById("reset").addEventListener("click", () => {
      current = (current + 1) % missions.length;
      startRound();
    });
    startRound();
  </script>
</body>
</html>
