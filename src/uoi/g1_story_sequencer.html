<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story Sequencer Theater — IB PYP Grade 1 UOI 3</title>
  <style>
    :root {
      --bg: #FFFDF0;
      --ink: #111111;
      --yellow: #FFE156;
      --coral: #FF6584;
      --teal: #4ECDC4;
      --blue: #38B6FF;
      --purple: #B388FF;
      --green: #86EFAC;
      --white: #FFFFFF;
      --border: 3.5px solid var(--ink);
      --shadow: 4px 4px 0 var(--ink);
      --shadow-sm: 2px 2px 0 var(--ink);
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: ui-rounded, "Avenir Next", "Nunito", system-ui, sans-serif;
      background:
        radial-gradient(circle at 14% 12%, rgba(255, 101, 132, 0.16), transparent 34%),
        radial-gradient(circle at 86% 84%, rgba(179, 136, 255, 0.18), transparent 34%),
        var(--bg);
      color: var(--ink);
      min-height: 100dvh;
      padding: 10px 14px 24px;
      -webkit-tap-highlight-color: transparent;
    }

    .container { max-width: 1080px; margin: 0 auto; }

    .nav-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .nav-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    .pyp-map-link {
      display: inline-flex; align-items: center; min-height: 44px; padding: 8px 16px;
      background: var(--yellow); color: var(--ink); text-decoration: none; font-weight: 900;
      font-size: 0.92rem; border: var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
      touch-action: manipulation;
    }
    .pyp-map-link:active { transform: translate(2px, 2px); box-shadow: var(--shadow-sm); }

    .unit-tag {
      display: inline-flex; align-items: center; min-height: 44px; padding: 6px 14px;
      background: var(--coral); color: var(--white); border: var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow); font-weight: 900; font-size: 0.88rem;
    }

    /* Neobrutalism TTS Radio Dropdown */
    .tts-dropdown-wrap { position: relative; display: inline-block; user-select: none; }
    .tts-trigger {
      display: inline-flex; align-items: center; gap: 6px; background: #FFF;
      border: 2.5px solid var(--ink); border-radius: 10px; box-shadow: 3px 3px 0 var(--ink);
      padding: 6px 12px; font: inherit; font-size: 0.85rem; font-weight: 800; color: var(--ink); cursor: pointer; min-height: 44px;
    }
    .tts-trigger:hover { background: #FEF08A; }
    .tts-arrow { font-size: 0.75rem; transition: transform 0.15s ease; }
    .tts-dropdown-wrap.open .tts-arrow { transform: rotate(180deg); }
    .tts-menu {
      display: none; position: absolute; top: calc(100% + 6px); right: 0;
      min-width: 250px; max-width: 310px; max-height: 280px; overflow-y: auto;
      background: #FFF; border: 3px solid var(--ink); border-radius: 12px;
      box-shadow: 4px 4px 0 var(--ink); padding: 6px; z-index: 1000; flex-direction: column; gap: 3px;
    }
    .tts-dropdown-wrap.open .tts-menu { display: flex; }
    .tts-menu-header { font-size: 0.72rem; font-weight: 900; text-transform: uppercase; color: #6B7280; padding: 4px 8px 6px; border-bottom: 2px solid #E5E7EB; }
    .tts-radio-group { display: flex; flex-direction: column; gap: 3px; }
    .tts-radio-item {
      display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 2px solid transparent;
      border-radius: 8px; background: transparent; cursor: pointer; font: inherit; font-size: 0.82rem; font-weight: 700; width: 100%; text-align: left;
    }
    .tts-radio-item:hover { background: #FEF9C3; border-color: var(--ink); }
    .tts-radio-item.active { background: #E0F2FE; border-color: var(--ink); font-weight: 800; }
    .tts-radio-circle { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--ink); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; background: #FFF; }
    .tts-radio-item.active .tts-radio-circle::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink); }
    .tts-item-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }

    .btn-speaker {
      display: inline-flex; align-items: center; justify-content: center;
      background: #FEF08A; border: 2.5px solid var(--ink); box-shadow: 2px 2px 0 var(--ink);
      border-radius: 10px; width: 40px; height: 40px; cursor: pointer; font-size: 1.1rem; flex-shrink: 0;
    }
    .btn-speaker.speaking { background: var(--green); animation: ttsPulse 0.7s infinite alternate; }
    @keyframes ttsPulse { from { transform: scale(1); } to { transform: scale(1.1); } }

    .hero-card {
      background: var(--white); border: var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 10px 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .hero-title { display: flex; align-items: center; gap: 10px; }
    .hero-title h1 { font-size: clamp(1.2rem, 2.5vw, 1.6rem); font-weight: 900; }

    .story-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .story-tab {
      min-height: 44px; padding: 6px 12px; border: 2.5px solid var(--ink); border-radius: 12px;
      background: var(--white); box-shadow: var(--shadow-sm); font: inherit; font-weight: 900; font-size: 0.85rem; cursor: pointer;
    }
    .story-tab.active { background: var(--yellow); }
    .story-tab.solved { background: var(--green); }

    .play-grid { display: grid; grid-template-columns: 1fr 1.15fr; gap: 14px; align-items: start; }
    .panel { background: var(--white); border: var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; }

    .theater-svg {
      width: 100%; border: 3px solid var(--ink); border-radius: 12px; overflow: hidden;
      background: #1e1b4b; margin-bottom: 10px;
    }
    .theater-svg svg { display: block; width: 100%; height: auto; }

    .card-tray { display: grid; gap: 10px; }
    .story-card {
      min-height: 68px; padding: 10px 12px; border: 2.5px solid var(--ink); border-radius: 12px;
      background: var(--white); box-shadow: 3px 3px 0 var(--ink); font: inherit; font-weight: 800;
      font-size: 0.9rem; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 10px;
      touch-action: manipulation;
    }
    .story-card:hover { background: #FEF9C3; }
    .story-card.used { opacity: 0.4; background: #E2E8F0; box-shadow: none; pointer-events: none; }

    .act-list { display: grid; gap: 10px; margin-bottom: 12px; }
    .act-slot {
      min-height: 74px; padding: 10px 12px; border: 2.5px dashed var(--ink); border-radius: 12px;
      background: #FFFDF7; display: grid; grid-template-columns: 112px 1fr; align-items: center; gap: 10px;
      cursor: pointer; font-weight: 800; font-size: 0.9rem;
    }
    .act-slot.filled { border-style: solid; background: #E0F2FE; box-shadow: 2px 2px 0 var(--ink); }
    .act-slot.solved { background: var(--green); }

    .act-badge {
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      min-height: 44px; padding: 4px 8px; border: 2px solid var(--ink); border-radius: 10px;
      background: var(--yellow); font-weight: 900; font-size: 0.82rem;
    }

    .msg-banner {
      background: #FDF2F8; border: 2.5px solid var(--ink); border-left: 8px solid var(--coral);
      border-radius: 10px; padding: 8px 12px; font-weight: 800; font-size: 0.88rem; margin-bottom: 10px;
    }

    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      min-height: 46px; padding: 8px 14px; border: var(--border); border-radius: 12px;
      box-shadow: var(--shadow-sm); font: inherit; font-weight: 900; font-size: 0.9rem; cursor: pointer;
    }
    .btn:active { transform: translate(2px, 2px); box-shadow: none; }
    .btn.coral { background: var(--coral); color: var(--white); flex: 1; }
    .btn.teal { background: var(--teal); }
    .btn.secondary { background: var(--white); }

    .feedback-bar {
      margin-top: 10px; min-height: 48px; padding: 10px 12px; border: 2.5px solid var(--ink);
      border-radius: 12px; background: #F1F5F9; font-weight: 800; font-size: 0.9rem; display: flex; align-items: center;
    }
    .feedback-bar.good { background: var(--green); }
    .feedback-bar.warn { background: #FEF08A; }

    @media (max-width: 820px) {
      .play-grid { grid-template-columns: 1fr; }
      .act-slot { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <nav class="nav-bar">
      <div class="nav-left">
        <a class="pyp-map-link" href="../index.html">← PYP Map</a>
        <span class="unit-tag">🎭 Grade 1 · Unit 3 · Storytelling</span>
      </div>
      <div class="tts-dropdown-wrap" id="ttsDropdownWrap">
        <button type="button" class="tts-trigger" id="ttsTrigger" aria-haspopup="menu" aria-expanded="false">
          <span class="tts-trigger-flag" id="ttsFlag">🇬🇧</span>
          <span class="tts-trigger-label" id="ttsLabel">Voice</span>
          <span class="tts-arrow">▾</span>
        </button>
        <div class="tts-menu" id="ttsMenu" role="menu">
          <div class="tts-menu-header">Select Voice Accent</div>
          <div class="tts-radio-group" id="ttsRadioList" role="radiogroup"></div>
        </div>
      </div>
    </nav>

    <header class="hero-card">
      <div class="hero-title">
        <h1>Story Sequencer Theater 🎭📖</h1>
        <button type="button" class="btn-speaker" id="btnSpeakTitle" aria-label="Read title">🔊</button>
      </div>
      <div class="story-tabs" id="storyTabs"></div>
    </header>

    <main class="play-grid">
      <section class="panel">
        <div class="theater-svg">
          <svg viewBox="0 0 420 116" aria-label="Story Theater Stage">
            <rect x="0" y="0" width="420" height="116" fill="#1e1b4b"/>
            <rect x="26" y="18" width="368" height="80" rx="8" fill="#FFFBEB" stroke="#111" stroke-width="3"/>
            <text x="210" y="66" text-anchor="middle" font-size="22" font-weight="900" fill="#111" id="stageTitleText">The Lost Lunchbox 🍱</text>
            <!-- Stage Curtains -->
            <path id="curtainL" d="M 0 0 L 74 0 Q 52 58 68 116 L 0 116 Z" fill="#FF6584" stroke="#111" stroke-width="3" style="transition: transform 0.5s ease;"/>
            <path id="curtainR" d="M 420 0 L 346 0 Q 368 58 352 116 L 420 116 Z" fill="#FF6584" stroke="#111" stroke-width="3" style="transition: transform 0.5s ease;"/>
            <rect x="0" y="0" width="420" height="16" fill="#FFE156" stroke="#111" stroke-width="3"/>
          </svg>
        </div>
        <h2 style="font-size:1rem; margin-bottom:10px;">1. Tap Story Cards in Order:</h2>
        <div class="card-tray" id="cardTray"></div>
      </section>

      <section class="panel">
        <h2 style="font-size:1rem; margin-bottom:10px;">2. Build the 3-Act Story (Tap a slot to undo):</h2>
        <div class="act-list" id="actList"></div>
        <div class="msg-banner" id="msgBanner">💡 Story Message: Friends can listen, help, and show care.</div>
        <div class="btn-row">
          <button type="button" class="btn coral" id="btnCheck">Check Story Order ✨</button>
          <button type="button" class="btn teal" id="btnPlayStory">🔊 Play Story</button>
          <button type="button" class="btn secondary" id="btnReset">Clear ↺</button>
        </div>
        <div class="feedback-bar" id="feedbackBar" aria-live="polite">
          Tap the Beginning, Middle, and End cards to direct the play!
        </div>
      </section>
    </main>
  </div>

  <script>
    class SoundFX {
      constructor() { this.ctx = null; }
      init() {
        try {
          if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
          if (this.ctx.state === "suspended") this.ctx.resume();
        } catch (_) {}
      }
      playClick() {
        this.init(); if (!this.ctx) return;
        const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.frequency.setValueAtTime(560, t); o.frequency.exponentialRampToValueAtTime(320, t + 0.05);
        g.gain.setValueAtTime(0.11, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
        o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + 0.055);
      }
      playCorrect() {
        this.init(); if (!this.ctx) return;
        const t = this.ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
          const o = this.ctx.createOscillator(), g = this.ctx.createGain();
          o.frequency.setValueAtTime(f, t + i * 0.06);
          g.gain.setValueAtTime(0.15, t + i * 0.06); g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.06 + 0.24);
          o.connect(g); g.connect(this.ctx.destination); o.start(t + i * 0.06); o.stop(t + i * 0.06 + 0.26);
        });
      }
      playBuzz() {
        this.init(); if (!this.ctx) return;
        const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = "triangle"; o.frequency.setValueAtTime(175, t);
        g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
        o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + 0.2);
      }
    }
    const sfx = new SoundFX();

    const TTS_MANAGER = {
      currentVoiceName: "", wrap: null, trigger: null, menu: null, flag: null, label: null, list: null,
      init() {
        this.wrap = document.getElementById("ttsDropdownWrap");
        this.trigger = document.getElementById("ttsTrigger");
        this.menu = document.getElementById("ttsMenu");
        this.flag = document.getElementById("ttsFlag");
        this.label = document.getElementById("ttsLabel");
        this.list = document.getElementById("ttsRadioList");
        if (!this.trigger) return;
        this.trigger.addEventListener("click", (e) => { e.stopPropagation(); this.wrap.classList.toggle("open"); });
        document.addEventListener("click", (e) => { if (this.wrap && !this.wrap.contains(e.target)) this.wrap.classList.remove("open"); });
        if (window.speechSynthesis) {
          this.populateVoices();
          if (window.speechSynthesis.onvoiceschanged !== undefined) window.speechSynthesis.onvoiceschanged = () => this.populateVoices();
        }
      },
      populateVoices() {
        const voices = window.speechSynthesis.getVoices();
        if (!voices.length) return;
        let available = voices.filter(v => (v.lang || "").toLowerCase().replace("_", "-").startsWith("en"));
        if (!available.length) available = voices;
        const saved = localStorage.getItem("ib_pyp_voice_name");
        let selected = (saved && available.find(v => v.name === saved)) || available.find(v => (v.lang || "").toLowerCase().includes("gb")) || available.find(v => (v.lang || "").toLowerCase().includes("us")) || available.find(v => v.default) || available[0];
        this.currentVoiceName = selected ? selected.name : "";
        this.list.innerHTML = "";
        available.slice(0, 15).forEach(v => {
          const lang = (v.lang || "").toLowerCase().replace("_", "-");
          const flag = lang.includes("au") ? "🇦🇺" : lang.includes("gb") ? "🇬🇧" : lang.includes("us") || lang.startsWith("en") ? "🇺🇸" : "🌐";
          const region = lang.includes("au") ? "AU" : lang.includes("gb") ? "UK" : lang.includes("us") ? "US" : (v.lang || "System");
          const isActive = v.name === this.currentVoiceName;
          const btn = document.createElement("button");
          btn.type = "button"; btn.className = "tts-radio-item" + (isActive ? " active" : "");
          btn.innerHTML = `<span class="tts-radio-circle"></span><span class="tts-item-flag">${flag}</span><span class="tts-item-name">${v.name} (${region})</span>`;
          btn.addEventListener("click", (e) => {
            e.stopPropagation(); this.currentVoiceName = v.name; localStorage.setItem("ib_pyp_voice_name", v.name);
            this.updateTriggerUI(v);
            this.list.querySelectorAll(".tts-radio-item").forEach(b => b.classList.toggle("active", b === btn));
            this.wrap.classList.remove("open");
          });
          this.list.appendChild(btn);
        });
        this.updateTriggerUI(selected);
      },
      updateTriggerUI(v) {
        if (!v) return;
        const lang = (v.lang || "").toLowerCase().replace("_", "-");
        this.flag.textContent = lang.includes("au") ? "🇦🇺" : lang.includes("gb") ? "🇬🇧" : lang.includes("us") || lang.startsWith("en") ? "🇺🇸" : "🌐";
        let shortName = (v.name || "Voice").replace(/^(Google|Microsoft|Apple)\s+/i, "");
        if (shortName.length > 14) shortName = shortName.substring(0, 12) + "...";
        this.label.textContent = shortName;
      },
      speak(text, btn) {
        if (!window.speechSynthesis || !text) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        const voices = window.speechSynthesis.getVoices();
        const chosen = voices.find(v => v.name === this.currentVoiceName) || voices.find(v => v.default) || voices[0];
        if (chosen) u.voice = chosen;
        u.rate = 0.88;
        if (btn) { btn.classList.add("speaking"); u.onend = u.onerror = () => btn.classList.remove("speaking"); }
        window.speechSynthesis.speak(u);
      }
    };
    TTS_MANAGER.init();

    const STORIES = [
      {
        tab: "🍱 Lost Lunchbox",
        title: "The Lost Lunchbox 🍱",
        cards: [
          { icon: "😟", text: "Mina cannot find her lunchbox before snack time." },
          { icon: "🔍", text: "Her friend asks questions and helps her look under the art table." },
          { icon: "💛", text: "Mina says thank you and shares how relieved she feels." }
        ],
        message: "Friends can listen, help, and show care."
      },
      {
        tab: "📖 Brave Reader",
        title: "The Brave Reader 📖",
        cards: [
          { icon: "💓", text: "Leo feels nervous about reading aloud to the class." },
          { icon: "🌬️", text: "He takes a calm breath and reads one page at a time." },
          { icon: "👏", text: "The class claps because Leo tried something challenging." }
        ],
        message: "Stories can show courage and effort."
      },
      {
        tab: "🧸 Puppet Show",
        title: "The Puppet Show 🧸",
        cards: [
          { icon: "🎨", text: "A group chooses fun characters for a puppet show." },
          { icon: "🗣️", text: "They practice voices and decide what happens next." },
          { icon: "🌟", text: "They perform and ask the audience what they noticed." }
        ],
        message: "People express ideas through stories in creative ways."
      }
    ];

    const ACTS = ["🌅 Beginning", "⚡ Middle", "🌟 End"];
    let storyIdx = 0;
    let slots = [null, null, null];
    let shuffled = [];
    const solved = [false, false, false];
    const shuffle = arr => [...arr].sort(() => Math.random() - 0.5);

    function renderTabs() {
      const wrap = document.getElementById("storyTabs");
      wrap.innerHTML = "";
      STORIES.forEach((s, i) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = `story-tab${i === storyIdx ? " active" : ""}${solved[i] ? " solved" : ""}`;
        b.textContent = solved[i] ? `${s.tab} ✅` : s.tab;
        b.addEventListener("click", () => { sfx.playClick(); storyIdx = i; startStory(); });
        wrap.appendChild(b);
      });
    }

    function setCurtains(open) {
      document.getElementById("curtainL").style.transform = open ? "translateX(-48px)" : "translateX(0)";
      document.getElementById("curtainR").style.transform = open ? "translateX(48px)" : "translateX(0)";
    }

    function renderBoard() {
      const tray = document.getElementById("cardTray");
      tray.innerHTML = "";
      shuffled.forEach(card => {
        const isUsed = slots.some(s => s && s.text === card.text);
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "story-card" + (isUsed ? " used" : "");
        btn.innerHTML = `<span style="font-size:1.5rem;">${card.icon}</span><span>${card.text}</span>`;
        btn.addEventListener("click", () => {
          const empty = slots.indexOf(null);
          if (empty === -1) return;
          sfx.playClick();
          slots[empty] = card;
          renderBoard();
        });
        tray.appendChild(btn);
      });

      const list = document.getElementById("actList");
      list.innerHTML = "";
      slots.forEach((card, i) => {
        const div = document.createElement("div");
        div.className = "act-slot" + (card ? " filled" : "") + (solved[storyIdx] ? " solved" : "");
        div.innerHTML = `<span class="act-badge">${ACTS[i]}</span><span>${card ? `${card.icon} ${card.text}` : "❓ Tap a story card to place here"}</span>`;
        div.addEventListener("click", () => {
          if (!card) return;
          sfx.playClick();
          slots[i] = null;
          setCurtains(false);
          renderBoard();
        });
        list.appendChild(div);
      });
    }

    function startStory() {
      const s = STORIES[storyIdx];
      slots = [null, null, null];
      shuffled = shuffle(s.cards);
      document.getElementById("stageTitleText").textContent = s.title;
      document.getElementById("msgBanner").textContent = `💡 Story Message: ${s.message}`;
      const fb = document.getElementById("feedbackBar");
      fb.className = "feedback-bar";
      fb.textContent = "Tap the Beginning, Middle, and End cards to direct the play!";
      setCurtains(false);
      renderTabs();
      renderBoard();
    }

    document.getElementById("btnCheck").addEventListener("click", () => {
      const fb = document.getElementById("feedbackBar");
      if (slots.some(s => s === null)) {
        sfx.playBuzz();
        fb.className = "feedback-bar warn";
        fb.textContent = "👆 Please fill Beginning, Middle, and End first!";
        return;
      }
      const target = STORIES[storyIdx].cards;
      const ok = target.every((c, i) => slots[i].text === c.text);
      if (ok) {
        sfx.playCorrect();
        solved[storyIdx] = true;
        setCurtains(true);
        renderTabs();
        renderBoard();
        fb.className = "feedback-bar good";
        fb.textContent = "🎉 Bravo! Your story flows in clear Beginning → Middle → End order!";
      } else {
        sfx.playBuzz();
        fb.className = "feedback-bar warn";
        fb.textContent = "🤔 Almost! Ask yourself: What happened first, what happened next, and how did it end?";
      }
    });

    document.getElementById("btnPlayStory").addEventListener("click", (e) => {
      sfx.playClick();
      const s = STORIES[storyIdx];
      const spoken = slots.every(Boolean)
        ? slots.map(c => c.text).join(" ")
        : `${s.title.replace(/[^\w\s]/g, "")}. Put the cards in order first to hear your story!`;
      TTS_MANAGER.speak(spoken, e.currentTarget);
    });

    document.getElementById("btnReset").addEventListener("click", () => { sfx.playClick(); startStory(); });
    document.getElementById("btnSpeakTitle").addEventListener("click", (e) => {
      sfx.playClick();
      TTS_MANAGER.speak("Story Sequencer Theater. Put the beginning, middle, and end cards in order.", e.currentTarget);
    });

    startStory();
  </script>
</body>
</html>
