<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G1 UOI3 Story Sequencer</title>
  <style>
    :root { --ink:#221f2a; --paper:#fff8f1; --blue:#6f9de8; --pink:#ef8aa9; --gold:#f1bd4a; --green:#62a77b; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:ui-rounded,"Avenir Next","Segoe UI",sans-serif; color:var(--ink); background:linear-gradient(135deg,rgba(239,138,169,.28),transparent 40%),var(--paper); }
    main { width:min(1120px,calc(100% - 24px)); margin:0 auto; padding:18px 0 28px; }
    h1 { margin:0; font-size:clamp(2rem,5vw,4rem); line-height:1; letter-spacing:0; }
    p { line-height:1.55; }
    .map-link { position:fixed; top:12px; right:12px; z-index:10; min-height:44px; display:inline-flex; align-items:center; border:2px solid var(--ink); border-radius:8px; padding:8px 12px; background:white; color:var(--ink); text-decoration:none; font-weight:900; box-shadow:3px 3px 0 var(--ink); }
    .layout { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .panel { border:2px solid var(--ink); border-radius:8px; background:rgba(255,255,255,.84); padding:14px; box-shadow:5px 5px 0 rgba(34,31,42,.2); }
    .cards, .sequence { display:grid; gap:10px; }
    .card, .slot, button { min-height:62px; border:2px solid var(--ink); border-radius:8px; font:inherit; font-weight:900; }
    .card { background:white; text-align:left; padding:12px; cursor:pointer; }
    .card.used { opacity:.42; }
    .slot { display:grid; align-items:center; padding:12px; background:#fffdf8; }
    .slot.filled { background:#e7f4ee; }
    .controls { display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
    button { min-width:120px; padding:10px 14px; background:var(--gold); color:var(--ink); cursor:pointer; }
    #check { background:var(--green); color:white; }
    #feedback { min-height:48px; font-weight:900; color:#35664b; }
    .message { border-left:8px solid var(--pink); padding-left:12px; }
    @media(max-width:820px){ .layout{grid-template-columns:1fr;} }
  </style>
</head>
<body>
  <a class="map-link" href="../index.html">PYP Map</a>
  <main>
    <p><strong>Unit 3 · How We Express Ourselves</strong></p>
    <h1>Story Sequencer</h1>
    <p>Stories have a beginning, middle, and end. Tap cards to build the story in order.</p>
    <section class="layout">
      <div class="panel">
        <h2>Story cards</h2>
        <div class="cards" id="cards"></div>
      </div>
      <div class="panel">
        <h2>My sequence</h2>
        <div class="sequence" id="sequence"></div>
        <p class="message" id="message">Message: Stories can show care, feelings, and choices.</p>
        <p id="feedback">Tap a card to start.</p>
        <div class="controls">
          <button id="check">Check</button>
          <button id="reset">New story</button>
        </div>
      </div>
    </section>
  </main>
  <script>
    const stories = [
      {
        title: "The Lost Lunchbox",
        cards: [
          "Mina cannot find her lunchbox before snack time.",
          "Her friend asks questions and helps her look under the art table.",
          "Mina says thank you and shares how relieved she feels."
        ],
        message: "Friends can listen, help, and show care."
      },
      {
        title: "The Brave Reader",
        cards: [
          "Leo feels nervous about reading to the class.",
          "He takes a breath and reads one page at a time.",
          "The class claps because Leo tried something challenging."
        ],
        message: "Stories can show courage and effort."
      },
      {
        title: "The Puppet Show",
        cards: [
          "A group chooses characters for a puppet show.",
          "They practice voices and decide what happens next.",
          "They perform and ask the audience what they noticed."
        ],
        message: "People tell stories in different ways."
      }
    ];
    let index = 0;
    let chosen = [];
    const cards = document.getElementById("cards");
    const sequence = document.getElementById("sequence");
    const feedback = document.getElementById("feedback");
    const message = document.getElementById("message");
    const shuffle = items => [...items].sort(() => Math.random() - 0.5);

    function render() {
      chosen = [];
      const story = stories[index];
      cards.innerHTML = `<h3>${story.title}</h3>` + shuffle(story.cards).map(card => `<button class="card">${card}</button>`).join("");
      sequence.innerHTML = ["Beginning", "Middle", "End"].map(label => `<div class="slot">${label}</div>`).join("");
      message.textContent = `Message: ${story.message}`;
      feedback.textContent = "Tap a card to start.";
      cards.querySelectorAll(".card").forEach(card => card.addEventListener("click", () => choose(card)));
    }

    function choose(card) {
      if (card.classList.contains("used") || chosen.length >= 3) return;
      chosen.push(card.textContent);
      card.classList.add("used");
      const slot = sequence.children[chosen.length - 1];
      slot.textContent = card.textContent;
      slot.classList.add("filled");
    }

    function check() {
      const correct = stories[index].cards.every((card, i) => chosen[i] === card);
      feedback.textContent = chosen.length < 3 ? "Finish all three parts first." : correct ? "Yes. Your story has a clear order." : "Almost. Think: what happened first, next, and last?";
    }

    document.getElementById("check").addEventListener("click", check);
    document.getElementById("reset").addEventListener("click", () => { index = (index + 1) % stories.length; render(); });
    render();
  </script>
</body>
</html>
