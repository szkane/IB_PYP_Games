<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Hilson's Quest Pad · 学习打卡台</title>
<!-- ============================================================
     Hilson's iPad Quest App
     - Native iPad App layout: Zero vertical page scrolling (100dvh)
     - Bottom Navigation Bar (Tasks, Goals, Rewards, Parent Hub)
     - Isolated Category Tabs at top: Study, Earn Money, Sport, Life
     - Main task content: Horizontal swipe card carousel (1 task = 1 card)
     - Minimalist check-in UI so kids finish fast & focus on real life
     - Standalone single-file HTML5 (zero CDN dependencies)
     - English default with Simplified Chinese switcher
     ============================================================ -->
<style>
:root {
  /* Warm paper background and ink */
  --paper: #fcf9f2;
  --surface: #ffffff;
  --ink: #1e293b;
  --muted: #64748b;
  --line: #1e293b;
  --line-soft: #e2e8f0;

  /* Fresh, Kid-Friendly Primary Accents */
  --blue: #3b82f6;
  --blue-soft: #eff6ff;
  --blue-dark: #1d4ed8;

  --green: #10b981;
  --green-soft: #ecfdf5;
  --green-dark: #047857;

  --yellow: #f59e0b;
  --yellow-soft: #fef3c7;
  --yellow-dark: #b45309;

  --coral: #f97316;
  --coral-soft: #fff7ed;

  --pink: #f43f5e;
  --pink-soft: #fff1f2;

  --teal: #06b6d4;
  --mint: #a7f3d0;

  /* 4 Distinct, Kid-Friendly Category Identities */
  --cat-study: #3b82f6; /* Study 🌟 - Friendly Royal Blue */
  --cat-money: #f59e0b; /* Earn Money 💰 - Golden Amber */
  --cat-sport: #f97316; /* Sport ⚡ - Energy Coral Orange */
  --cat-life:  #f43f5e; /* Life ❤️ - Caring Rose Pink */

  --font: ui-rounded, "Avenir Next", "Nunito", "SF Pro Rounded", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --r-card: 18px;
  --r-btn: 10px;
  --r-pill: 9999px;
  --shadow-block: 3.5px 3.5px 0 var(--ink);
  --shadow-block-sm: 2px 2px 0 var(--ink);
}

*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  overflow: hidden; /* Strict zero vertical scroll on main window */
  position: fixed;
  inset: 0;
}
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(135deg, rgba(59, 130, 246, 0.04), transparent 32%),
    linear-gradient(45deg, transparent 0 48%, rgba(245, 158, 11, 0.05) 48% 52%, transparent 52%),
    var(--paper);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

h1, h2, h3, h4, p { margin: 0; }
button { font-family: inherit; font-size: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
input, select, textarea { font-family: inherit; font-size: 15px; color: var(--ink); }
svg { display: block; flex-shrink: 0; }
.hint { color: var(--muted); font-size: 13px; font-weight: 700; }

/* ---------- Fullscreen App Container ---------- */
#app {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
}

/* ---------- 1. Compact Top Bar (~50px) ---------- */
.topbar {
  flex: none;
  height: 52px;
  background: var(--blue);
  border-bottom: 2px solid var(--ink);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  padding-left: max(16px, env(safe-area-inset-left));
  padding-right: max(16px, env(safe-area-inset-right));
  z-index: 20;
}
.topbar-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-title {
  display: flex;
  align-items: center;
  gap: 12px;
  color: #fff;
}
.brand-title .brand-name {
  font-size: 17px;
  font-weight: 900;
  letter-spacing: -0.2px;
  color: #fff;
}
.brand-title span.badge-date {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 900;
  color: var(--ink);
  background: var(--yellow-soft);
  border: 1.5px solid var(--ink);
  box-shadow: 2px 2px 0 var(--ink);
  padding: 3px 11px;
  border-radius: var(--r-pill);
  line-height: 1.2;
}
.brand-title span.badge-date svg {
  flex-shrink: 0;
  opacity: 0.85;
}
.topbar-right {
  display: flex;
  align-items: center;
  gap: 10px;
}
.lang-switcher {
  display: inline-flex;
  border: 2px solid var(--ink);
  border-radius: var(--r-btn);
  background: rgba(255, 255, 255, 0.2);
  box-shadow: 2px 2px 0 var(--ink);
  padding: 2px;
  gap: 2px;
}
.lang-btn {
  height: 30px;
  padding: 0 10px;
  border-radius: 6px;
  font-size: 12.5px;
  font-weight: 900;
  color: #fff;
}
.lang-btn.active {
  background: var(--surface);
  color: var(--ink);
}
.lock-btn {
  height: 34px;
  padding: 0 12px;
  border: 2px solid var(--ink);
  border-radius: var(--r-btn);
  background: var(--coral);
  color: #fff;
  font-weight: 900;
  font-size: 13px;
  box-shadow: var(--shadow-block-sm);
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.lock-btn:active { transform: translate(1.5px, 1.5px); box-shadow: 1px 1px 0 var(--ink); }

/* ---------- 2. Category Tabs Bar (~48px) ---------- */
.category-bar {
  flex: none;
  height: 48px;
  background: rgba(255, 250, 240, 0.95);
  border-bottom: 2px solid var(--line-soft);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 10px;
  overflow-x: auto;
  scrollbar-width: none;
}
.category-bar::-webkit-scrollbar { display: none; }
.cat-tab {
  flex: none;
  height: 38px;
  padding: 0 16px;
  border: 2px solid var(--line-soft);
  border-radius: var(--r-pill);
  background: var(--surface);
  color: var(--ink);
  font-size: 13.5px;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  box-shadow: 0 1.5px 3px rgba(0, 0, 0, 0.04);
  transition: all 0.12s ease;
}
.cat-tab:hover { border-color: var(--ink); }
.cat-tab:active { transform: translate(1px, 1px); }
.cat-tab.active {
  background: var(--c, var(--blue));
  border-color: var(--ink);
  color: #fff;
  font-weight: 900;
  box-shadow: 2px 2px 0 var(--ink);
  transform: translate(1px, 1px);
}
.cat-tab .cnt-badge {
  background: #f1f5f9;
  color: var(--ink);
  border: 1px solid var(--line-soft);
  font-size: 11px;
  font-weight: 900;
  padding: 1px 6px;
  border-radius: 6px;
}
.cat-tab.active .cnt-badge {
  background: rgba(255, 255, 255, 0.25);
  color: #fff;
  border-color: rgba(255, 255, 255, 0.4);
}

/* ---------- 3. Main Workspace Viewport (Flex: 1, Zero Vertical Scroll in Kid Mode) ---------- */
.app-viewport {
  flex: 1;
  min-height: 0;
  width: 100%;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
}

/* Kid Task Cards Carousel (Horizontal Scroll Snap) */
.cards-carousel {
  flex: 1;
  min-height: 0;
  width: 100%;
  display: flex;
  flex-direction: row;
  align-items: stretch;
  overflow-x: auto;
  overflow-y: hidden;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  padding: 14px 18px;
  gap: 18px;
}
.cards-carousel::-webkit-scrollbar { height: 6px; }
.cards-carousel::-webkit-scrollbar-thumb { background: #d0d7cf; border-radius: 3px; }

/* Single Task Card (Fits 100% of the carousel height) */
.task-hero-card {
  flex: 0 0 calc(50% - 10px);
  min-width: 320px;
  max-width: 580px;
  height: 100%;
  max-height: 100%;
  background: var(--surface);
  border: 2.5px solid var(--ink);
  border-radius: var(--r-card);
  box-shadow: var(--shadow-block);
  scroll-snap-align: start;
  display: flex;
  flex-direction: column;
  padding: 16px 18px;
  position: relative;
  overflow: hidden;
}
@media (max-width: 768px) {
  .task-hero-card { flex: 0 0 calc(100% - 4px); min-width: 280px; }
}
/* If only 1 card in current category, expand nicely */
.cards-carousel.single-card .task-hero-card {
  flex: 0 0 min(680px, calc(100% - 10px));
  margin: 0 auto;
}

.task-hero-card::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 6px;
  background: var(--c, var(--green));
}
.task-hero-card.done {
  background: #f7fdfa;
  border-color: var(--green);
}

/* Card Header */
.th-header {
  flex: none;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--line-soft);
  padding-left: 6px;
}
.th-title {
  font-size: 19px;
  font-weight: 900;
  line-height: 1.3;
}
.th-badges {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 26px;
  padding: 0 8px;
  border: 1.5px solid var(--ink);
  border-radius: 6px;
  font-size: 12px;
  font-weight: 900;
  box-shadow: 1.5px 1.5px 0 var(--ink);
  white-space: nowrap;
}

/* Card Middle: Step Items List (Paced and legible, fits remaining height) */
.th-steps-list {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-evenly;
  gap: 8px;
  padding: 8px 0;
}
.step-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
  border: 1.5px solid var(--line-soft);
  border-radius: var(--r-btn);
  background: #ffffff;
  box-shadow: 0 1.5px 3px rgba(0, 0, 0, 0.03);
  transition: all 0.12s ease;
}
.step-item.cur {
  background: #ffffff;
  border: 2px solid var(--c, var(--blue));
  box-shadow: 3px 3px 0 var(--ink);
  transform: scale(1.005);
}
.step-item.done {
  background: #f0fdf4;
  border: 1.5px solid #bbf7d0;
  box-shadow: none;
}
.step-idx {
  width: 28px;
  height: 28px;
  border: 1.5px solid var(--line-soft);
  border-radius: 8px;
  background: #f8fafc;
  color: #64748b;
  font-size: 13px;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
}
.step-item.done .step-idx { background: var(--green); color: #fff; border-color: var(--green-dark); }
.step-item.cur .step-idx { background: var(--c, var(--blue)); color: #fff; border-color: var(--ink); box-shadow: 1px 1px 0 var(--ink); }

.step-info { flex: 1; min-width: 0; }
.step-name { font-weight: 900; font-size: 15px; }
.step-meta { font-size: 12px; color: var(--muted); font-weight: 800; margin-top: 2px; }
.step-act { flex: none; display: flex; align-items: center; gap: 6px; }

/* Card Footer */
.th-footer {
  flex: none;
  padding-top: 10px;
  border-top: 2px solid var(--line-soft);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* Completed celebration hero inside card */
.card-completed-banner {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 10px;
  padding: 16px;
  background: var(--green-soft);
  border: 2px solid var(--green);
  border-radius: var(--r-btn);
}
.card-completed-banner b { font-size: 20px; font-weight: 900; color: var(--green-dark); }
.card-completed-banner p { font-size: 14px; color: var(--ink); font-weight: 700; max-width: 320px; }

/* Empty state */
.card-empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 30px;
  color: var(--muted);
}

/* ---------- 4. Scrollable Panels for Goals, Rewards, Parent Hub ---------- */
.scrollable-view {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px 20px 40px;
  max-width: 1080px;
  margin: 0 auto;
  width: 100%;
}
.card {
  background: var(--surface);
  border: 2px solid var(--ink);
  border-radius: var(--r-card);
  padding: 18px;
  box-shadow: var(--shadow-block);
  margin-bottom: 16px;
}
.card-h {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.card-h h2 { font-size: 18px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.stat {
  background: var(--paper);
  border: 2px solid var(--ink);
  border-radius: var(--r-btn);
  box-shadow: var(--shadow-block-sm);
  padding: 10px 12px;
}
.stat b { font-size: 20px; font-weight: 900; line-height: 1.2; }
.stat span { font-size: 12px; color: var(--muted); font-weight: 800; display: block; margin-top: 2px; }
.bar {
  height: 14px;
  border: 2px solid var(--ink);
  border-radius: var(--r-pill);
  background: #f1f3ed;
  overflow: hidden;
  margin: 8px 0;
}
.bar > i {
  display: block;
  height: 100%;
  border-radius: var(--r-pill);
  background: linear-gradient(90deg, var(--teal) 0%, var(--green) 50%, var(--yellow) 100%);
  transition: width 0.4s ease;
}

/* Rows */
.rows { display: flex; flex-direction: column; gap: 10px; }
.row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border: 2px solid var(--ink);
  border-radius: var(--r-btn);
  background: var(--surface);
  box-shadow: var(--shadow-block-sm);
}
.row-main { flex: 1; min-width: 0; }
.row-title { font-weight: 900; font-size: 15.5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row-sub { font-size: 12.5px; color: var(--muted); font-weight: 700; margin-top: 2px; }
.row-acts { display: flex; gap: 8px; flex: none; }

/* Redeem Grid */
.seg {
  display: flex;
  gap: 6px;
  background: var(--paper);
  border: 2px solid var(--ink);
  border-radius: var(--r-btn);
  padding: 3px;
  margin-bottom: 14px;
}
.seg button {
  flex: 1;
  min-height: 38px;
  border-radius: 6px;
  font-weight: 900;
  font-size: 14px;
  color: var(--muted);
  border: 1.5px solid transparent;
  background: transparent;
  cursor: pointer;
  transition: all 0.12s ease;
}
.seg button:hover:not(.on):not(.active) {
  color: var(--ink);
  background: rgba(0, 0, 0, 0.05);
}
.seg button.on,
.seg button.active {
  background: var(--green);
  color: #fff;
  border: 1.5px solid var(--ink);
  box-shadow: 2px 2px 0 var(--ink);
}
.redeem-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 14px;
}
.ri {
  border: 2px solid var(--ink);
  border-radius: var(--r-card);
  padding: 14px;
  background: var(--surface);
  box-shadow: var(--shadow-block-sm);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.ri-name { font-size: 16px; font-weight: 900; }
.ri-cost { font-size: 13px; color: var(--muted); font-weight: 800; }
.ri-cost b { font-size: 19px; color: var(--ink); }
.ri-foot { margin-top: auto; padding-top: 6px; }

/* ---------- 5. Bottom Navigation Bar (~56px + safe-area) ---------- */
.bottom-bar {
  flex: none;
  background: var(--surface);
  border-top: 2px solid var(--ink);
  box-shadow: 0 -3px 0 rgba(23, 33, 31, 0.08);
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding-bottom: env(safe-area-inset-bottom);
  height: calc(56px + env(safe-area-inset-bottom));
  z-index: 30;
}
.bottom-tab-btn {
  flex: 1;
  height: 52px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  color: var(--muted);
  font-size: 11.5px;
  font-weight: 900;
  position: relative;
  transition: all 0.12s ease;
}
.bottom-tab-btn:active { transform: scale(0.96); }
.bottom-tab-btn.active {
  color: var(--green);
}
.bottom-tab-btn.active svg {
  transform: scale(1.1);
  fill: var(--green);
}
.bottom-tab-btn .badge {
  position: absolute;
  top: 4px;
  right: calc(50% - 22px);
  min-width: 18px;
  height: 18px;
  border-radius: 9px;
  background: var(--coral);
  color: #fff;
  border: 1px solid var(--ink);
  font-size: 10.5px;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
}

/* ---------- Common UI Buttons & Badges ---------- */
.btn {
  min-height: 42px;
  padding: 0 16px;
  border: 2px solid var(--ink);
  border-radius: var(--r-btn);
  background: var(--green);
  color: #fff;
  font-weight: 900;
  font-size: 14.5px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  box-shadow: var(--shadow-block-sm);
  transition: transform 0.1s ease, box-shadow 0.1s ease;
  white-space: nowrap;
}
.btn:active { transform: translate(1.5px, 1.5px); box-shadow: 1px 1px 0 var(--ink); }
.btn.ghost { background: var(--green-soft); color: var(--green-dark); }
.btn.soft { background: var(--paper); color: var(--ink); }
.btn.yellow { background: var(--yellow); color: var(--ink); }
.btn.coral { background: var(--coral); color: #fff; }
.btn.blue { background: var(--blue); color: #fff; }
.btn.line { background: var(--surface); color: var(--ink); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 13.5px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: 0.45; pointer-events: none; }
.icon-btn {
  width: 40px;
  height: 40px;
  border: 2px solid var(--ink);
  border-radius: var(--r-btn);
  background: var(--surface);
  box-shadow: var(--shadow-block-sm);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
}
.icon-btn:active { transform: translate(1.5px, 1.5px); box-shadow: 1px 1px 0 var(--ink); }
.icon-btn.danger { background: var(--coral-soft); color: var(--coral); }

/* ---------- Modals ---------- */
.modal-layer[hidden] { display: none; }
.modal-mask {
  position: fixed;
  inset: 0;
  background: rgba(23, 33, 31, 0.65);
  backdrop-filter: blur(6px);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  overflow-y: auto;
}
.modal {
  background: var(--surface);
  border: 3px solid var(--ink);
  border-radius: var(--r-card);
  width: 100%;
  max-width: 540px;
  max-height: 86vh;
  display: flex;
  flex-direction: column;
  box-shadow: 6px 6px 0 var(--ink);
  animation: modalPop 0.16s ease-out;
}
@keyframes modalPop {
  from { opacity: 0; transform: scale(0.96); }
  to { opacity: 1; transform: scale(1); }
}
.modal-h {
  padding: 14px 18px;
  border-bottom: 2px solid var(--ink);
  background: var(--paper);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-h h3 { font-size: 18px; font-weight: 900; }
.modal-b { padding: 18px; overflow-y: auto; }
.modal-f {
  padding: 12px 18px;
  border-top: 2px solid var(--ink);
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  background: var(--paper);
}
.field { margin-bottom: 14px; }
.field > label { display: block; font-size: 13.5px; font-weight: 900; margin-bottom: 5px; }
.input, select.input, textarea.input {
  width: 100%;
  min-height: 44px;
  border: 2px solid var(--ink);
  border-radius: var(--r-btn);
  padding: 8px 12px;
  background: var(--paper);
  outline: none;
  font-weight: 800;
}
.input:focus { background: #fff; border-color: var(--green); }
textarea.input { min-height: 72px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Parent Subnav */
.parent-subnav {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 4px;
}
.parent-subnav::-webkit-scrollbar { display: none; }
.subnav-btn {
  flex: none;

  display: flex;

  border-radius: var(--r-btn);
  padding: 6px 10px;

  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
}
.step-edit-row input.t { flex: 1; min-width: 0; }
.step-edit-row input.m { width: 68px; flex: none; text-align: center; }

/* Weekday Picker pills in Modal */
.day-pick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.day-btn {
  width: 42px;
  height: 38px;
  border: 2px solid var(--ink);
  border-radius: var(--r-btn);
  background: var(--paper);
  font-size: 13px;
  font-weight: 900;
  box-shadow: 2px 2px 0 var(--ink);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.day-btn.on {
  background: var(--green);
  color: #fff;
  transform: translate(1px, 1px);
  box-shadow: 1px 1px 0 var(--ink);
}

/* Category Picker in Modal */

  display: grid;
  grid-template-columns: repeat(2, 1fr);

  margin-top: 6px;
  margin-bottom: 6px;
}
.cat-pick-card {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 10px 12px;
  border: 2px solid var(--ink);
  border-radius: var(--r-btn);
  background: var(--surface);
  box-shadow: var(--shadow-block-sm);
  cursor: pointer;
  text-align: left;
  transition: all 0.12s ease;
}
.cat-pick-card:hover:not(.active) {
  background: var(--paper);
}
.cat-pick-card.active {
  background: var(--cat-c, var(--green));
  color: #fff;
  transform: translate(1.5px, 1.5px);
  box-shadow: 1px 1px 0 var(--ink);
}
.cat-pick-card.active .cat-pick-dot {
  background: #fff !important;

.cat-pick-card.active .cat-pick-bal {
  color: rgba(255, 255, 255, 0.95);
}
.cat-pick-top {
  display: flex;
  align-items: center;
  gap: 8px;
}
.cat-pick-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;

}
.cat-pick-title {
  font-size: 14px;
  font-weight: 900;
  line-height: 1.2;
}
.cat-pick-bal {

  color: var(--muted);

}

.cat-iso-notice {
  display: flex;

  font-size: 12.5px;
  font-weight: 750;
  line-height: 1.4;
  color: var(--ink);
  margin-bottom: 12px;
}

  flex-shrink: 0;
  margin-top: 2px;
}

/* Common small icon button */
.icon-btn {
  width: 34px;
  height: 34px;
  border: 1.5px solid var(--ink);
  border-radius: 8px;
  background: var(--surface);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 1.5px 1.5px 0 var(--ink);
  cursor: pointer;
}
.icon-btn:active { transform: translate(1px, 1px); box-shadow: none; }
.icon-btn.danger { background: var(--coral-soft); color: var(--coral); border-color: var(--coral); }
.icon-btn.soft { background: var(--paper); }

.step-pills-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}
.step-pill-preview {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--paper);
  border: 1px solid var(--ink);

  padding: 3px 8px;
  font-size: 12px;
  font-weight: 800;
}
.step-pill-preview .s-num {
  background: var(--ink);
  color: #fff;
  border-radius: 3px;
  padding: 0 4px;
  font-size: 10px;
}

/* PIN Pad */
.pin-pad {
  display: grid;
  grid-template-columns: repeat(3, 68px);
  gap: 10px;
  justify-content: center;
  margin: 14px auto;
}
.pin-key {
  height: 52px;
  border: 2px solid var(--ink);
  border-radius: var(--r-btn);
  background: var(--paper);
  box-shadow: 2.5px 2.5px 0 var(--ink);
  font-size: 21px;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
}
.pin-key:active { transform: translate(1.5px, 1.5px); box-shadow: 1px 1px 0 var(--ink); }
.pin-key.action { font-size: 14px; color: var(--muted); }

/* ---------- Toast Notification ---------- */
.toast-layer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(68px + env(safe-area-inset-bottom));
  display: flex;
  justify-content: center;
  pointer-events: none;
  z-index: 300;
  opacity: 0;
  transform: translateY(8px);
  transition: all 0.2s ease;
}
.toast-layer.on { opacity: 1; transform: translateY(0); }
.toast {
  background: var(--ink);
  color: #fff;
  border: 2px solid #fff;
  padding: 10px 20px;
  border-radius: var(--r-pill);
  font-size: 14.5px;
  font-weight: 900;
  box-shadow: 0 6px 20px rgba(0,0,0,0.25);
  display: flex;
  align-items: center;
  gap: 8px;
}
.toast.good { background: var(--green); }
.toast.bad { background: var(--coral); }

/* Celebration Overlay & Confetti Canvas */
.confetti-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 500;
}
.celebration-layer {
  position: fixed;
  inset: 0;
  z-index: 450;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.45);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  animation: celebFadeIn 0.25s ease-out;
}
.celebration-layer[hidden] {
  display: none !important;
}
@keyframes celebFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
.celebration-card {
  background: var(--paper);
  border: 3px solid var(--ink);
  border-radius: 28px;
  box-shadow: 0 16px 40px rgba(0,0,0,0.3), 6px 6px 0 var(--ink);
  padding: 32px 28px 24px;
  text-align: center;
  max-width: 440px;
  width: 90%;
  animation: celebPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  position: relative;
}
@keyframes celebPop {
  0% { transform: scale(0.6); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
.celebration-emoji {
  font-size: 64px;
  line-height: 1;
  margin-bottom: 12px;
  display: inline-block;
  animation: celebBounce 1s infinite alternate ease-in-out;
}
@keyframes celebBounce {
  from { transform: translateY(0) scale(1); }
  to { transform: translateY(-8px) scale(1.1); }
}
.celebration-title {
  font-size: 26px;
  font-weight: 900;
  color: var(--ink);
  margin-bottom: 8px;
  letter-spacing: -0.02em;
}

  font-size: 16px;
  font-weight: 800;
  color: var(--blue);
  margin-bottom: 16px;
  line-height: 1.4;
}
.celebration-reward-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;

  font-weight: 900;
  border: 2px solid var(--ink);
  border-radius: var(--r-pill);
  padding: 6px 18px;
  box-shadow: 2px 2px 0 var(--ink);
  margin-bottom: 20px;
}
.celebration-btn {
  width: 100%;

  font-size: 16px;

  box-shadow: 2px 2px 0 var(--ink);

}

  transform: translate(1px, 1px);

  box-shadow: 1.5px 1.5px 0 var(--ink);

  border-color: var(--ink);

function t(key, params) {
  var lang = state.lang || 'en';
  var dict = I18N[lang] || I18N.en;
  var str = dict[key] !== undefined ? dict[key] : (I18N.en[key] !== undefined ? I18N.en[key] : key);
  if (typeof str !== 'string') return str;
  if (params) {
    Object.keys(params).forEach(function(k){
      str = str.replace(new RegExp('\\{' + k + '\\}', 'g'), params[k]);
    });
  }
  return str;
}

   4. Utility Functions
   ========================================================= */
function uid(p){ return (p||'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function pad2(n){ return n<10 ? '0'+n : ''+n; }
function dateKey(d){
  if (typeof d === 'string') return d;
  d = d ? new Date(d) : new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}
function monthKey(d){
  if (typeof d === 'string') return d.slice(0,7);
  d = d ? new Date(d) : new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth()+1);
}
function parseKey(k){
  var p = String(k).split('-').map(Number);
  return new Date(p[0], p[1]-1, p[2] || 1);
}
function addDays(k, n){
  var d = parseKey(k); d.setDate(d.getDate()+n); return dateKey(d);
}
function monthDays(mk){
  var p = mk.split('-').map(Number);
  return new Date(p[0], p[1], 0).getDate();
}
function fmtDate(k){
  var d = parseKey(k);
  if (state.lang === 'zh') return (d.getMonth()+1) + '月' + d.getDate() + '日';
  var monthsEn = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return monthsEn[d.getMonth()] + ' ' + d.getDate();
}
function fmtHeaderDate(k){
  var d = parseKey(k);
  var dw = d.getDay();
  if (state.lang === 'zh') {
    var dwZh = ['周日','周一','周二','周三','周四','周五','周六'][dw];
    return dwZh + ' · ' + (d.getMonth()+1) + '月' + d.getDate() + '日';
  }
  var dwEn = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dw];
  var monthsEn = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return dwEn + ' · ' + monthsEn[d.getMonth()] + ' ' + d.getDate();
}
function fmtMonth(mk){
  var p = mk.split('-').map(Number);
  if (state.lang === 'zh') return p[0] + '年' + p[1] + '月';
  var monthsEn = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return monthsEn[p[1]-1] + ' ' + p[0];
}
function fmtDur(sec){
  if (sec === null || sec === undefined || sec === '') return '—';
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec/60), s = sec % 60;
  return pad2(m) + ':' + pad2(s);
}
function esc(s){
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function(c){
    return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c];
  });
}
function clamp(n, a, b){ n = Number(n); if (isNaN(n)) n = a; return Math.max(a, Math.min(b, n)); }

function loadDB(){

    obj.checkins = obj.checkins || {};

    obj.redeems = obj.redeems || { daily:[], weekly:[], monthly:[] };
    obj.categories.forEach(function(c){
      var def = null;
      for (var j=0; j<CAT_DEFS.length; j++) if (CAT_DEFS[j].id === c.id) def = CAT_DEFS[j];

        c.pointName = def.pointName;

        c.emoji = def.emoji;
        c.color = def.color;
      }
    });

  }catch(e){ return null; }

function tasksOfDate(date){
  var mk = monthKey(date);
  var dow = parseKey(date).getDay();
  return db.tasks.filter(function(t){
    if (t.active === false) return false;
    if (t.month !== mk) return false;
    var wd = (t.weekdays && t.weekdays.length) ? t.weekdays : [0,1,2,3,4,5,6];
    return wd.indexOf(dow) >= 0;
  });
}
function tasksOfCategory(catId, date){
  return tasksOfDate(date).filter(function(t){ return t.categoryId === catId; });
}
function doneStepCount(date, task, customDb){
  var database = customDb || db;
  if (!database || !database.checkins) return 0;
  var r = (database.checkins[date] || {})[task.id];
  if (!r || !r.steps) return 0;
  var n = 0;
  task.steps.forEach(function(s){ if (r.steps[s.id]) n++; });
  return n;
}
function isTaskComplete(date, task, customDb){
  if (!task.steps || !task.steps.length) return false;
  return doneStepCount(date, task, customDb) >= task.steps.length;
}
function firstOpenIdx(date, task){
  var r = (db.checkins[date] || {})[task.id];
  for (var i=0; i<task.steps.length; i++){
    if (!r || !r.steps || !r.steps[task.steps[i].id]) return i;
  }
  return -1;
}
function stepPoints(task){
  var arr = [];
  var n = task.steps ? task.steps.length : 0;
  if (!n) return arr;
  var pts = Math.max(0, Math.round(Number(task.points) || 0));
  var base = Math.floor(pts / n), rest = pts - base*n;
  for (var i=0; i<n; i++){ arr.push(i === n-1 ? base + rest : base); }
  return arr;
}
function taskTimer(date, taskId){
  if (!db.timer) return null;
  return (db.timer.date === date && db.timer.taskId === taskId) ? db.timer : null;
}
function catBalance(catId){
  return db.ledger.reduce(function(s, e){ return e.catId === catId ? s + e.delta : s; }, 0);
}
function catEarnOn(catId, date){
  return db.ledger.reduce(function(s, e){
    return (e.catId === catId && e.date === date && e.delta > 0) ? s + e.delta : s;
  }, 0);
}

function syncPointsIn(d, date, task){
  var rec = (d.checkins[date] || {})[task.id] || null;
  var pts = stepPoints(task);
  var mode = (d.settings && d.settings.stepMode) || 'perStep';
  var wanted = {};
  var isDone = isTaskComplete(date, task, d);

  if (mode === 'onComplete'){
    if (isDone){
      wanted[date + '|' + task.id + '|all'] = { delta: Number(task.points) || 0, reason: task.title + ' (' + t('completed_badge') + ')' };
    }
  } else {
    task.steps.forEach(function(s, i){
      if (rec && rec.steps && rec.steps[s.id]) {
        wanted[date + '|' + task.id + '|' + s.id] = { delta: pts[i], reason: task.title + ' · ' + s.title };
      }
    });
  }

  d.ledger = d.ledger.filter(function(e){
    if (e.kind !== 'earn') return true;
    if (e.taskId !== task.id || e.date !== date) return true;
    return !!wanted[e.id];
  });
  Object.keys(wanted).forEach(function(id){
    var w = wanted[id];
    var ex = null;
    for (var i=0; i<d.ledger.length; i++) if (d.ledger[i].id === id){ ex = d.ledger[i]; break; }
    if (ex){ ex.delta = w.delta; ex.reason = w.reason; ex.catId = task.categoryId; }
    else d.ledger.push({ id:id, ts:Date.now(), date:date, catId:task.categoryId, delta:w.delta, reason:w.reason, taskId:task.id, kind:'earn' });
  });
}
function syncPoints(date, task){ syncPointsIn(db, date, task); }

var audioCtx = null;
function getAudioCtx(){
  if (!audioCtx){
    var AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === 'suspended'){
    audioCtx.resume();
  }
  return audioCtx;
}

// Mario-like Coin / Unlock Chime on Step Done
function playSoundStepDone(){
  try {
    var ctx = getAudioCtx();
    if (!ctx) return;
    var now = ctx.currentTime;

    var o1 = ctx.createOscillator();
    var g1 = ctx.createGain();
    o1.type = 'sine';
    o1.frequency.setValueAtTime(987.77, now); // B5
    g1.gain.setValueAtTime(0.24, now);
    g1.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
    o1.connect(g1); g1.connect(ctx.destination);
    o1.start(now); o1.stop(now + 0.1);

    var o2 = ctx.createOscillator();
    var g2 = ctx.createGain();
    o2.type = 'sine';
    o2.frequency.setValueAtTime(1318.51, now + 0.08); // E6
    g2.gain.setValueAtTime(0.3, now + 0.08);
    g2.gain.exponentialRampToValueAtTime(0.0001, now + 0.42);
    o2.connect(g2); g2.connect(ctx.destination);
    o2.start(now + 0.08); o2.stop(now + 0.42);
  } catch(e){}
}

// Mario-like Level Clear / Power-up Fanfare on Quest Accomplished
function playSoundQuestAccomplished(){
  try {
    var ctx = getAudioCtx();
    if (!ctx) return;
    var now = ctx.currentTime;
    var notes = [
      { f: 392.00, t: 0, d: 0.10 },     // G4
      { f: 523.25, t: 0.10, d: 0.10 },  // C5
      { f: 659.25, t: 0.20, d: 0.10 },  // E5
      { f: 783.99, t: 0.30, d: 0.12 },  // G5
      { f: 1046.50, t: 0.42, d: 0.15 }, // C6
      { f: 1318.51, t: 0.57, d: 0.45 }  // E6 triumphant hold
    ];
    notes.forEach(function(n){
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(n.f, now + n.t);
      gain.gain.setValueAtTime(0.25, now + n.t);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + n.t + n.d);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now + n.t); osc.stop(now + n.t + n.d);
    });
  } catch(e){}
}

function getRandomEncouragement(){

  return list[Math.floor(Math.random() * list.length)];
}

var confettiAnimId = null;
function runConfetti(canvas, durationMs){
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  if (!ctx) return;

  if (confettiAnimId) {
    cancelAnimationFrame(confettiAnimId);
    confettiAnimId = null;
  }

  var w = canvas.width = window.innerWidth;
  var h = canvas.height = window.innerHeight;

  var colors = ['#f2b84b', '#4a7cdd', '#2f6f62', '#e36b5a', '#a855f7', '#ec4899', '#06b6d4', '#10b981'];
  var count = 75;
  var particles = [];

  for (var i = 0; i < count; i++){
    var angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
    var speed = 5 + Math.random() * 9;
    particles.push({
      x: w / 2 + (Math.random() - 0.5) * 80,
      y: h / 2 - 40 + (Math.random() - 0.5) * 60,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 6 - Math.random() * 4,
      size: 7 + Math.random() * 8,
      color: colors[Math.floor(Math.random() * colors.length)],
      rotation: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 12,
      gravity: 0.28 + Math.random() * 0.12,
      alpha: 1
    });
  }

  var startTs = Date.now();
  durationMs = durationMs || 2800;

  function render(){
    var elapsed = Date.now() - startTs;
    if (elapsed > durationMs){
      ctx.clearRect(0, 0, w, h);
      confettiAnimId = null;
      return;
    }

    ctx.clearRect(0, 0, w, h);
    var fade = elapsed > durationMs - 700 ? (durationMs - elapsed) / 700 : 1;

    for (var i = 0; i < particles.length; i++){
      var p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.gravity;
      p.vx *= 0.98;
      p.rotation += p.rotSpeed;

      ctx.save();
      ctx.globalAlpha = Math.max(0, p.alpha * fade);
      ctx.translate(p.x, p.y);
      ctx.rotate((p.rotation * Math.PI) / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      ctx.restore();
    }

    confettiAnimId = requestAnimationFrame(render);
  }

  confettiAnimId = requestAnimationFrame(render);
}

var celebTimeout = null;
function closeCelebration(){
  var lay = document.getElementById('celebrationLayer');
  if (confettiAnimId) { cancelAnimationFrame(confettiAnimId); confettiAnimId = null; }
  if (celebTimeout) { clearTimeout(celebTimeout); celebTimeout = null; }
  if (lay){
    lay.hidden = true;
    lay.style.display = 'none';
    lay.innerHTML = '';
  }
}

function celebrateQuestAccomplished(task){
  var lay = document.getElementById('celebrationLayer');
  if (!lay) return;

  var phrase = getRandomEncouragement();
  var emoji = catPointEmoji(task.categoryId);
  var pts = Number(task.points) || 10;
  var title = (state.lang === 'zh') ? '任务达成！' : 'Quest Accomplished!';
  var btnText = (state.lang === 'zh') ? '太棒啦！' : 'Awesome!';

  lay.innerHTML = '<canvas class="confetti-canvas"></canvas>' +
    '<div class="celebration-card" onclick="event.stopPropagation()">' +
    '<div class="celebration-emoji">' + emoji + '</div>' +
    '<h2 class="celebration-title">' + title + '</h2>' +
    '<div class="celebration-phrase">' + phrase + '</div>' +
    '<div class="celebration-reward-pill">+' + pts + ' ' + emoji + '</div>' +
    '<button class="celebration-btn" data-act="closeCelebration">' + btnText + '</button>' +
  '</div>';

  lay.hidden = false;
  lay.style.display = 'flex';
  var cvs = lay.querySelector('canvas');
  if (cvs) runConfetti(cvs, 3000);

  }, 4000);
}

/* =========================================================
   8. Action Handlers
   ========================================================= */
function startTimer(date, taskId, stepId){
  db.timer = { date:date, taskId:taskId, stepId:stepId, startTs:Date.now() };
  saveDB(); refreshAll();
  toast(state.lang==='zh'?'专注计时开始！':'Timer started. Focus and do your best!', 'good');
}
function cancelTimer(){
  db.timer = null; saveDB(); refreshAll(); toast(state.lang==='zh'?'已取消计时':'Timer cancelled.');
}
function finishStep(date, taskId, stepId){
  var task = null;
  for (var i=0; i<db.tasks.length; i++) if (db.tasks[i].id === taskId) task = db.tasks[i];
  if (!task) return;
  if (!db.checkins[date]) db.checkins[date] = {};
  if (!db.checkins[date][taskId]) db.checkins[date][taskId] = { steps:{}, used:{}, note:'' };
  var r = db.checkins[date][taskId];
  r.steps[stepId] = true;
  var tm = (db.timer && db.timer.taskId === taskId && db.timer.stepId === stepId) ? db.timer : taskTimer(date, taskId);
  if (tm && tm.stepId === stepId){
    r.used[stepId] = Math.max(1, Math.round((Date.now() - tm.startTs)/1000));
    db.timer = null;
  }
  syncPoints(date, task);
  saveDB(); refreshAll();
  var complete = isTaskComplete(date, task);
  if (complete){
    playSoundQuestAccomplished();
    celebrateQuestAccomplished(task);
  } else {
    playSoundStepDone();
    toast(state.lang==='zh'?'完成一步，继续加油！':'Step complete! Keep going!', 'good');
  }
}
function undoStep(date, taskId, stepId){
  var task = null;
  for (var i=0; i<db.tasks.length; i++) if (db.tasks[i].id === taskId) task = db.tasks[i];
  if (!task) return;
  var r = (db.checkins[date] || {})[taskId];
  if (!r || !r.steps[stepId]) return;
  delete r.steps[stepId];
  if (r.used) delete r.used[stepId];
  syncPoints(date, task);
  saveDB(); refreshAll();
  toast(state.lang==='zh'?'已撤销这一步':'Step undone.');
}

function applyRedeem(id){
  var today = dateKey();
  var item = null;
  ['daily','weekly','monthly'].forEach(function(k){
    (db.redeems[k]||[]).forEach(function(r){ if (r.id === id) item = r; });
  });
  if (!item) return;
  var bal = catBalance(item.catId);
  if (bal < item.cost){
    toast(t('not_enough_stars'), 'bad');
    return;
  }
  db.redemptions.push({
    id: uid('rp'), ts: Date.now(), tier: item.tier, itemId: item.id, name: item.name,
    cost: item.cost, catId: item.catId, status: 'pending', appliedDate: today
  });
  saveDB(); refreshAll();
  toast(state.lang==='zh'?'心愿申请已提交！':'Reward requested!', 'good');
}
function approveRedeem(id){
  var r = null;
  for (var i=0; i<db.redemptions.length; i++) if (db.redemptions[i].id === id) r = db.redemptions[i];
  if (!r || r.status !== 'pending') return;
  r.status = 'approved'; r.decidedAt = Date.now();
  db.ledger.push({
    id: 'spend|' + r.id, ts: Date.now(), date: dateKey(), catId: r.catId,
    delta: -r.cost, reason: 'Reward: ' + r.name, kind: 'spend', redemptionId: r.id
  });
  saveDB(); refreshAll();
  toast(state.lang==='zh'?'已批准并扣分':'Approved & points deducted', 'good');
}
function rejectRedeem(id){
  var r = null;
  for (var i=0; i<db.redemptions.length; i++) if (db.redemptions[i].id === id) r = db.redemptions[i];
  if (!r || r.status !== 'pending') return;
  r.status = 'rejected'; r.decidedAt = Date.now();
  saveDB(); refreshAll();
  toast(state.lang==='zh'?'已驳回':'Declined');
}

function switchLang(lang){
  if (lang === state.lang) return;
  state.lang = lang;
  localStorage.setItem(LS_LANG_KEY, lang);
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  refreshAll();
}

/* ---------- 1 Task = 1 Full Screen-Height Card (Horizontal Scroll) ---------- */
function renderTaskCard(task, date){
  var color = catColor(task.categoryId);
  var total = task.steps.length;
  var done = doneStepCount(date, task);
  var complete = isTaskComplete(date, task);
  var curIdx = firstOpenIdx(date, task);
  var tm = taskTimer(date, task.id);
  var rec = (db.checkins[date] || {})[task.id] || { steps:{}, used:{} };
  var pts = stepPoints(task);

  var h = '<article class="task-hero-card ' + (complete ? 'done' : '') + '" style="--c:' + esc(color) + '">';

  // Top header
  h += '<div class="th-header">' +
    '<div><div class="th-title">' + esc(task.title) + '</div>' +
    '<div class="hint" style="margin-top:2px">' + t('completed_steps_info', { done: done, total: total }) + '</div></div>' +
    '<div class="th-badges">' +
      '<span class="tag" style="background:' + esc(color) + ';color:#fff">' + esc(catName(task.categoryId)) + '</span>' +
      '<span class="tag pts-badge">+' + (Number(task.points)||0) + ' ' + catPointName(task.categoryId, Number(task.points)||0) + '</span>' +
      (complete ? '<span class="tag" style="background:var(--green-soft);color:var(--green-dark);border-color:var(--green)">' + t('completed_badge') + '</span>' : '') +
    '</div></div>';

  // Middle: If all done, show clean celebratory praise; otherwise show the step items!
  if (complete){
    var cEmoji = catPointEmoji(task.categoryId);
    var pPhrase = (state.lang === 'zh')
      ? '太棒啦！任务圆满达成，自主探究闪闪发光！✨'
      : 'Awesome work! Great inquiry and agency! Keep shining! 🌟';
    h += '<div class="card-completed-banner">' +
      '<div style="font-size:42px;line-height:1;margin-bottom:2px">' + cEmoji + '</div>' +
      '<b>' + t('all_done_title') + '</b>' +
      '<p style="margin:4px 0 10px;font-size:14px;color:var(--green-dark);font-weight:800">' + pPhrase + '</p>' +
      '<button class="btn sm line" data-act="undoStep" data-date="' + date + '" data-id="' + task.id + '" data-step="' + task.steps[total-1].id + '">' +
      t('btn_undo_last') + '</button>' +
      '</div>';
  } else {
    h += '<div class="th-steps-list">';
    task.steps.forEach(function(s, i){
      var ok = rec.steps && rec.steps[s.id];
      var isCur = (!ok && i === curIdx);
      var isTiming = (tm && tm.stepId === s.id);

      h += '<div class="step-item ' + (ok ? 'done' : (isCur ? 'cur' : '')) + '">';
      h += '<div class="step-idx">' + (ok ? icon('check', 14, '#fff') : (i+1)) + '</div>';
      h += '<div class="step-info">';
      h += '<div class="step-name">' + esc(s.title) + '</div>';
      h += '<div class="step-meta">' + t('time_target', { min: s.minutes||5 }) + ' · +' + (pts[i]||0) + ' ' + catPointName(task.categoryId, pts[i]||0) + '</div>';
      h += '</div>';

      h += '<div class="step-act">';
      if (ok){
        h += '<button class="btn sm line" data-act="undoStep" data-date="' + date + '" data-id="' + task.id + '" data-step="' + s.id + '">' + t('btn_undo_step') + '</button>';
      } else if (isTiming){
        h += '<span class="clock" data-timer-live data-start="' + tm.startTs + '" style="font-size:14px;padding:3px 7px">00:00</span>' +
             '<button class="btn sm green" data-act="finishStep" data-date="' + date + '" data-id="' + task.id + '" data-step="' + s.id + '">' + t('btn_done') + '</button>' +
             '<button class="btn sm line" data-act="cancelTimer">' + t('btn_cancel') + '</button>';
      } else if (isCur){
        h += '<button class="btn sm soft" data-act="startTimer" data-date="' + date + '" data-id="' + task.id + '" data-step="' + s.id + '">' + icon('play', 12, 'var(--ink)') + t('btn_start') + '</button>' +
             '<button class="btn sm green" data-act="finishStep" data-date="' + date + '" data-id="' + task.id + '" data-step="' + s.id + '">' + t('btn_done') + '</button>';
      } else {
        h += '<span class="hint" style="opacity:0.5">' + (i+1) + '</span>';
      }
      h += '</div></div>';
    });
    h += '</div>';
  }

  // Footer: current category points status
  var ear = catEarnOn(task.categoryId, date);
  var ptUnit = catPointName(task.categoryId, ear);
  var balUnit = catPointName(task.categoryId, catBalance(task.categoryId));
  h += '<div class="th-footer">' +
    '<span class="hint">' + (state.lang==='zh'?'今日已获得: ':'Earned today: ') + '+' + ear + ' ' + ptUnit + '</span>' +
    '<span class="hint" style="color:var(--ink);font-weight:900">' + catName(task.categoryId) + ': ' + catBalance(task.categoryId) + ' ' + balUnit + '</span>' +
    '</div>';

  h += '</article>';
  return h;
}

function renderGoalsViewport(){
  var mk = monthKey();
  var goals = (db.goals||[]).filter(function(g){ return g.month === mk; });
  var h = '<div class="app-viewport"><div class="scrollable-view">';
  h += '<section class="card"><div class="card-h"><h2>' + icon('target', 22, 'var(--green)') + t('goals_title') + '</h2>' +
    '<span class="pill green">' + fmtMonth(mk) + '</span></div>';

  if (!goals.length){
    h += '<div class="empty">' + t('no_goals_set') + '</div>';
  } else {
    goals.forEach(function(g){
      var tasks = db.tasks.filter(function(t){ return t.goalId === g.id; });
      var done = 0, steps = 0;
      Object.keys(db.checkins).forEach(function(d){
        if (monthKey(d) !== g.month) return;
        tasks.forEach(function(t){
          var r = (db.checkins[d] || {})[t.id];
          if (!r || !r.steps) return;
          var sd = 0;
          t.steps.forEach(function(s){ if (r.steps[s.id]) sd++; });
          steps += sd;
          if (t.steps.length && sd >= t.steps.length) done++;
        });
      });
      var target = Math.max(0, Number(g.targetCount) || 0);
      var pct = target ? Math.min(100, Math.round(done/target*100)) : 0;

      h += '<div style="margin-bottom:12px">' +
        '<div class="row-title" style="font-size:16.5px">' + esc(g.title) + '</div>' +
        (g.desc ? '<div class="row-sub">' + esc(g.desc) + '</div>' : '') +
        '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
        '<div class="row-sub">' + t('goals_progress', { done: done, target: target, steps: steps }) + '</div>' +
        '</div>';
    });
  }
  h += '</section>';

  // Points Balance Grid
  h += '<section class="card"><div class="card-h"><h2>' + icon('coin', 22, 'var(--yellow)') + t('pts_balance_title') + '</h2></div>';
  h += '<div class="stat-grid">';
  db.categories.forEach(function(c){
    var bal = catBalance(c.id);
    var pName = catPointName(c.id, bal);
    h += '<div class="stat" style="border-left:5px solid ' + c.color + '">' +
      '<b>' + bal + ' <span style="font-size:18px;vertical-align:middle;margin-left:2px">' + pName + '</span></b>' +
      '<span>' + esc(catName(c.id)) + '</span>' +
    '</div>';
  });
  h += '</div></section>';

  h += '</div></div>';
  return h;
}

function renderRewardsViewport(){
  var tier = state.redeemTier || 'daily';
  var items = db.redeems[tier] || [];
  var today = dateKey();
  var h = '<div class="app-viewport"><div class="scrollable-view">';

  h += '<section class="card"><div class="card-h"><h2>' + icon('gift', 22, 'var(--coral)') + t('celebration_vault') + '</h2>' +
    '<span class="hint">' + t('choose_wish_hint') + '</span></div>';

  h += '<div class="seg">';
  ['daily','weekly','monthly'].forEach(function(k){
    var label = (k === 'daily') ? t('daily_tier') : ((k === 'weekly') ? t('weekly_tier') : t('monthly_tier'));
    h += '<button class="' + (tier === k ? 'active on' : '') + '" data-act="redeemTier" data-tier="' + k + '">' + label + '</button>';
  });
  h += '</div>';

  if (!items.length){
    h += '<div class="empty">' + t('no_rewards_tier') + '</div>';
  } else {
    h += '<div class="redeem-grid">';
    items.forEach(function(it){
      var col = catColor(it.catId);
      var bal = catBalance(it.catId);
      var cObj = catById(it.catId);
      var cName = catName(it.catId);
      var can = bal >= it.cost;
      var pName = catPointName(it.catId, it.cost);
      var pBalName = catPointName(it.catId, bal);
      var diff = it.cost - bal;
      h += '<div class="ri" style="border-top: 5px solid ' + col + '">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:6px">' +
          '<span class="tag" style="background:' + col + '22;color:' + col + ';font-weight:900;display:inline-flex;align-items:center;gap:4px">' +
            icon(cObj.icon || 'book', 14, col) + ' ' + esc(cName) +
          '</span>' +
          '<span class="tag pts-badge">' + it.cost + ' ' + pName + '</span>' +
        '</div>' +
        '<div class="ri-name">' + esc(it.name) + '</div>' +
        '<div class="ri-cost" style="font-size:12.5px;font-weight:800;color:' + (can ? 'var(--green-dark)' : 'var(--coral)') + '">' +
          (state.lang === 'zh'
            ? ('消耗 ' + it.cost + ' ' + pName + ' · 结余 ' + bal + ' ' + pBalName + (!can ? (' (还差 ' + diff + ' ' + pName + ')') : ''))
            : ('Requires ' + it.cost + ' ' + pName + ' · You have ' + bal + ' ' + pBalName + (!can ? (' (Need ' + diff + ' more)') : ''))) +
        '</div>' +
        (it.desc ? '<div class="hint">' + esc(it.desc) + '</div>' : '') +
        '<div class="ri-foot">' +
        (can ? '<button class="btn block yellow sm" data-act="applyRedeem" data-id="' + it.id + '">' + t('request_reward') + '</button>'
             : '<button class="btn block line sm" disabled>' + t('not_enough_stars') + '</button>') +
        '</div></div>';
    });
    h += '</div>';
  }
  h += '</section>';

  // My redemption records
  var mine = (db.redemptions || []).slice().reverse().slice(0, 10);
  h += '<section class="card"><div class="card-h"><h2>' + t('my_requests') + '</h2></div>';
  if (!mine.length){
    h += '<div class="empty">' + t('no_requests') + '</div>';
  } else {
    h += '<div class="rows">';
    mine.forEach(function(r){
      var stPill = r.status === 'approved' ? '<span class="tag" style="background:var(--mint)">' + t('status_approved') + '</span>'
                 : (r.status === 'rejected' ? '<span class="tag" style="background:var(--coral-soft)">' + t('status_rejected') + '</span>'
                 : '<span class="tag" style="background:var(--yellow-soft)">' + t('status_pending') + '</span>');
      h += '<div class="row"><div class="row-main">' +
        '<div class="row-title">' + esc(r.name) + '</div>' +
        '<div class="row-sub">' + fmtDate(r.appliedDate) + ' · ' + esc(catName(r.catId)) + ' ' + r.cost + ' ' + catPointName(r.catId, r.cost) + '</div>' +
        '</div><div class="row-acts">' + stPill + '</div></div>';
    });
    h += '</div>';
  }
  h += '</section>';

  h += '</div></div>';
  return h;
}

/* =========================================================
   Parent Settings Helper Functions & Tabs

function goalsOfMonth(mk){
  return db.goals.filter(function(g){ return !mk || g.month === mk; });
}

function tasksOfMonth(mk){
  return db.tasks.filter(function(t){ return !mk || t.month === mk; });
}

function goalOf(id){
  for (var i=0; i<db.goals.length; i++) if (db.goals[i].id === id) return db.goals[i];
  return null;
}

function goalProgress(g){
  var ts = db.tasks.filter(function(t){ return t.goalId === g.id; });
  var count = 0;
  Object.keys(db.checkins).forEach(function(dt){
    if (monthKey(dt) === g.month){
      var anyDone = ts.some(function(t){ return isTaskComplete(dt, t); });
      if (anyDone) count++;
    }
  });
  var target = Math.max(1, Number(g.targetCount) || 30);
  return { done: count, target: target, pct: Math.min(100, Math.round(count / target * 100)) };
}

function repeatLabel(wd){
  wd = (wd || []).slice().sort(function(a,b){ return a-b; });
  if (!wd.length || wd.length === 7) return state.lang==='zh' ? '每天' : 'Every day';
  if (wd.join(',') === '0,6') return state.lang==='zh' ? '周末' : 'Weekends';
  if (wd.join(',') === '1,2,3,4,5') return state.lang==='zh' ? '工作日' : 'Weekdays';
  var names = I18N[state.lang].days_short;
  return (state.lang==='zh' ? '每周 ' : 'Weekly: ') + wd.map(function(d){ return names[d]; }).join(', ');
}

function catOptions(sel){
  return db.categories.map(function(c){
    var name = (state.lang === 'zh' && c.nameZh) ? c.nameZh : c.name;
    var pt = catPointName(c.id);
    return '<option value="' + esc(c.id) + '"' + (c.id === sel ? ' selected' : '') + '>' + esc(name) + ' ' + esc(pt) + '</option>';
  }).join('');
}

function goalOptions(sel, mk){
  var opts = '<option value=""' + (!sel ? ' selected' : '') + '>' + t('no_goal_assoc') + '</option>';
  db.goals.forEach(function(g){
    if (mk && g.month !== mk) return;
    opts += '<option value="' + esc(g.id) + '"' + (g.id === sel ? ' selected' : '') + '>' + esc(fmtMonth(g.month) + ' · ' + g.title) + '</option>';
  });
  return opts;
}

function stepEditRows(d){
  var steps = d.steps || [];
  return steps.map(function(s, i){
    return '<div class="step-edit-row">' +
      '<div class="idx">' + (i+1) + '</div>' +
      '<input class="input t" data-field="stepTitle" data-idx="' + i + '" value="' + esc(s.title) + '" placeholder="' + t('step_name_placeholder') + '">' +
      '<input class="input m" type="number" min="1" max="180" data-field="stepMin" data-idx="' + i + '" value="' + (Number(s.minutes) || 5) + '">' +
      '<span class="hint" style="flex:none">' + t('step_minutes_hint') + '</span>' +
      '<button class="icon-btn soft" data-act="stepUp" data-idx="' + i + '" title="Move Up">' + icon('arrowUp', 16) + '</button>' +
      '<button class="icon-btn soft" data-act="stepDown" data-idx="' + i + '" title="Move Down">' + icon('arrowDown', 16) + '</button>' +
      '<button class="icon-btn danger" data-act="stepDel" data-idx="' + i + '" title="Delete">' + icon('trash', 16, 'var(--coral)') + '</button>' +
    '</div>';
  }).join('');
}

function draftTask(id){
  if (id){
    for (var i=0; i<db.tasks.length; i++) {
      if (db.tasks[i].id === id) {
        var tItem = db.tasks[i];
        return {
          id: tItem.id,
          month: tItem.month || monthKey(),
          goalId: tItem.goalId || '',
          title: tItem.title,
          categoryId: tItem.categoryId,
          points: Number(tItem.points) || 10,
          weekdays: (tItem.weekdays || [0,1,2,3,4,5,6]).slice(),
          steps: tItem.steps.map(function(s){ return { id: s.id, title: s.title, minutes: s.minutes }; })
        };
      }
    }
  }
  return {
    id: '',
    month: state.month || monthKey(),
    goalId: '',
    title: '',
    categoryId: (db.categories[0] || {}).id || 'cat_study',
    points: 10,
    weekdays: [0,1,2,3,4,5,6],
    steps: [
      { id: uid('st'), title: state.lang === 'zh' ? '阅读并摘录' : 'Reading and inquiry', minutes: 10 },
      { id: uid('st'), title: state.lang === 'zh' ? '反思总结' : 'Review & reflection', minutes: 5 }
    ]
  };
}

function draftGoal(id){
  if (id){
    for (var i=0; i<db.goals.length; i++) {
      if (db.goals[i].id === id) {
        var g = db.goals[i];
        return { id: g.id, month: g.month, title: g.title, desc: g.desc || '', targetCount: g.targetCount || 30 };
      }
    }
  }
  return { id: '', month: state.month || monthKey(), title: '', desc: '', targetCount: 30 };
}

function draftRedeem(tier, id){
  if (id){
    var list = db.redeems[tier] || [];
    for (var i=0; i<list.length; i++) {
      if (list[i].id === id) {
        var r = list[i];
        return { id: r.id, tier: tier, name: r.name, cost: r.cost, catId: r.catId, limit: r.limit || 0, desc: r.desc || '' };
      }
    }
  }
  return { id: '', tier: tier || 'daily', name: '', cost: 25, catId: (db.categories[0] || {}).id || 'cat_study', limit: 1, desc: '' };
}

function saveTask(draft){
  if (!draft.title.trim()){ toast(state.lang==='zh'?'请输入任务名称':'Please enter quest title', 'bad'); return false; }
  var tItem = null;
  if (draft.id){
    for (var i=0; i<db.tasks.length; i++) if (db.tasks[i].id === draft.id) tItem = db.tasks[i];
  }
  if (!tItem){
    tItem = { id: uid('task'), createdAt: Date.now(), active: true };
    db.tasks.push(tItem);
  }
  tItem.title = draft.title.trim();
  tItem.categoryId = draft.categoryId || 'cat_study';
  tItem.month = draft.month || monthKey();
  tItem.goalId = draft.goalId || '';
  tItem.points = Math.max(0, Number(draft.points) || 0);
  tItem.weekdays = (draft.weekdays && draft.weekdays.length) ? draft.weekdays.slice() : [0,1,2,3,4,5,6];
  tItem.steps = (draft.steps || []).map(function(s){
    return {
      id: s.id || uid('st'),
      title: s.title ? s.title.trim() : (state.lang==='zh'?'步骤':'Step'),
      minutes: Math.max(1, Number(s.minutes) || 5)
    };
  });
  if (!tItem.steps.length) tItem.steps = [{ id: uid('st'), title: state.lang==='zh'?'完成探究':'Complete quest', minutes: 10 }];

  syncPoints(dateKey(), tItem);
  saveDB();
  refreshAll();
  toast(t('saved_toast'), 'good');
  return true;
}

function delTask(id){
  db.tasks = db.tasks.filter(function(t){ return t.id !== id; });
  db.ledger = db.ledger.filter(function(e){ return e.taskId !== id; });
  saveDB();
  refreshAll();
  toast(t('deleted_toast'));
}

function toggleTaskActive(id){
  for (var i=0; i<db.tasks.length; i++){
    if (db.tasks[i].id === id){
      db.tasks[i].active = !db.tasks[i].active;
      break;
    }
  }
  saveDB();
  refreshAll();
}

function saveGoal(draft){
  if (!draft.title.trim()){ toast(state.lang==='zh'?'请输入目标名称':'Please enter goal title', 'bad'); return false; }
  var g = null;
  if (draft.id){
    for (var i=0; i<db.goals.length; i++) if (db.goals[i].id === draft.id) g = db.goals[i];
  }
  if (!g){
    g = { id: uid('goal'), createdAt: Date.now() };
    db.goals.push(g);
  }
  g.title = draft.title.trim();
  g.desc = draft.desc || '';
  g.month = draft.month || monthKey();
  g.targetCount = Math.max(1, Number(draft.targetCount) || 30);
  saveDB();
  refreshAll();
  toast(t('saved_toast'), 'good');
  return true;
}

function delGoal(id){
  db.goals = db.goals.filter(function(g){ return g.id !== id; });
  db.tasks.forEach(function(t){ if (t.goalId === id) t.goalId = ''; });
  saveDB();
  refreshAll();
  toast(t('deleted_toast'));
}

function saveReward(draft){
  if (!draft.name.trim()){ toast(state.lang==='zh'?'请输入心愿名称':'Please enter reward name', 'bad'); return false; }
  var tier = draft.tier || 'daily';
  if (draft.id){
    ['daily','weekly','monthly'].forEach(function(k){
      if (db.redeems[k]){
        db.redeems[k] = db.redeems[k].filter(function(x){ return x.id !== draft.id; });
      }
    });
  }
  var list = db.redeems[tier] || (db.redeems[tier] = []);
  var r = {
    id: draft.id || uid('rd'),
    tier: tier,
    name: draft.name.trim(),
    cost: Math.max(1, Number(draft.cost) || 10),
    catId: draft.catId || 'cat_study',
    limit: Math.max(0, Number(draft.limit) || 0),
    desc: draft.desc || ''
  };
  list.push(r);
  saveDB();
  refreshAll();
  toast(t('saved_toast'), 'good');
  return true;
}

function delReward(tier, id){
  if (db.redeems[tier]){
    db.redeems[tier] = db.redeems[tier].filter(function(r){ return r.id !== id; });
  }
  saveDB();
  refreshAll();
  toast(t('deleted_toast'));
}

function adjustStars(catId, delta, reason){
  delta = Number(delta) || 0;
  if (!delta){ toast(state.lang==='zh'?'请输入非零分值':'Enter non-zero stars', 'bad'); return false; }
  db.ledger.push({
    id: uid('adj'),
    ts: Date.now(),
    date: dateKey(),
    catId: catId || 'cat_study',
    delta: delta,
    reason: reason || (delta > 0 ? (state.lang==='zh'?'家长奖励':'Parent Reward') : (state.lang==='zh'?'家长调整':'Parent Deduction')),
    kind: 'adjust'
  });
  saveDB();
  refreshAll();
  toast(state.lang==='zh'?'积分已调整！':'Stars adjusted!', 'good');
  return true;
}

function setScoringMode(mode){
  db.settings.stepMode = mode === 'onComplete' ? 'onComplete' : 'perStep';
  db.tasks.forEach(function(t){
    Object.keys(db.checkins).forEach(function(d){ syncPoints(d, t); });
  });
  saveDB();
  refreshAll();
  toast(state.lang==='zh'?'计分方式已切换！':'Scoring mode updated!', 'good');
}

function syncStepDraftFromDOM(){
  if (!state.modal || state.modal.type !== 'task' || !state.modal.draft) return;
  var d = state.modal.draft;
  var titleEl = document.getElementById('taskTitleInput');
  var catEl = document.getElementById('taskCatInput');
  var ptsEl = document.getElementById('taskPointsInput');
  var monthEl = document.getElementById('taskMonthInput');
  var goalEl = document.getElementById('taskGoalInput');

  if (titleEl) d.title = titleEl.value;
  if (catEl) d.categoryId = catEl.value;
  if (ptsEl) d.points = Number(ptsEl.value) || 0;
  if (monthEl) d.month = monthEl.value;
  if (goalEl) d.goalId = goalEl.value;

  var stepRows = document.querySelectorAll('.step-edit-row');
  if (stepRows && stepRows.length && d.steps){
    for (var i=0; i<stepRows.length && i<d.steps.length; i++){
      var row = stepRows[i];
      var tIn = row.querySelector('input.t');
      var mIn = row.querySelector('input.m');
      if (tIn) d.steps[i].title = tIn.value;
      if (mIn) d.steps[i].minutes = Number(mIn.value) || 5;
    }
  }
}

   9. Modals (PIN Pad, Confirm, Tasks, Goals, Rewards, Points)

function pinDots(n){
  var s = '';
  for (var i=0; i<4; i++){
    s += '<span style="display:inline-block;width:16px;height:16px;border:2px solid var(--ink);border-radius:50%;background:' +
      (i < n ? 'var(--green)' : 'var(--paper)') + ';transition:all 0.12s ease"></span>';
  }
  return s;
}

function renderModal(){
  var layer = document.getElementById('modalLayer');
  if (!layer) return;
  var m = state.modal;
  if (!m){ layer.hidden = true; layer.innerHTML = ''; return; }
  layer.hidden = false;

  var fCancel = '<button class="btn soft sm" data-act="closeModal">' + t('modal_cancel') + '</button>';

  // 1. PIN Keypad
  if (m.type === 'pin'){
    var n = (m.draft.pin || '').length;
    var pad = '';
    for (var i=1; i<=9; i++) pad += '<button class="pin-key" data-act="pinKey" data-key="' + i + '">' + i + '</button>';
    pad += '<button class="pin-key action" data-act="pinBack">⌫</button>';
    pad += '<button class="pin-key" data-act="pinKey" data-key="0">0</button>';
    pad += '<button class="pin-key action" data-act="pinOk" style="background:var(--green);color:#fff">' + icon('check', 18, '#fff') + '</button>';

    layer.innerHTML = '<div class="modal-mask" data-act="maskClose"><div class="modal" role="dialog">' +
      '<div class="modal-h"><h3>' + t('pin_enter') + '</h3><button class="icon-btn" data-act="closeModal">' + icon('close', 16) + '</button></div>' +
      '<div class="modal-b" style="text-align:center">' +
      '<div class="hint" style="margin-bottom:14px">' + t('pin_hint') + '</div>' +
      '<div style="display:flex;gap:12px;justify-content:center;margin-bottom:16px">' + pinDots(n) + '</div>' +
      '<div class="pin-pad">' + pad + '</div>' +
      '</div></div></div>';
    return;
  }

  // 2. Change PIN
  if (m.type === 'pinChange'){
    var dPin = m.draft || {};
    layer.innerHTML = '<div class="modal-mask" data-act="maskClose"><div class="modal" role="dialog">' +
      '<div class="modal-h"><h3>' + t('change_pin') + '</h3><button class="icon-btn" data-act="closeModal">' + icon('close', 16) + '</button></div>' +
      '<div class="modal-b">' +
        '<div class="field"><label>' + t('pin_new') + '</label><input class="input" type="password" maxlength="4" inputmode="numeric" id="modalPin1" value="' + esc(dPin.pin1 || '') + '"></div>' +
        '<div class="field"><label>' + t('pin_confirm') + '</label><input class="input" type="password" maxlength="4" inputmode="numeric" id="modalPin2" value="' + esc(dPin.pin2 || '') + '"></div>' +
      '</div>' +
      '<div class="modal-f">' + fCancel + '<button class="btn sm green" data-act="savePinChange">' + t('modal_save') + '</button></div>' +
    '</div></div>';
    return;
  }

  // 3. Confirm Modal
  if (m.type === 'confirm'){
    layer.innerHTML = '<div class="modal-mask" data-act="maskClose"><div class="modal" role="dialog">' +
      '<div class="modal-h"><h3>' + (m.title || t('modal_confirm')) + '</h3><button class="icon-btn" data-act="closeModal">' + icon('close', 16) + '</button></div>' +
      '<div class="modal-b"><p style="font-size:16px;font-weight:700">' + esc(m.text) + '</p></div>' +
      '<div class="modal-f">' +
        fCancel +
        '<button class="btn sm ' + (m.danger ? 'coral' : 'green') + '" data-act="doConfirm">' + (m.confirmLabel || t('modal_confirm')) + '</button>' +
      '</div></div></div>';
    return;
  }

  // 4. Task Modal
  if (m.type === 'task'){
    var dt = m.draft || {};
    var wds = dt.weekdays || [0,1,2,3,4,5,6];
    var dayButtons = [1,2,3,4,5,6,0].map(function(dw){
      var on = wds.indexOf(dw) >= 0;
      var lbl = I18N[state.lang].days_short[dw];
      return '<button class="day-btn ' + (on ? 'on' : '') + '" data-act="dayToggle" data-day="' + dw + '">' + lbl + '</button>';
    }).join('');

    layer.innerHTML = '<div class="modal-mask" data-act="maskClose"><div class="modal" role="dialog" style="max-width:620px">' +
      '<div class="modal-h"><h3>' + (dt.id ? (state.lang==='zh'?'编辑任务':'Edit Quest') : t('add_new_task')) + '</h3><button class="icon-btn" data-act="closeModal">' + icon('close', 16) + '</button></div>' +
      '<div class="modal-b">' +
        '<div class="field"><label>' + t('task_title') + '</label><input class="input" id="taskTitleInput" value="' + esc(dt.title) + '" placeholder="' + (state.lang==='zh'?'例如：自主阅读与反思':'e.g. Reading & Inquiry') + '"></div>' +
        '<div class="grid2">' +
          '<div class="field"><label>' + t('task_cat') + '</label><select class="input" id="taskCatInput">' + catOptions(dt.categoryId) + '</select></div>' +
          '<div class="field"><label>' + t('task_pts') + '</label><input class="input" type="number" min="0" max="1000" id="taskPointsInput" value="' + (Number(dt.points) || 10) + '"></div>' +
        '</div>' +
        '<div class="grid2">' +
          '<div class="field"><label>' + t('goal_month') + '</label><input class="input" type="month" id="taskMonthInput" value="' + esc(dt.month || monthKey()) + '"></div>' +
          '<div class="field"><label>' + t('task_goal') + '</label><select class="input" id="taskGoalInput">' + goalOptions(dt.goalId, dt.month) + '</select></div>' +
        '</div>' +
        '<div class="field"><label>' + t('task_days') + '</label><div class="day-pick">' + dayButtons + '</div></div>' +
        '<div class="field"><label>' + t('task_steps') + '</label>' +
          '<div class="step-edit-list">' + stepEditRows(dt) + '</div>' +
          '<button class="btn sm soft block" data-act="stepAdd">' + icon('plus', 16) + ' ' + t('add_step') + '</button>' +
        '</div>' +
      '</div>' +
      '<div class="modal-f">' +
        fCancel +
        '<button class="btn sm green" data-act="saveTaskModal">' + t('modal_save') + '</button>' +
      '</div>' +
    '</div></div>';
    return;
  }

  // 5. Goal Modal
  if (m.type === 'goal'){
    var dg = m.draft || {};
    layer.innerHTML = '<div class="modal-mask" data-act="maskClose"><div class="modal" role="dialog">' +
      '<div class="modal-h"><h3>' + (dg.id ? (state.lang==='zh'?'编辑目标':'Edit Goal') : t('add_new_goal')) + '</h3><button class="icon-btn" data-act="closeModal">' + icon('close', 16) + '</button></div>' +
      '<div class="modal-b">' +
        '<div class="field"><label>' + t('goal_title') + '</label><input class="input" id="goalTitleInput" value="' + esc(dg.title) + '" placeholder="' + (state.lang==='zh'?'例如：自主学习与习惯养成':'e.g. Daily Self-Management') + '"></div>' +

function saveTaskModal(){
  var m = state.modal;
  if (!m || m.type !== 'task') return;
  var d = m.draft;
  var titleEl = document.getElementById('taskTitleInput');
  var catEl = document.getElementById('taskCatInput');
  var ptsEl = document.getElementById('taskPointsInput');
  var monthEl = document.getElementById('taskMonthInput');
  var goalEl = document.getElementById('taskGoalInput');

  if (titleEl) d.title = titleEl.value;
  if (catEl) d.categoryId = catEl.value;
  if (ptsEl) d.points = Number(ptsEl.value) || 0;
  if (monthEl) d.month = monthEl.value;
  if (goalEl) d.goalId = goalEl.value;

  if (!d.title.trim()){
    toast(state.lang==='zh'?'请输入任务名称':'Please enter quest title', 'bad');
    return;
  }

  var stepRows = document.querySelectorAll('.step-edit-row');
  if (stepRows && stepRows.length){
    d.steps = [];
    for (var i=0; i<stepRows.length; i++){
      var row = stepRows[i];
      var tIn = row.querySelector('input.t');
      var mIn = row.querySelector('input.m');
      d.steps.push({
        id: uid('st'),
        title: (tIn && tIn.value.trim()) ? tIn.value.trim() : (state.lang==='zh'?'步骤 '+(i+1):'Step '+(i+1)),
        minutes: (mIn && Number(mIn.value)) ? Number(mIn.value) : 5
      });
    }
  }

  if (saveTask(d)){
    state.modal = null;
    refreshAll();
  }
}

function saveCatModal(){
