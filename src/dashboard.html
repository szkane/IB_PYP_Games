/* =========================================================
   10. App Render Loop & Full-Screen Focus Timer
   ========================================================= */
function renderTimerLayer(){
  var lay = document.getElementById('timerLayer');
  if (!lay) return;
  var tm = db.timer;
  if (!tm || !tm.taskId || !tm.stepId){
    lay.hidden = true;
    lay.style.display = 'none';
    lay.innerHTML = '';
    return;
  }

  var task = null;
  for (var i=0; i<db.tasks.length; i++) if (db.tasks[i].id === tm.taskId) task = db.tasks[i];
  if (!task){
    db.timer = null;
    lay.hidden = true;
    lay.style.display = 'none';
    lay.innerHTML = '';
    return;
  }

  var step = null;
  var stepIdx = 0;
  for (var j=0; j<task.steps.length; j++){
    if (task.steps[j].id === tm.stepId){
      step = task.steps[j];
      stepIdx = j;
    }
  }
  if (!step){
    db.timer = null;
    lay.hidden = true;
    lay.style.display = 'none';
    lay.innerHTML = '';
    return;
  }

  var color = catColor(task.categoryId);
  var cName = catName(task.categoryId);
  var cEmoji = catPointEmoji(task.categoryId);
  var pts = stepPoints(task);
  var sPts = pts[stepIdx] || Math.round(task.points / task.steps.length);
  var targetMin = step.minutes || 5;

  var focusHint = (state.lang === 'zh')
    ? '沉浸专注，向着目标全速前进！✨'
    : 'Deep Focus Mode · Do your best! ✨';
  var targetLabel = (state.lang === 'zh')
    ? ('目标建议: ' + targetMin + ' 分钟')
    : ('Target: ' + targetMin + ' min');
  var rewardLabel = '+' + sPts + ' ' + cEmoji;

  lay.innerHTML = '<div class="timer-focus-card" style="--c:' + color + '">' +
    '<div class="timer-focus-header">' +
      '<div class="timer-focus-cat-tag" style="background:' + color + '">' + cEmoji + ' ' + esc(cName) + ' · ' + rewardLabel + '</div>' +
      '<div class="timer-focus-quest">' + esc(task.title) + '</div>' +
      '<div class="timer-focus-step">' + (stepIdx+1) + '. ' + esc(step.title) + '</div>' +
    '</div>' +
    '<div class="timer-clock-wrap">' +
      '<div class="timer-clock-val" data-timer-live data-start="' + tm.startTs + '">00:00</div>' +
      '<div class="timer-clock-target">' + targetLabel + '</div>' +
    '</div>' +
    '<div class="timer-focus-hint">' + focusHint + '</div>' +
    '<div class="timer-focus-actions">' +
      '<button class="timer-btn-finish" data-act="finishStep" data-date="' + tm.date + '" data-id="' + task.id + '" data-step="' + step.id + '">' +
        icon('check', 20, '#fff') + ' ' + t('btn_done') +
      '</button>' +
      '<button class="timer-btn-cancel" data-act="cancelTimer">' +
        t('btn_cancel') +
      '</button>' +
    '</div>' +
  '</div>';

  lay.hidden = false;
  lay.style.display = 'flex';
}

function renderApp(){
  var app = document.getElementById('app');
  if (!app) return;

  var viewportHtml = '';
  if (state.activeNav === 'tasks') viewportHtml = renderTasksViewport();
  else if (state.activeNav === 'goals') viewportHtml = renderGoalsViewport();
  else if (state.activeNav === 'rewards') viewportHtml = renderRewardsViewport();
  else if (state.activeNav === 'parent') viewportHtml = renderParentViewport();

  var catBarHtml = (state.activeNav === 'tasks') ? renderCategoryBar() : '';
  app.innerHTML = renderTopbar() + catBarHtml + viewportHtml + renderBottomBar();
  renderModal();
  renderTimerLayer();
  updateTimerLabels();
}

function refreshAll(){
  renderApp();
}

var toastTimer = null;
function toast(msg, kind){
  var layer = document.getElementById('toastLayer');
  if (!layer) return;
  layer.innerHTML = '<div class="toast ' + (kind||'') + '"><span>' + esc(msg) + '</span></div>';
  layer.classList.add('on');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ layer.classList.remove('on'); }, 2000);
}

function updateTimerLabels(){
  var nodes = document.querySelectorAll('[data-timer-live]');
  for (var i=0; i<nodes.length; i++){
    var n = nodes[i];
    var start = Number(n.getAttribute('data-start')) || 0;
    var sec = Math.round((Date.now() - start)/1000);
    n.textContent = fmtDur(sec);
  }
}
setInterval(updateTimerLabels, 1000);

/* =========================================================
   11. Event Delegation
   ========================================================= */
function onAppClick(e){
  if (e.target && (e.target.id === 'celebrationLayer' || e.target.classList.contains('celebration-layer'))){
    closeCelebration();
    return;
  }
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el) return;
  if (el.disabled || el.hasAttribute('disabled')) return;
  var act = el.getAttribute('data-act');
  var id = el.getAttribute('data-id') || '';
  var date = el.getAttribute('data-date') || dateKey();
  var step = el.getAttribute('data-step') || '';
  var cat = el.getAttribute('data-cat') || '';
  var nav = el.getAttribute('data-nav') || '';
  var lang = el.getAttribute('data-lang') || '';
  var tier = el.getAttribute('data-tier') || '';
  var tab = el.getAttribute('data-tab') || '';
  var mode = el.getAttribute('data-mode') || '';

  switch (act){
    case 'closeCelebration': closeCelebration(); return;
    case 'lang': switchLang(lang); return;
    case 'catTab': state.activeCategory = cat; refreshAll(); return;
    case 'parentTab': state.parentTab = tab; refreshAll(); return;
    case 'nav':
      if (nav === 'parent' && !state.parentUnlocked){
        state.modal = { type:'pin', draft:{ pin:'' } };
        refreshAll(); return;
      }
      state.activeNav = nav; refreshAll(); return;
    case 'lockParent':
      state.parentUnlocked = false; state.activeNav = 'tasks'; toast(t('locked_back')); refreshAll(); return;
    case 'redeemTier': state.redeemTier = tier; refreshAll(); return;
    case 'startTimer': startTimer(date, id, step); return;
    case 'cancelTimer': cancelTimer(); return;
    case 'finishStep': finishStep(date, id, step); return;
    case 'undoStep': undoStep(date, id, step); return;
    case 'applyRedeem': applyRedeem(id); return;
    case 'approveRedeem': approveRedeem(id); return;
    case 'rejectRedeem': rejectRedeem(id); return;

    // Parent Settings Actions
    case 'stepMode': setScoringMode(mode); return;
    case 'taskNew': state.modal = { type:'task', draft: draftTask('') }; refreshAll(); return;
    case 'taskEdit': state.modal = { type:'task', draft: draftTask(id) }; refreshAll(); return;
    case 'taskDel':
      state.modal = {
        type: 'confirm',
        title: state.lang==='zh'?'删除任务':'Delete Quest',
        danger: true,
        text: t('del_task_confirm'),
        confirmLabel: state.lang==='zh'?'删除':'Delete',
        action: 'taskDel',
        targetId: id
      };
      refreshAll();
      return;
    case 'toggleActive': toggleTaskActive(id); return;
    case 'goalNew': state.modal = { type:'goal', draft: draftGoal('') }; refreshAll(); return;
    case 'goalEdit': state.modal = { type:'goal', draft: draftGoal(id) }; refreshAll(); return;
    case 'goalDel':
      state.modal = {
        type: 'confirm',
        title: state.lang==='zh'?'删除目标':'Delete Goal',
        danger: true,
        text: t('del_goal_confirm'),
        confirmLabel: state.lang==='zh'?'删除':'Delete',
        action: 'goalDel',
        targetId: id
      };
      refreshAll();
      return;
    case 'catEdit': state.modal = { type:'cat', draft:{ id: id } }; refreshAll(); return;
    case 'adjustPoints': state.modal = { type:'adjustPoints' }; refreshAll(); return;
    case 'rdNew': state.modal = { type:'redeem', draft: draftRedeem(tier, '') }; refreshAll(); return;
    case 'rdEdit': state.modal = { type:'redeem', draft: draftRedeem(tier, id) }; refreshAll(); return;
    case 'rdDel':
      state.modal = {
        type: 'confirm',
        title: state.lang==='zh'?'删除心愿':'Delete Reward',
        danger: true,
        text: t('del_reward_confirm'),
        confirmLabel: state.lang==='zh'?'删除':'Delete',
        action: 'rdDel',
        targetId: id,
        targetTier: tier
      };
      refreshAll();
      return;
    case 'pickRedeemCat':
      if (state.modal && state.modal.draft){
        var nameEl = document.getElementById('rdNameInput');
        var costEl = document.getElementById('rdCostInput');
        var tierEl = document.getElementById('rdTierInput');
        var limitEl = document.getElementById('rdLimitInput');
        var descEl = document.getElementById('rdDescInput');
        if (nameEl) state.modal.draft.name = nameEl.value;
        if (costEl) state.modal.draft.cost = Number(costEl.value) || 10;
        if (tierEl) state.modal.draft.tier = tierEl.value;
        if (limitEl) state.modal.draft.limit = Number(limitEl.value) || 0;
        if (descEl) state.modal.draft.desc = descEl.value;

        var targetCat = cat || (el ? el.getAttribute('data-cat') : '') || (e.target && e.target.closest ? (e.target.closest('[data-cat]') ? e.target.closest('[data-cat]').getAttribute('data-cat') : '') : '');
        if (targetCat){
          state.modal.draft.catId = targetCat;
          var hiddenIn = document.getElementById('rdCatInput');
          if (hiddenIn) hiddenIn.value = targetCat;
          renderModal();
        }
      }
      return;

    // Modal Saving
    case 'saveTaskModal': saveTaskModal(); return;
    case 'saveGoalModal': saveGoalModal(); return;
    case 'saveCatModal': saveCatModal(); return;
    case 'saveAdjustModal': saveAdjustModal(); return;
    case 'saveRedeemModal': saveRedeemModal(); return;
    case 'savePinChange': savePinChangeModal(); return;
    case 'saveChildName': saveChildName(); return;
    case 'pinChange': state.modal = { type:'pinChange', draft:{} }; refreshAll(); return;

    // Step List in Modal
    case 'stepAdd':
      if (state.modal && state.modal.draft && state.modal.draft.steps){
        syncStepDraftFromDOM();
        state.modal.draft.steps.push({ id: uid('st'), title: '', minutes: 5 });
        refreshAll();
      }
      return;
    case 'stepDel':
      if (state.modal && state.modal.draft && state.modal.draft.steps){
        syncStepDraftFromDOM();
        var idx = Number(el.getAttribute('data-idx'));
        if (state.modal.draft.steps.length > 1){
          state.modal.draft.steps.splice(idx, 1);
          refreshAll();
        } else {
          toast(state.lang==='zh'?'至少保留一个步骤':'Keep at least 1 step', 'bad');
        }
      }
      return;
    case 'stepUp':
    case 'stepDown':
      if (state.modal && state.modal.draft && state.modal.draft.steps){
        syncStepDraftFromDOM();
        var idx = Number(el.getAttribute('data-idx'));
        var targetIdx = act === 'stepUp' ? idx - 1 : idx + 1;
        var arr = state.modal.draft.steps;
        if (targetIdx >= 0 && targetIdx < arr.length){
          var tmp = arr[idx];
          arr[idx] = arr[targetIdx];
          arr[targetIdx] = tmp;
          refreshAll();
        }
      }
      return;
    case 'dayToggle':
      if (state.modal && state.modal.draft && state.modal.draft.weekdays){
        syncStepDraftFromDOM();
        var dw = Number(el.getAttribute('data-day'));
        var wds = state.modal.draft.weekdays;
        var wpos = wds.indexOf(dw);
        if (wpos >= 0) wds.splice(wpos, 1); else wds.push(dw);
        refreshAll();
      }
      return;

    // PIN Keypad
    case 'pinKey':
      if (state.modal && state.modal.type === 'pin'){
        state.modal.draft.pin = (state.modal.draft.pin || '') + el.getAttribute('data-key');
        refreshAll();
        if (state.modal.draft.pin.length === 4){
          if (state.modal.draft.pin === String(db.settings.parentPin)){
            state.parentUnlocked = true;
            state.activeNav = 'parent';
            state.modal = null;
            refreshAll();
            toast(t('pin_unlocked'), 'good');
          } else {
            toast(t('pin_wrong'), 'bad');
            state.modal.draft.pin = '';
            refreshAll();
          }
        }
      }
      return;
    case 'pinBack':
      if (state.modal && state.modal.type === 'pin'){
        state.modal.draft.pin = (state.modal.draft.pin || '').slice(0, -1);
        refreshAll();
      }
      return;
    case 'pinOk':
      if (state.modal && state.modal.type === 'pin'){
        if (state.modal.draft.pin === String(db.settings.parentPin)){
          state.parentUnlocked = true;
          state.activeNav = 'parent';
          state.modal = null;
          refreshAll();
          toast(t('pin_unlocked'), 'good');
        } else {
          toast(t('pin_wrong'), 'bad');
          state.modal.draft.pin = '';
          refreshAll();
        }
      }
      return;
    case 'closeModal': state.modal = null; refreshAll(); return;
    case 'maskClose':
      if (e.target && e.target.classList && e.target.classList.contains('modal-mask')){
        state.modal = null; refreshAll();
      }
      return;
    case 'expJson': {
      var data = JSON.stringify(db, null, 2);
      var blob = new Blob([data], { type:'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'hilson-quest-backup-' + dateKey() + '.json';
      document.body.appendChild(a); a.click();
      setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
      toast('Backup exported', 'good');
      return;
    }
    case 'impJson': {
      var f = document.getElementById('impFile');
      if (f){ f.value = ''; f.click(); }
      return;
    }
    case 'demoReset':
      state.modal = { type:'confirm', title:t('reset_demo'), danger:false,
        text: state.lang==='zh'?'确定重置为示例任务吗？现有数据将被覆盖。':'Reset all quests to demo English version?',
        confirmLabel:t('reset_demo'), action:'resetDemo' };
      refreshAll(); return;
    case 'clearAll':
      state.modal = { type:'confirm', title:t('clear_all'), danger:true,
        text: state.lang==='zh'?'确定清空所有数据吗？此操作不可逆。':'Clear all data permanently?',
        confirmLabel:t('clear_all'), action:'clearAll' };
      refreshAll(); return;
    case 'doConfirm':
      if (state.modal){
        var mAct = state.modal.action;
        var tId = state.modal.targetId;
        var tTier = state.modal.targetTier;
        var payload = state.modal.payload;
        state.modal = null;

        if (mAct === 'taskDel') delTask(tId);
        else if (mAct === 'goalDel') delGoal(tId);
        else if (mAct === 'rdDel') delReward(tTier, tId);
        else if (mAct === 'resetDemo') { db = seedDemo(); saveDB(); refreshAll(); toast('Demo quests reset', 'good'); }
        else if (mAct === 'clearAll') { db = blankDB(); saveDB(); refreshAll(); toast('All data cleared'); }
        else if (mAct === 'import') { db = payload; saveDB(); refreshAll(); toast('Data restored', 'good'); }
        else refreshAll();
      }
      return;
    default: return;
  }
}

function onAppChange(e){
  if (e.target.id === 'impFile'){
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var obj = JSON.parse(String(reader.result));
        if (!obj || !obj.categories || !obj.tasks) throw new Error('Invalid');
        state.modal = { type:'confirm', title:t('import_json'), text:'Replace current data with imported backup?',
          confirmLabel:t('import_json'), action:'import', payload:obj };
        refreshAll();
      }catch(err){ toast('Invalid file format', 'bad'); }
    };
    reader.readAsText(file);
  }
}

/* =========================================================
   12. Init
   ========================================================= */
function init(){
  db = loadDB();
  // Always verify categories match the 4 requested: Study, Earn Money, Sport, Life
  var hasNewCategories = db && db.categories && db.categories.some(function(c){ return c.id === 'cat_money'; });
  if (!db || !hasNewCategories){
    db = seedDemo();
    saveDB();
  }
  state.month = monthKey();
  document.documentElement.lang = state.lang === 'zh' ? 'zh-CN' : 'en';

  document.addEventListener('click', onAppClick);
  document.addEventListener('change', onAppChange);

  refreshAll();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
</body>
</html>
