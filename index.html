<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=src/index.html">
  <title>IB PYP Games | UOI Learning Map</title>
  <style>
    :root {
      --ink: #17211f;
      --paper: #fffaf0;
      --yellow: #f2b84b;
      --green: #2f6f62;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--paper);
      color: var(--ink);
      font-family: ui-rounded, "Avenir Next", "Segoe UI", sans-serif;
    }

    main {
      width: min(560px, 100%);
      border: 2px solid var(--ink);
      border-radius: 8px;
      padding: 28px;
      background: white;
      box-shadow: 6px 6px 0 var(--ink);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 8vw, 3.4rem);
      line-height: 1;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 22px;
      color: #5d6a66;
      line-height: 1.6;
      font-weight: 700;
    }

    a {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--ink);
      border-radius: 8px;
      padding: 10px 16px;
      background: var(--yellow);
      color: var(--ink);
      box-shadow: 4px 4px 0 var(--ink);
      font-weight: 900;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 3px solid var(--green);
      outline-offset: 3px;
    }
  </style>
</head>

<body>
  <main>
    <h1>IB PYP Games</h1>
    <p>Opening the new Grade, Unit, and Subject learning map.</p>
    <a href="src/index.html">Open PYP Learning Map</a>
  </main>
</body>

</html>
